]
replacement_gate = "A new constitutive source may replace the discrete SolidWorks FEA per-arm law only through separate review. A maneuver-specific wheel-load/body-roll/load-transfer model additionally requires a separately reviewed whole-vehicle equilibrium problem with explicit body coordinates, contact constraints, external loads, and residual equations."
prohibited_inference = [
  "Do not interpolate between blade settings.",
  "Do not average, blend, or stack SolidWorks FEA, Simulink, Instron, or historical effective-axle stiffness values.",
  "Do not present 2560/2270 N*m/deg as governing blade stiffness or use it to back-fit the mechanism map.",
