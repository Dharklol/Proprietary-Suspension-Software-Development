[record]
id = "ASM-SUSP-0003"
type = "assumption"
title = "WUFR-27 zero-preload, discrete per-arm blade stiffness, and non-installed ARB boundary"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "Freeze the reviewer-declared WUFR-27 anti-roll-bar design-intent boundary. The nominal setup uses zero intentional ARB preload. The corrected governing constitutive authority is the SolidWorks FEA single-blade-arm tip stiffness column from Google Sheet ARB FEA vs Simulink: discrete settings 1..5 = 280/300/400/700/2300 N/mm. Historical effective-axle, Simulink, and Instron values are comparison-only. AUTH-SUSP-0006 freezes the nominal Z-bar fixture, AUTH-SUSP-0007 resolves the source stiffness as one-arm transverse tip stiffness with additive two-arm energy, AUTH-SUSP-0008 authorizes the verified rocker-coordinate mechanism map/Jacobian, and AUTH-SUSP-0009 authorizes the signed chain into left/right MOD-SUSP-0002 physical wheel-center vertical coordinates. Whole-vehicle equilibrium, tire/contact loads, and installed/as-built claims remain unauthorized."
assumptions = [
  "Reviewer/user statement on 2026-07-26: nominal WUFR ARB setup uses zero intentional preload.",
  "Reviewer/user correction on 2026-07-26: use SolidWorks FEA blade-tip stiffness from Google Sheet ARB FEA vs Simulink as governing authority: settings 1..5 = 280, 300, 400, 700, 2300 N/mm.",
  "Source-semantics recovery identifies those values as one blade-arm transverse tip stiffnesses. Convert N/mm to SI N/m by multiplying by 1000 and use the same selected k_b on both arms.",
  "The installed ideal two-arm energy is U=0.5*k_b*(d_L^2+d_R^2); no factor-two, half, sqrt(2), averaging, blending, or duplicate-energy correction is introduced.",
  "Settings are discrete. Interpolation, averaging, blending, or stacking stiffness sources is not authorized.",
  "Historical 2560/2270 N*m/deg are downstream setting-1 effective axle roll-stiffness comparison values, not an independent or governing blade constitutive source.",
  "Simulink 285/309/400/724/2628 N/mm and Instron 900/980/1320/1970/2630 N/mm are comparison-only and must not be averaged or stacked with SolidWorks FEA stiffness.",
  "AUTH-SUSP-0006 supplies only named nominal mechanism geometry; AUTH-SUSP-0007/0008 subsequently authorize the two-arm elastic coordinates and rocker-coordinate mechanism map without changing the fixture source authority.",
  "AUTH-SUSP-0009 composes signed rho_rw=d(theta_R)/d(delta_z_wc_body) from the reviewed physical-wheel and rocker solvers into Q_z. Historical motion ratios, body roll, wheel-travel difference, and track width are not substitutes for this chain.",
  "Zero intentional preload means the named nominal two-arm blade state is the zero-energy constitutive reference; it does not authorize hidden offset repair.",
  "Q_z is work-conjugate to the two physical wheel-center vertical generalized coordinates only. It is not a maneuver-specific tire normal-force change or whole-vehicle load-transfer result."
]
severity = "high"
