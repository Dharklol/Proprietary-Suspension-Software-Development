[record]
id = "BENCH-SUSP-0012"
type = "benchmark"
title = "WUFR-27 discrete blade-stiffness authority benchmark"
status = "proposed"
description = "Verify the WUFR anti-roll-bar governing constitutive authority from the SolidWorks FEA blade-tip stiffness column in the Google Sheet tab ARB FEA vs Simulink, including exact discrete settings, SI conversion, the frozen 1 mm blade-law results, comparison-only source boundaries, and the explicit absence of a WUFR Z-bar suspension-to-blade deformation map."
verification_level = "B"
target_ids = ["MOD-SUSP-0005", "EQ-SUSP-0016", "EQ-SUSP-0017", "EQ-SUSP-0018", "ASM-SUSP-0003"]
acceptance_criteria = [
  "The governing WUFR stiffness source is the Google Sheet tab ARB FEA vs Simulink, column FEA SolidWorks Stiffness.",
  "Settings 1..5 are exactly 280, 300, 400, 700, and 2300 N/mm, stored in SI as 280000, 300000, 400000, 700000, and 2300000 N/m.",
  "The sheet beam-theory expressions use k=3EI/L^3 and divide by 1000 from N/m to N/mm, confirming that the governing values are linear blade-tip force/deflection stiffness rather than N*m/deg.",
  "The WUFR blade law is F_b=k_b*delta_b, U_b=0.5*k_b*delta_b^2, and Q_ARB=-J_delta_b^T*F_b only when a reviewed deformation Jacobian is available.",
  "At delta_b=1 mm, settings 1..5 return force magnitudes 280, 300, 400, 700, and 2300 N and energies 0.140, 0.150, 0.200, 0.350, and 1.150 J.",
  "Blade setting selection is discrete. No interpolation, averaging, blending, or source stacking is authorized.",
  "MATLAB reduced axle values 2560/2270 N*m/deg are comparison-only evidence and are not governing blade stiffness.",
  "Simulink 285/309/400/724/2628 N/mm and Instron 900/980/1320/1970/2630 N/mm remain comparison-only and are not averaged or stacked with the SolidWorks FEA values.",
  "The WUFR map (q_L,q_R)->delta_b and partial(delta_b)/partial(q_L,q_R) is not authorized or implemented. The benchmark must not infer it from body roll, wheel travel, track width, or CAD sketch ordering.",
  "Without a reviewed WUFR Jacobian, the provider may return blade force and energy for an externally supplied delta_b but must not claim vehicle-coordinate generalized ARB force."
]
fixture = "data_catalog/wufr27_anti_roll_bar_package_v0.toml"
implementation = "src/pssd_suspension/anti_roll_bar.py; src/pssd_suspension/wufr_anti_roll_bar.py"
implementation_tests = ["tests/test_suspension_anti_roll_bar.py", "tests/test_suspension_anti_roll_bar_result_record.py"]
report_script = "scripts/run_suspension_anti_roll_bar_benchmarks.py"
result_record = "benchmarks/suspension/suspension_anti_roll_bar_result_v0.1.0.toml"
