title = "WUFR source contact-reference transport reconstruction"
status = "proposed"
description = "Verify that the frozen OptimumK Contact Patch evidence is consistent with a source-defined nominal upright-attached contact reference, while keeping historical source steering separate from the WUFR runtime centered-rack steering provider."
