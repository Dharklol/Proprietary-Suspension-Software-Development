target_ids = ["MOD-VEH-0006", "EQ-VEH-0011"]
acceptance_criteria = [
  "At nominal state, the four frozen contact-reference points reproduce the OptimumK Contact Patch channels: front x=0, |y|=0.61598556 m, z=0 and rear x=-1.5624 m, |y|=0.60328556 m, z=0 within source-rounding tolerance.",
  "For the selected front-left pure-heave rows in WUFR26_ROAD_CONTACT_REFERENCE_V0, apply the already-reviewed EQ-SUSP-0003 minimum-twist transform to the nominal contact reference, then apply the independently reconstructed historical EQ-SUSP-0008 source twist about the current steering axis. The reconstructed point agrees with the frozen OptimumK Contact Patch body-frame point within 5e-6 m Euclidean distance.",
  "The same reconstruction uses the source 3D twist from WUFR26_OPTIMUMK_HEAVE_FRONT_LEFT_WHEEL_REFERENCE_SOURCE_V0; the scalar OptimumK Steer Angle is not used as a rotation input.",
  "A synthetic rear rigid-upright transform test verifies that rear contact reference and wheel center are transported by the same reviewed rear upright transform without a second toe/steering solve.",
  "Historical source-twist reconstruction is verification-only. The WUFR runtime front contact provider uses MOD-STEER-0001 centered-rack closure on the MOD-SUSP-0002 minimum-twist pose."
]
source_configuration = "WUFR-26 OptimumK 8.21 design-source result carried into unchanged WUFR-27 R&D baseline"
