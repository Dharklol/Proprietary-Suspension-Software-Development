[record]
id = "BENCH-STEER-0001"
type = "benchmark"
title = "WUFR-26 final steering design-source and physical correlation"
status = "active"
description = "Frozen descriptive Level E comparison of the rigid steering evaluator with the selected Test 3 projected-wheel-angle fit, the WUFR-26 FDR endpoint turn-angle observations, GEOMETRY FINAL.SLDPRT evidence, and the supplementary 2026Ackermann.csv Dimension2 monitor. Level F installed-state validation remains open."
