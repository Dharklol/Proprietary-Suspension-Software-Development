acceptance_criteria = [
  "GEOMETRY FINAL.SLDPRT, the design-study input mapping, source identities, and project hashes are recorded",
  "The exact steering FDR artifact and final-geometry table are catalogued and hashed when immutable metadata is available",
  "The nominal CAD left/right hardpoints use the team-confirmed exact reflection rule",
  "The centered rack coordinate maps from SolidWorks [0, 162.865, -79.298] mm to canonical [-0.079298, 0, 0.162865] m",
  "Static toe and camber use the WUFR-26 setup sheet and remain separate from incremental steer",
  "The selected configuration is Test 3 and the frozen full-curve reference is the Test 3 projected-wheel-angle fit",
  "The FDR full-input projected turn-angle observations of 22.22 deg and 32.81 deg are retained as endpoint design-intent cross-checks",
  "The historical input, side, output-sign, and static-datum adapter is explicit and frozen",
  "The 205-point total and incremental residuals, center behavior, full-lock behavior, symmetry, branch handling, and discontinuities are reported",
  "The frozen Level E result remains descriptive with no pass/fail tolerance derived from the observed residuals",
  "Dimension2 remains a supplementary internal-monitor diagnostic rather than a road-wheel-heading validation signal",
  "Identification data, fitted curves, and FDR design-review values are not reused as independent physical validation",
  "Level F requires measured rack position and both projected wheel headings with bidirectional sweeps, repeatability, backlash, compliance, and uncertainty",
  "Installed rack stops, installed transmission, setup state, and physical left/right asymmetry are measured before as-built claims",
  "Non-selected candidate studies remain separate regression cases"
]
