[record]
id = "BENCH-VEH-0001"
type = "benchmark"
title = "Explicit vehicle operating-state source and tire-bridge preservation"
status = "proposed"
description = "Verify that current WUFR development wheel-load states can be represented without embedding a new vehicle solver, changing source values, inventing missing tire inputs, or clipping an invalid negative normal load, while preserving a clean bridge to the PR28 tire operating-point contract."
verification_level = "B"
target_ids = ["MOD-VEH-0001", "MOD-STEER-0002"]
acceptance_criteria = [
  "The Suspension Calculations 2026 source is frozen by path and SHA256 revision and its source right-turn-positive acceleration convention is converted explicitly to canonical +y-left acceleration rather than guessed downstream.",
  "The 1.2g right-turn evidence state preserves FL/FR/RL/RR loads 1719.575445, 186.2139907, 1737.984573, and 173.2530798 N and total normal load 3817.0270885 N.",
  "The 1.2g left-turn evidence state preserves FL/FR/RL/RR loads 516.8481725, 1388.941263, 510.345799, and 1400.891854 N and total normal load 3817.0270885 N.",
  "Right-turn front inside/outside assignment is FR/FL and left-turn front inside/outside assignment is FL/FR, preserving wheel identity.",
  "Both source states remain evidence_only with state_weight=0 and do not silently become steering optimization states.",
  "Inclination, tire pressure, lateral-force demand, and longitudinal-force demand remain unavailable because the selected source states do not supply them.",
  "Attempting to create a PR28 TireOperatingPoint from the current source states fails explicitly until normal load, inclination, and pressure are all supplied; a fully explicit synthetic wheel state converts without inference.",
  "The current later 1.7g left-turn workbook draft with rear-left Fz=-285.3358453 N is retained only as source-audit evidence and negative normal loads are rejected rather than clipped or repaired.",
  "No load-transfer, aero, suspension-motion, tire-force, or vehicle-equilibrium equation is introduced by MOD-VEH-0001."
]
