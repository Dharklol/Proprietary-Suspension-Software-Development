[record]
id = "BENCH-VEH-0003"
type = "benchmark"
title = "Analytical rigid point, wrench, and virtual-work force-coordinate benchmark"
status = "proposed"
description = "Verify MOD-VEH-0003 independently of WUFR data using synthetic rigid-body fixtures with exact yaw-pitch-roll point transport, known point-force moment arms, multiple-wrench summation, and generalized forces obtained both analytically and from an independently evaluated centered pose/rotation-log Jacobian. Include incompatible-frame and unavailable/nonconverged numerical-Jacobian failures."
verification_level = "B"
target_ids = ["MOD-VEH-0003", "EQ-VEH-0004", "EQ-VEH-0005", "EQ-VEH-0006"]
acceptance_criteria = [
  "Identity and selected 90-degree elemental rotations transport synthetic body-fixed points to closed-form expected positions within floating-point-scale tolerances.",
  "Point-force moment about a named reference equals (r_P-r_O) cross F and multiple contributions sum componentwise without losing free couples.",
  "Changing the wrench reference point changes the reported moment by the exact cross-product translation while preserving the same physical resultant force/couple system.",
  "For a synthetic q=[z_s,phi,theta] pose and applied point force/couple, Q=J_r^T F+J_omega^T M agrees with a converged centered finite-difference point/rotation Jacobian result.",
  "Generalized-force signs and mixed units [N,N*m,N*m] remain explicit; no absolute value or scalar motion-ratio substitution is used.",
  "Missing/incompatible frame or origin authority, nonfinite inputs, and unavailable/nonconverged numerical Jacobians fail explicitly."
]
implementation = "src/pssd_vehicle/force_coordinates.py"
implementation_method = "Closed-form Rz*Ry*Rx point/Jacobian mechanics plus a centered h versus h/2 verification path; angular finite differences use the SO(3) log of R_plus*R_minus^T so the incremental rotation is expressed in the inertial frame."
implementation_tests = ["tests/test_vehicle_force_coordinates.py"]
report_script = "scripts/run_vehicle_force_coordinate_benchmarks.py"
result_record = "benchmarks/vehicle/vehicle_force_coordinate_result_v0.1.0.toml"
