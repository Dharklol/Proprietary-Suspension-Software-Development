[record]
id = "BENCH-VEH-0004"
type = "benchmark"
title = "Rigid four-contact classification and WUFR whole-vehicle authority boundary"
status = "proposed"
description = "Verify the initial flat-road vertically rigid four-contact contract and the WUFR-27 geometry-inheritance/whole-vehicle adapter boundary. Synthetic fixtures freeze contact-gap sign and negative-reaction behavior. A reviewed explicit WUFR CAD/scale/spec-sheet adapter may now supply design-intent axle/track/contact/CG placement, while a deliberately incomplete wheelbase-only fixture must still fail rather than infer a transform."
verification_level = "B"
target_ids = ["MOD-VEH-0003", "EQ-VEH-0004", "EQ-VEH-0007", "ASM-VEH-0001", "ASM-VEH-0002"]
acceptance_criteria = [
  "A horizontal road with n_road=[0,0,1] reports positive gap for a contact reference above the plane, negative gap for penetration, and zero gap on the plane.",
  "A valid synthetic all-four-contact state has four closed gaps and four finite nonnegative road-normal reactions.",
  "Any supplied negative road-normal reaction returns wheel_lift/contact_mode_invalid and is not clipped or redistributed.",
  "Requests involving tire radial compliance, nonflat road, curb contact, or alternate contact modes return unsupported rather than silently reusing the rigid four-contact equations.",
  "The WUFR-27 baseline explicitly inherits the WUFR-26 suspension geometry source and the reviewed whole-vehicle adapter separately freezes CAD axle/track placement and source-separated CG/contact authority.",
  "A wheelbase-only or otherwise incomplete fixture still produces no whole-vehicle front/rear/CG transform; wheelbase alone cannot satisfy this benchmark.",
  "The WUFR adapter remains design-intent only; the no-driver composite CG retains separate x/y versus z provenance and the driver/no-fuel z coordinate remains unavailable.",
  "The ideal two-force-member linkage assumption is recorded as downstream-only and no member-force or stress output is exposed by MOD-VEH-0003."
]
source_configuration = "configurations/suspension/WUFR27_SUSPENSION_BASELINE_V0.toml"
source_adapter = "data_catalog/wufr26_whole_vehicle_frame_v0.toml"
implementation = "src/pssd_vehicle/force_coordinates.py"
implementation_method = "Explicit flat-plane gap/reaction classification plus a frozen reviewed WUFR design-intent adapter; no mass-to-wheel-load solve and no contact-mode switching."
implementation_tests = ["tests/test_vehicle_force_coordinates.py"]
report_script = "scripts/run_vehicle_force_coordinate_benchmarks.py"
result_record = "benchmarks/vehicle/vehicle_force_coordinate_result_v0.1.0.toml"
