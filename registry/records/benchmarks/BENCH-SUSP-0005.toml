[record]
id = "BENCH-SUSP-0005"
type = "benchmark"
title = "WUFR front OptimumK three-dimensional source-steering removal"
status = "proposed"
description = "Verify that historical front OptimumK result states that already contain tie-rod steering can be converted to unresolved-steering validation references by deriving the actual three-dimensional upright twist from the upright tie point about the current steering axis and applying its inverse on both front corners."
verification_level = "C"
target_ids = ["MOD-SUSP-0002", "EQ-SUSP-0006", "EQ-SUSP-0008"]
acceptance_criteria = [
  "Use the same 11 frozen front pure-heave states and body-frame re-reference rule already accepted by BENCH-SUSP-0002.",
  "At each state on both front corners, derive source twist only from current lower/upper upright and upright tie-point geometry relative to the EQ-SUSP-0003 minimum-twist reference.",
  "After removing the recovered twist, each source wheel-center point matches the corresponding minimum-twist rigid transport of the nominal wheel center within 2e-9 m at all 11 states.",
  "Left and right recovered twist values match the frozen state table within 2e-10 rad; their mirrored sign relationship in this historical source result is also checked without promoting it to a general as-built symmetry assumption.",
  "The benchmark demonstrates at representative states on both front corners that the OptimumK scalar Steer Angle differs materially from the recovered three-dimensional upright twist and is never used as a rotation input.",
  "The resulting unresolved-steering source references may be used for validation/correlation but the original source-steered poses may not be fed directly into MOD-STEER-0001."
]
fixture = "benchmarks/suspension/WUFR26_OPTIMUMK_WHEEL_REFERENCE_V0.toml"
upstream_fixture = "benchmarks/suspension/WUFR26_OPTIMUMK_HEAVE_FRONT_KINEMATICS_V0.toml"
source_audit = "docs/models/suspension/wheel_reference_source_audit.md"
