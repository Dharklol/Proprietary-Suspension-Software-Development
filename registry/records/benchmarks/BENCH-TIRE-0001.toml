  "Slip values outside the supplied curve domain fail; no clipping, endpoint substitution, symmetry, or extrapolation occurs.",
  "Nonfinite values, duplicate or nonincreasing slip coordinates, fewer than two samples, and zero-width segments reject the complete curve.",
  "Synthetic fixture metadata explicitly states that the values are not Hoosier, TTC, R25B, R20, track, or WUFR evidence."
]
