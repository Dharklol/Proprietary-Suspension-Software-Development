  "The reference candidate reproduces all baseline analyzer geometry inputs to numerical precision.",
  "Generated right steering axes, inner joints, outer joints, wheel bases where available, and side-local alignment roles satisfy the exact reflection contract.",
  "Left and right tie-rod lengths equal their generated joint-center distances and match under exact reflection.",
