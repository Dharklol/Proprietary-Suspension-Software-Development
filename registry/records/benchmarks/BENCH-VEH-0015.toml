  "EQ-VEH-0020 resultant force and moment equal independent direct vector/cross-product assembly within 1e-12 in corresponding SI units and contain no free couple.",
  "The current carrier reference is the midpoint of the exact current MOD-SUSP-0007 upper/lower spherical-joint centers after reviewed axle/source/body/road placement.",
  "EQ-VEH-0021 road-frame to Level-1 pullback and round-trip reproduce force within 1e-10 N and moment within 1e-10 N*m, including nonzero body roll/pitch.",
  "Changing only the wrench reference point preserves force and follows exact moment transport; changing a physical application point changes the resultant and is not silently accepted."
]
