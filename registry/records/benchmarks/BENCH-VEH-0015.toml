  "At the frozen setting-1/1 static state and one bounded synthetic nonzero body pose using the same reviewed providers, preserve corner order [front_left,front_right,rear_left,rear_right], configuration/static-state identity, exact road frame/origin, and exact current contact/wheel-center point IDs without permutation, mirroring, or sign repair.",
