  "Reconstruct the nominal wheel-plane forward reference and normal from the reviewed project static toe/camber convention within 1e-12 per component.",
  "Preserve the higher-precision half-track values exposed by the result evidence while documenting the 0.001 mm rounding of the Box setup text representation.",
  "Reject or explicitly mark unsupported any attempt to generalize the v0.1 construction to nonzero source wheel offsets.",
  "Do not create a generic contact-patch/tire-envelope model as part of this benchmark."
