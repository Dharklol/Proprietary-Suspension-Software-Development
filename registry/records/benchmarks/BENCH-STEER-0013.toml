  "Repeated sensitivity calls with identical inputs return identical records.",
  "Candidate comparison screens the retained search candidates through STEERING_CONSTRAINT_PROVIDER_DEV_V0 before comparison.",
  "The frozen report screens twenty candidates, retains four design-space-separated alternatives, and records objective and tie-rod-length differences.",
  "Near-duplicate filtering uses an explicit normalized design-distance threshold and does not claim Pareto completeness or global optimality.",
  "Machine-readable reports preserve candidate values, geometry, constraints, analyzer diagnostics, method settings, ranking explanations, and provenance."
