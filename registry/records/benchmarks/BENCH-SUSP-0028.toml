[record]
id = "BENCH-SUSP-0028"
type = "benchmark"
title = "WUFR rocker included-load source composition"
status = "proposed"
description = "Verify source-preserving composition of the existing physical push/pull, spring, and ARB-link force records into the ideal rocker included-load diagnostic without publishing a complete hardware reaction."
verification_level = "A"
target_ids = ["MOD-SUSP-0008", "EQ-SUSP-0029", "EQ-SUSP-0031"]
acceptance_criteria = [
  "The WUFR adapter accepts only a successful MOD-SUSP-0007 actuation axial reaction, successful AUTH-SUSP-0014 spring physical-force result, and successful AUTH-SUSP-0013 Z-bar physical-link result with matching axle/side/frame/configuration/geometry identities.",
  "The included force set is exactly push_pull, conservative_spring, and physical_arb_link; no force magnitude or application point is recomputed from a scalar motion ratio or generalized-force shortcut.",
  "The push/pull force uses the Level-1 actuation force on the remote rocker endpoint, the spring force uses force_on_rocker at the current rocker eye, and the ARB force uses force_on_rocker at the current mechanism rocker pickup.",
  "The missing force set contains KW_V5_non_spring_static_force under AUTH-SUSP-0015 and complete_hardware_reaction is false for every v0.1 WUFR result.",
  "A source/configuration/side/point mismatch, failed upstream provider, or unavailable ARB side fails closed without clipping or omission repair.",
  "No WUFR tire/maneuver load case is generated by the adapter; externally supplied Level-1 load-case provenance is retained."
]
authorization = "authorizations/suspension/AUTH-SUSP-0016.toml"
implementation_test = "planned: tests/test_wufr_rocker_included_load_adapter.py"
