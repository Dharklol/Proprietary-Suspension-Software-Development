acceptance_criteria = [
  "Use reference point O=[0,0,0] m and six ideal link columns generated by: L1 r=[0,0,0],u=[1,0,0]; L2 r=[0,0,0],u=[0,1,0]; L3 r=[0,0,0],u=[0,0,1]; L4 r=[0,1,0],u=[0,0,1]; L5 r=[0,0,1],u=[1,0,0]; L6 r=[1,0,0],u=[0,1,0]. Remote endpoints are chosen one meter along each stated unit axis so all link geometry is nondegenerate.",
  "With target signed axial forces N=[100,200,300,40,50,60] N, the prescribed external wrench about O is exactly F_ext=[-150,-260,-340] N and M_ext=[-40,-50,-60] N*m.",
  "The solved axial-force vector matches [100,200,300,40,50,60] N within 1e-9 N componentwise and preserves positive-tension sign.",
  "The physical-unit reconstructed force residual norm is <=1e-9 N and moment residual norm is <=1e-9 N*m.",
  "The reported scaled matrix is finite/full-rank and its condition diagnostic is below the authorized kappa_max=1e10.",
  "No force magnitude, absolute value, load-sharing heuristic, or hidden extra reaction is introduced."
]
authorization = "authorizations/suspension/AUTH-SUSP-0010.toml"
implementation_test = "planned: tests/test_suspension_linkage_statics.py"
