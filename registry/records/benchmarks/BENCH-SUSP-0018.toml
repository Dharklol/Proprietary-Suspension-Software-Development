[record]
id = "BENCH-SUSP-0018"
type = "benchmark"
title = "Analytical determinate six-link rigid-body statics fixture"
status = "proposed"
description = "Verify EQ-SUSP-0019 through EQ-SUSP-0022 on an exactly solvable six-link synthetic rigid-body fixture with simultaneous force and moment loading and known signed axial forces."
