title = "Scaled determinate linkage-statics solve and conditioning gate"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "Solve the EQ-SUSP-0020 determinate six-link equilibrium only after scaling moment rows by an explicit geometric characteristic length and proving the scaled matrix is finite, nonsingular, and acceptably conditioned."
outputs = ["signed axial-force vector N", "characteristic length L_ref", "scaled matrix and right-hand side", "conditioning/pivot diagnostics", "structured failure state"]
