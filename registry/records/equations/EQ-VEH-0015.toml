canonical_equation = "Q_spring=(Q_s,FL,Q_s,FR,Q_s,RL,Q_s,RR); Q_ARB=(Q_a,FL,Q_a,FR,Q_a,RL,Q_a,RR); Q_susp=Q_spring+Q_ARB; U_susp=sum_i U_s,i+U_ARB,F+U_ARB,R."
source_basis = [
  "AUTH-SUSP-0004 / MOD-SUSP-0004 / ASM-SUSP-0002",
  "AUTH-SUSP-0005 through AUTH-SUSP-0009 / MOD-SUSP-0005 / ASM-SUSP-0003",
  "data_catalog/wufr27_static_equilibrium_composition_v0.toml"
]
