failure_behavior = [
  "Fail for missing/invalid settings, upstream spring/Z-bar/actuation failure, configuration or coordinate-order mismatch, nonfinite values, or unavailable energy.",
  "Do not select or fit an ARB setting, interpolate stiffness, duplicate actuation geometry, clip signs, or replace physical-wheel generalized forces with scalar wheel-rate/motion-ratio formulas."
]
