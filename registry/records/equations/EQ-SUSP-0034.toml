type = "equation"
title = "Static Level-1 interface provenance and downstream handoff"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "Preserve signed action-reaction interfaces, exact application points, and complete provenance through the four-corner packet, including the only permitted later rocker handoff."
