[record]
id = "EQ-VEH-0005"
type = "equation"
title = "Point-force wrench translation and assembly"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "Translate a force/couple applied at point P to a named reference point O and sum multiple applied wrenches without losing application-point information. This is the common force/moment assembly primitive for later equilibrium and linkage-load models."
outputs = ["Resultant force about reference point O", "Resultant moment about reference point O", "Per-contribution force and moment terms"]
inputs = ["Applied force F at point P", "Applied free couple M_P", "Application-point position r_P", "Reference-point position r_O"]
assumptions = [
  "Force, couple, application point, and reference point are expressed in the same declared Cartesian frame.",
  "M_P is a free couple; the moment generated by the point force is added through the cross product.",
  "No force direction is replaced by a scalar magnitude and no application point is discarded."
]
verification_level = "none"
canonical_equation = "F_O = F; M_O = M_P + (r_P-r_O) cross F; total wrench is the componentwise sum over applied contributions"
source_basis = [
  "Guiggiani (2022), The Science of Vehicle Dynamics, Chapters 3, 8, and 9 force and moment equilibrium about named vehicle reference points.",
  "Gillespie (1992), Fundamentals of Vehicle Dynamics, vehicle free-body equilibrium and load-transfer moment balances."
]
validity = "Finite forces, couples, and point coordinates in one declared frame."
failure_behavior = [
  "Reject incompatible or missing frame/origin declarations.",
  "Reject nonfinite force, moment, or application-point values.",
  "Do not silently move a force to the wheel center, CG, axle center, or chassis point without applying the corresponding moment arm."
]
benchmark_ids = ["BENCH-VEH-0003"]