[record]
id = "EQ-SUSP-0014"
type = "equation"
title = "Conservative spring force, stored energy, and tangent stiffness"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "Evaluate a source-defined conservative coil-spring constitutive law as compression-force magnitude F_s=f_s(x_s), stored energy U_s(x_s)=integral_0^x_s F_s(xi) dxi, and local tangent stiffness k_t=dF_s/dx_s. Linear and explicitly sourced nonlinear/table laws are permitted only inside their reviewed constitutive domains."
outputs = ["compression-force magnitude F_s", "stored energy U_s", "local tangent stiffness k_t", "constitutive segment/domain diagnostics"]
inputs = ["successful EQ-SUSP-0013 spring compression", "source-defined linear or nonlinear force-versus-compression law", "constitutive domain and source authority"]
assumptions = [
  "The spring element is conservative and rate-independent in this model; velocity-dependent damping, hysteresis, friction, gas force, and stops are separate elements.",
  "U_s(0)=0 at the zero-load seated reference and F_s is compression-positive for the authorized coil-spring class.",
  "A progressive spring requires its progression versus compression or equivalent force-deflection definition; endpoint rate labels alone do not define f_s(x_s)."
]
verification_level = "none"
canonical_equation = "F_s=f_s(x_s); U_s(x_s)=integral_0^x_s F_s(xi) dxi; k_t=dF_s/dx_s. For a linear spring F_s=k*x_s and U_s=0.5*k*x_s^2."
source_basis = [
  "Guiggiani (2022) conservative suspension elastic-element framework and recognition of nonlinear/hardening spring behavior.",
  "Dixon, The Shock Absorber Handbook, generic mechanical spring restoring-force/energy behavior.",
  "WUFR27_SPRING_PACKAGE_V0 for WUFR-specific spring identities and explicit progressive-law gap."
]
validity = "Successful seated-spring state within the exact reviewed constitutive compression/force domain."
numerical_method = "Linear law is analytic. A later reviewed table implementation may use piecewise-linear force interpolation with exact segmentwise trapezoidal energy integration and explicit tangent/side convention at knots; no extrapolation is permitted."
failure_behavior = ["Return progressive_law_incomplete when endpoint rates do not define the curve", "Return constitutive_domain_exceeded rather than extrapolate", "Return invalid_energy_law for malformed/nonintegrable source data", "Do not average progressive endpoint rates"]
benchmark_ids = ["BENCH-SUSP-0009", "BENCH-SUSP-0010"]
