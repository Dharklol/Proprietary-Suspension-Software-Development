[record]
id = "EQ-VEH-0012"
type = "equation"
title = "WUFR flat-road physical wheel-coordinate compatibility"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "For a supplied whole-body heave/roll/pitch state, solve each physical wheel-center vertical coordinate so the AUTH-VEH-0008 / EQ-VEH-0011 ideal rigid-circle contact point lies on the declared MOD-VEH-0003 road plane. The prior ASM-VEH-0004 contact interpretation remains invalidated and is not used."
outputs = ["Road-compatible wheel coordinates z_w(q_b) in FL,FR,RL,RR order", "Per-corner road-gap residuals", "Per-corner root brackets, branch identities, iterations, and failures"]
inputs = ["Body state q_b=[z_s,phi,theta] and MOD-VEH-0003 BodyPose", "MOD-VEH-0003 RoadPlane", "EQ-VEH-0011 ideal rigid-circle per-corner contact-point provider", "Declared physical wheel-coordinate domains and root tolerances"]
assumptions = [
  "The active mode is flat rigid road with all four ASM-VEH-0005 ideal-circle contact points constrained to the same road plane.",
  "Each corner's contact-gap function remains on the nominal-continuation physical suspension/steering/contact branch and has exactly one accepted root within the declared local domain.",
  "Tire/contact fidelity is owned by EQ-VEH-0014 and may not be changed inside this root equation."
]
verification_level = "none"
canonical_equation = "g_i(q_b,z_i)=n_R dot (r_cp,i^R(q_b,z_i)-r_R0)=0, with r_cp from EQ-VEH-0011/EQ-VEH-0014; solve independently for z_i on the declared nominal-continuation branch; z_w=[z_FL,z_FR,z_RL,z_RR]."
source_basis = [
  "AUTH-VEH-0008 / EQ-VEH-0011 / EQ-VEH-0014",
  "MOD-VEH-0003 / EQ-VEH-0004 and EQ-VEH-0007 body-point transport and flat-road contact contract",
  "MOD-SUSP-0002 physical wheel-center vertical coordinate and inversion contract",
  "AUTH-VEH-0007 retained only as negative evidence against ASM-VEH-0004"
]
validity = "WUFR-27 design-intent R&D baseline, flat road, all-four-active, ideal rigid circular tire under ASM-VEH-0005, within reviewed local suspension and centered-steering branches."
failure_behavior = [
  "Reject a body state for which any corner has no root, multiple roots, nonmonotonic/ambiguous branch behavior, upstream suspension/steering/contact failure, or nonfinite road gap.",
  "Never clip a wheel coordinate to make contact and never replace a failed root with body-roll-times-track or direct wheel-travel formulas.",
  "Do not fall back to ASM-VEH-0004 or another tire/contact model.",
  "Alternate three-contact/wheel-lift continuation is not solved by this equation."
]
benchmark_ids = ["BENCH-VEH-0009", "BENCH-VEH-0010"]
