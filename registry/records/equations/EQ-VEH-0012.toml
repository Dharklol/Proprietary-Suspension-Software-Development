[record]
id = "EQ-VEH-0012"
type = "equation"
title = "WUFR flat-road physical wheel-coordinate compatibility"
status = "proposed_blocked_by_AUTH-VEH-0007"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "Architectural road-compatibility equation: for a supplied whole-body heave/roll/pitch state, solve each physical wheel-center vertical coordinate so a separately reviewed EQ-VEH-0011 contact point lies on the declared MOD-VEH-0003 road plane. The original ASM-VEH-0004 contact provider failed BENCH-VEH-0008, so no WUFR z_w(q_b) implementation is currently authorized."
outputs = ["Future road-compatible wheel coordinates z_w(q_b) in FL,FR,RL,RR order", "Per-corner road-gap residuals", "Per-corner root brackets, branch identities, iterations, and failures"]
inputs = ["Body state q_b=[z_s,phi,theta] and MOD-VEH-0003 BodyPose", "MOD-VEH-0003 RoadPlane", "A re-authorized EQ-VEH-0011 per-corner contact-point provider", "Declared physical wheel-coordinate domains and root tolerances"]
assumptions = [
  "The active mode is flat rigid road with all four reviewed contact points constrained to the same road plane.",
  "Each corner's contact-gap function must remain on the nominal-continuation physical suspension/contact branch and have exactly one accepted root within the declared local domain.",
  "Contact geometry/tire fidelity is owned by the replacement EQ-VEH-0011 provider and may not be inferred inside this root equation."
]
verification_level = "none"
canonical_equation = "After replacement contact authority exists: g_i(q_b,z_i)=n_R dot (r_cp,i^R(q_b,z_i)-r_R0)=0; solve independently for z_i on the declared nominal-continuation branch; z_w=[z_FL,z_FR,z_RL,z_RR]"
source_basis = [
  "MOD-VEH-0003 / EQ-VEH-0004 and EQ-VEH-0007 body-point transport and flat-road contact contract",
  "EQ-VEH-0011 replacement WUFR contact-point provider (currently blocked)",
  "MOD-SUSP-0002 physical wheel-center vertical coordinate and inversion contract",
  "AUTH-VEH-0007 implementation hold"
]
validity = "No active WUFR compatibility-map validity until replacement EQ-VEH-0011 contact authority is reviewed."
failure_behavior = [
  "Return unavailable while contact-point authority is missing; do not fall back to invalidated ASM-VEH-0004.",
  "Reject a body state for which any corner has no root, multiple roots, nonmonotonic/ambiguous branch behavior, upstream suspension/steering/contact failure, or nonfinite road gap.",
  "Never clip a wheel coordinate to make contact and never replace a failed root with body-roll-times-track or direct wheel-travel formulas.",
  "Alternate three-contact/wheel-lift continuation is not solved by this equation."
]
benchmark_ids = ["BENCH-VEH-0009"]
