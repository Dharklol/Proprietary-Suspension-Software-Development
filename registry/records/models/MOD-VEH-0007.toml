description = "Implemented source-preserving WUFR adapter that composes the rigid-circle road compatibility, sprung/unsprung gravity allocation, conservative four-corner spring forces, and front/rear conservative Z-bar forces through the provider-neutral MOD-VEH-0004 quasi-static kernel. The corrected v0.2 implementation retains the EQ-VEH-0018 direct-plus-mapped compatible unsprung-gravity reduction in EQ-VEH-0019, returns the first driver/no-fuel, centered-rack, flat-road, all-four-active design-intent static state and road-normal reactions, and performs independent energy and physical-wrench closure checks. It introduces no new force law and is not correlated or installed/as-built authority."
inputs = [
  "WUFR27_STATIC_EQUILIBRIUM_COMPOSITION_V1 and WUFR27_SUSPENSION_BASELINE_V0 identities",
  "Explicit front and rear discrete ARB settings in 1..5 with no default",
  "MOD-VEH-0006 road-compatible wheel-coordinate/contact evaluation including J_wb, c_i, contact points, wheel-center points, and unsprung-gravity projections",
  "MOD-VEH-0005 sprung and unsprung physical gravity point loads, including the exact EQ-VEH-0018 direct-plus-mapped compatible unsprung reduction",
  "MOD-SUSP-0004 spring package and four successful actuation-derived physical-wheel spring states",
  "MOD-SUSP-0005 front/rear physical-wheel Z-bar states",
  "Explicit MOD-VEH-0004 solver configuration and bounded initial body state"
]
outputs = [
  "Converged q_b=[z_s,phi,theta] and z_w=[FL,FR,RL,RR]",
  "Four spring states, two axle Z-bar states, Q_spring, Q_ARB, Q_susp, and conservative energies",
  "Four signed road-normal reactions and wheel-equilibrium residuals",
  "Reduced-equilibrium residuals with sprung, direct-unsprung, mapped-unsprung, spring, and ARB terms retained separately; tangent/conditioning/line-search diagnostics; and two-step energy-gradient checks",
  "Independent road-frame physical force and moment residuals",
  "Exact source/configuration/assumption/setting provenance and result_label=uncorrelated_design_intent_static_gravity"
]
assumptions = [
