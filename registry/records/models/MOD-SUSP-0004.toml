[record]
id = "MOD-SUSP-0004"
type = "model"
title = "Conservative coil-spring force, energy, generalized-force, and physical eye-force provider"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M1"
description = "Bounded conservative coil-spring provider authorized by AUTH-SUSP-0004 / PR47 and implemented in PR48. It consumes an explicitly authorized spring compression/reference state and conservative constitutive law, returns spring force, stored energy, local tangent stiffness, and maps the elastic action into signed generalized force through exact coordinate Jacobians/virtual work. AUTH-SUSP-0014 additionally authorizes a WUFR-specific spring-only physical force-vector bridge along the exact current direct-coilover eye line, without adding non-spring damper physics or rocker equilibrium. WUFR-27 uses the explicitly labeled ASM-SUSP-0002 zero-preload/full-extension reference and rear affine tangent-rate assumption."
inputs = [
  "Successful MOD-SUSP-0003 actuation state or an explicitly supplied spring-seat/compression state with matching source/configuration authority",
  "Spring free length and explicit seat-separation or equivalent reference/preload relation",
  "Source-defined or explicitly reviewed assumption-defined conservative force/tangent-rate law within a reviewed constitutive domain",
  "Signed coordinate Jacobian, including rho_dw where the physical single-wheel coordinate is used",
  "For the AUTH-SUSP-0014 WUFR physical-vector extension: current chassis eye, rocker eye, rocker pivot, rocker axis, and successful source-matched spring state",
  "Source/configuration/assumption identity and constitutive availability state"
]
outputs = [
  "Spring compression x_s with seated/unseated status",
  "Compression-force magnitude F_s",
  "Stored elastic energy U_s with declared zero-energy reference",
  "Local tangent stiffness k_t",
  "Signed generalized spring force with coordinate order/units and two-step energy-gradient verification support",
  "Under AUTH-SUSP-0014 after implementation: spring-only equal-and-opposite physical force vectors at the current rocker/chassis eyes plus rocker-torque identity diagnostics",
  "Source/configuration/assumption provenance and structured unavailable/failure state"
]
assumptions = [
  "The first spring element is conservative, rate-independent, and quasi-static; damping, hysteresis, gas force, friction, and stops are separate elements.",
  "Spring compression is positive from a reviewed zero-load/free-length reference; the seated-spring mode does not support tensile coil-spring force.",
  "Force direction in vehicle/generalized coordinates is determined by the signed compression/actuation Jacobian; no absolute-value motion-ratio convention is used.",
  "The WUFR-27 front spring uses the reviewed 36 N/mm linear law.",
  "Under ASM-SUSP-0002, the WUFR-27 rear tangent rate rises linearly from 30 N/mm at x_s=0 to 36 N/mm at x_s=57 mm until physical spring testing replaces the assumption.",
  "Under ASM-SUSP-0002, zero intentional preload is represented by x_s=0 at the KW piggyback 185.7 mm full-extension eye-to-eye reference, with x_s=0.1857-L_d for the current fixed-seat-offset design-intent configuration.",
  "Under ASM-SUSP-0007, only the conservative spring contribution acts as an ideal axial load along the current direct-coilover eye line; no damper gas/velocity/friction/stop contribution is included.",
  "Neither ASM-SUSP-0002 nor ASM-SUSP-0007 is installed/as-built metrology or complete damper-force authority."
]
verification_level = "B"
