[record]
id = "MOD-SUSP-0005"
type = "model"
title = "Coupled conservative anti-roll-bar elastic provider"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M1"
description = "Bilateral/source-defined conservative anti-roll-bar provider authorized by AUTH-SUSP-0005 / PR49 and implemented in PR50. The corrected WUFR-27 constitutive adapter uses one of five discrete SolidWorks FEA blade-tip force/deflection stiffness settings: 280/300/400/700/2300 N/mm. AUTH-SUSP-0006 now freezes the named nominal front/rear WUFR Z-bar point/topology fixture and transport of the rocker ARB pickups with MOD-SUSP-0003. The single scalar installed two-ended blade coordinate delta_b and its Jacobian remain unavailable, so vehicle-coordinate ARB generalized force is still blocked."
inputs = [
  "Explicit source-defined ARB elastic coordinate with matching configuration and coordinate-unit identity",
  "Explicit zero-energy/preload reference",
  "Source-authorized conservative scalar stiffness/action law with reviewed units/domain",
  "Generalized coordinate order and signed deformation Jacobian when generalized force is requested",
  "Explicit enabled/disabled configuration state",
  "For WUFR: one discrete blade setting 1..5; interpolation is not authorized",
  "For future WUFR mapping: WUFR26_ZBAR_MECHANISM_V0 nominal mechanism fixture plus reviewed scalar delta_b reduction"
]
outputs = [
  "Signed anti-roll-bar elastic deformation and zero-reference state",
  "Conservative stored energy",
  "Conjugate elastic action and local tangent stiffness",
  "Signed generalized anti-roll-bar force vector only when a deformation Jacobian is supplied",
  "Explicit no-bar state, source/configuration/assumption provenance, and structured failure state"
]
assumptions = [
  "The first anti-roll-bar model is conservative and quasi-static; friction, bearing drag, backlash, hysteresis, and damping are excluded.",
  "The anti-roll bar is a coupled left/right element. Its elastic coordinate is source-defined and is not replaced by two independent corner springs.",
  "Zero intentional preload is represented only by an explicit named reference state; hidden offset repair is prohibited.",
  "WUFR governing constitutive authority is the SolidWorks FEA blade-tip stiffness column from the Google Sheet ARB FEA vs Simulink: settings 1..5 = 280/300/400/700/2300 N/mm = 280000/300000/400000/700000/2300000 N/m.",
  "The WUFR blade law is F_b=k_b*delta_b and U_b=0.5*k_b*delta_b^2. Q_ARB=-J_delta_b^T*F_b requires a reviewed WUFR deformation Jacobian.",
  "WUFR settings are discrete. Interpolation, averaging, blending, or stacking stiffness sources is prohibited without separate authorization.",
  "MATLAB 2560/2270 N*m/deg, Simulink 285/309/400/724/2628 N/mm, and Instron 900/980/1320/1970/2630 N/mm are comparison-only evidence.",
  "AUTH-SUSP-0006 freezes the nominal WUFR point/topology fixture and rigid rocker-pickup transport. It does not authorize a scalar delta_b reduction for the two-ended installed blade, any factor-two/half/sqrt(2) rescaling, or vehicle-coordinate Q_ARB."
]
