[record]
id = "MOD-SUSP-0005"
type = "model"
title = "Coupled conservative anti-roll-bar elastic provider"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M1"
description = "Coupled conservative anti-roll-bar provider. PR50 implemented the generic conservative mechanics and discrete WUFR SolidWorks setting values. AUTH-SUSP-0006 freezes the nominal WUFR Z-bar mechanism fixture, AUTH-SUSP-0007 interprets the governing values as one blade-arm transverse tip stiffnesses with additive two-arm energy, and PR54 implements the nominal-continuation two-arm mechanism closure. AUTH-SUSP-0008 promotes the verified d=[d_L,d_R](theta_RL,theta_RR), two-step J_d, and Q_rocker=-J_d^T F in left/right rocker-angle coordinates. AUTH-SUSP-0009 composes the signed physical-wheel-to-rocker derivative with that mechanism Jacobian to provide Q_z in left/right MOD-SUSP-0002 physical wheel-center vertical coordinates. Whole-vehicle equilibrium and load transfer remain downstream."
inputs = [
  "Explicit source-defined ARB elastic coordinate or coordinate vector with matching configuration and units",
  "Explicit zero-energy/preload reference",
  "Source-authorized conservative stiffness/action law",
  "Generalized coordinate order and signed deformation Jacobian when generalized force is requested",
  "Explicit enabled/disabled configuration state",
  "For WUFR: one discrete blade setting 1..5 used as the same per-arm k_b on both blade arms",
  "For WUFR rocker mapping: WUFR26_ZBAR_MECHANISM_V0 nominal mechanism fixture and MOD-SUSP-0003 left/right rocker states",
  "For WUFR wheel mapping: MOD-SUSP-0002 left/right physical wheel-center vertical coordinates and branch-preserving local d(theta_R)/d(delta_z_wc_body)"
]
outputs = [
  "Signed anti-roll-bar elastic deformation scalar/vector and reference state",
  "Conservative stored energy",
  "Conjugate elastic action vector and local tangent stiffness",
  "Signed generalized anti-roll-bar force only in explicitly reviewed work-conjugate coordinates",
  "For WUFR: left/right rocker-coordinate generalized torque after successful nominal-branch closure and J_d verification",
  "For WUFR: left/right physical wheel-center vertical generalized ARB force after the reviewed signed chain-rule composition",
  "Explicit no-bar state and structured failure/provenance"
]
assumptions = [
  "The first anti-roll-bar model is conservative and quasi-static; friction, bearing drag, backlash, hysteresis, and damping are excluded.",
  "The anti-roll bar is a coupled left/right element and is not replaced by two independent wheel springs.",
  "Zero intentional preload uses an explicit reference; hidden offset repair is prohibited.",
  "WUFR governing stiffness settings are 280/300/400/700/2300 N/mm. The source sheet labels the modeled quantity Blade arm and checks it with k=3EI/L^3; AUTH-SUSP-0007 therefore treats k_b as one-arm transverse tip stiffness.",
  "Installed WUFR blade energy is U=0.5*k_b*(d_L^2+d_R^2), with F=[k_b*d_L,k_b*d_R]. No scalar factor-two/half/sqrt(2) rescaling is permitted.",
  "The historical 2560/2270 N*m/deg pair is downstream setting-1 effective axle roll-stiffness evidence in the 2025 design-binder lineage; it is not independent blade constitutive authority.",
  "AUTH-SUSP-0008 accepts the PR54 nominal-continuation mechanism closure and signed J_d in [theta_RL,theta_RR] rocker-angle coordinates.",
  "AUTH-SUSP-0009 uses the existing independent-corner rigid kinematic map, so J_theta_z is diagonal and its signed diagonal terms are evaluated from physical-wheel perturbations rather than historical scalar motion ratios.",
  "Q_z is work-conjugate to left/right physical wheel-center vertical coordinates only; it is not by itself a tire load-transfer or vehicle-equilibrium result."
]
verification_level = "B"
equation_ids = ["EQ-SUSP-0016", "EQ-SUSP-0017", "EQ-SUSP-0018"]
benchmark_ids = ["BENCH-SUSP-0011", "BENCH-SUSP-0012", "BENCH-SUSP-0013", "BENCH-SUSP-0014", "BENCH-SUSP-0015", "BENCH-SUSP-0016", "BENCH-SUSP-0017"]
authorization_id = "AUTH-SUSP-0005"
