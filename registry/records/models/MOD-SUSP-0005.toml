next_implementation_gate = "Implement and verify the two-arm Z-bar mechanism closure d(q_L,q_R), J_d, and generalized-force composition against WUFR26_ZBAR_MECHANISM_V0 using the AUTH-SUSP-0007 per-arm constitutive law."
prohibited_scope = "Interpolation between WUFR settings; averaging/stacking SolidWorks, Simulink, Instron, or effective-axle values; scalar whole-blade rescaling; body-roll/track/wheel-travel/historical-MR shortcuts; back-fitting geometry from effective axle stiffness; vehicle equilibrium before a reviewed map; damper/tire force; structural release; installed/as-built claims."
