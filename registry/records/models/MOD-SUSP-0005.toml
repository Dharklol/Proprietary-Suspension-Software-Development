next_implementation_gate = "After PR50 review/merge, proceed to the separately authorized prescribed-force quasi-static equilibrium/load-state gate. A source-specific detailed Z-bar mechanism map and blade/component constitutive law remain optional higher-fidelity replacement work, not prerequisites for the reviewer-selected reduced K_phi prototype."
prohibited_scope = "Inferring WUFR phi_ARB from body roll/wheel travel without a reviewed adapter, blade/component stiffness claims from the reduced K_phi values, extra motion-ratio reduction of 2560/2270, scalar ARB wheel-rate/MR governing substitution, damper/spring duplication, tire forces, vehicle equilibrium/load transfer, contact-mode switching, linkage/member/bearing reactions, stress/fatigue/FEA release, compliance/backlash/friction, installed limits, packaging, optimization, installed/as-built or production claims."
