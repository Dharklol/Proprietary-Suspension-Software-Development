[record]
id = "MOD-SUSP-0005"
type = "model"
title = "Coupled conservative anti-roll-bar elastic provider"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "Bilateral anti-roll-bar model proposed under AUTH-SUSP-0005. It consumes explicit left/right suspension/actuation states and source-defined mechanism geometry, forms a signed elastic deformation coordinate/vector relative to an explicit preload reference, evaluates conservative stored energy and conjugate elastic action where constitutive authority exists, and maps that action into signed generalized force through the deformation Jacobian. It refuses scalar per-corner wheel-rate substitution and refuses WUFR force output when blade/system stiffness authority is missing."
inputs = [
  "Successful reviewed left and right suspension/actuation states with matching axle/configuration identity",
  "Explicit bilateral ARB mechanism geometry and branch/reference identity",
  "Explicit zero-preload/preload reference",
  "Source-defined conservative force-deflection/torque-angle law or stiffness matrix with reviewed units/domain",
  "Generalized coordinate order and signed deformation Jacobian"
]
outputs = [
  "Signed anti-roll-bar elastic coordinate/vector and zero-reference residual",
  "Conservative stored energy when constitutive authority is available",
  "Conjugate elastic action vector and tangent stiffness/matrix when available",
  "Signed generalized anti-roll-bar force vector",
  "Common-mode/differential diagnostics, source/configuration/assumption provenance, and structured failure state"
]
assumptions = [
  "The first anti-roll-bar model is conservative and quasi-static; friction, bearing drag, backlash, hysteresis, and damping are excluded.",
  "The anti-roll bar is a coupled left/right element. Its elastic coordinate is source-defined from the bilateral mechanism and is not replaced by two independent corner springs.",
  "Zero intentional preload is represented only by an explicit named reference state; hidden offset repair is prohibited.",
  "A linear constitutive law is allowed only with reviewed stiffness authority; nonlinear/table laws require an explicit source domain and no extrapolation.",
  "WUFR-27 uses ASM-SUSP-0003 for design-intent carryover/zero-preload lineage, but currently lacks reviewed constitutive stiffness authority."
]
verification_level = "none"
