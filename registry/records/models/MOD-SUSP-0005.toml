[record]
id = "MOD-SUSP-0005"
type = "model"
title = "Coupled conservative anti-roll-bar elastic provider"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M1"
description = "Coupled conservative anti-roll-bar provider. PR50 implemented the generic scalar mechanics and discrete WUFR SolidWorks setting values. AUTH-SUSP-0006 freezes the nominal WUFR Z-bar mechanism fixture. AUTH-SUSP-0007 corrects the installed WUFR constitutive interpretation: the governing SolidWorks values are one blade-arm transverse tip stiffnesses, so the installed two-ended blade uses two arm elastic coordinates with additive energy. The numerical Z-bar arm-deformation map/Jacobian remains the next implementation gate."
inputs = [
  "Explicit source-defined ARB elastic coordinate or coordinate vector with matching configuration and units",
  "Explicit zero-energy/preload reference",
  "Source-authorized conservative stiffness/action law",
  "Generalized coordinate order and signed deformation Jacobian when generalized force is requested",
  "Explicit enabled/disabled configuration state",
  "For WUFR: one discrete blade setting 1..5 used as the same per-arm k_b on both blade arms",
  "For WUFR mapping: WUFR26_ZBAR_MECHANISM_V0 nominal mechanism fixture and MOD-SUSP-0003 rocker state"
]
outputs = [
  "Signed anti-roll-bar elastic deformation scalar/vector and reference state",
  "Conservative stored energy",
  "Conjugate elastic action vector and local tangent stiffness",
  "Signed generalized anti-roll-bar force only when a reviewed deformation Jacobian is supplied",
  "Explicit no-bar state and structured failure/provenance"
]
assumptions = [
  "The first anti-roll-bar model is conservative and quasi-static; friction, bearing drag, backlash, hysteresis, and damping are excluded.",
  "The anti-roll bar is a coupled left/right element and is not replaced by two independent wheel springs.",
  "Zero intentional preload uses an explicit reference; hidden offset repair is prohibited.",
  "WUFR governing stiffness settings are 280/300/400/700/2300 N/mm. The source sheet labels the modeled quantity Blade arm and checks it with k=3EI/L^3; AUTH-SUSP-0007 therefore treats k_b as one-arm transverse tip stiffness.",
  "Installed WUFR blade energy is U=0.5*k_b*(d_L^2+d_R^2), with F=[k_b*d_L,k_b*d_R]. No scalar factor-two/half/sqrt(2) rescaling is permitted.",
  "The historical 2560/2270 N*m/deg pair is downstream setting-1 effective axle roll-stiffness evidence in the 2025 design-binder lineage; it is not independent blade constitutive authority.",
  "AUTH-SUSP-0006 freezes the nominal point/topology fixture and rigid rocker-pickup transport; the numerical two-arm d(q_L,q_R) and J_d still require implementation/verification."
]
verification_level = "B"
equation_ids = ["EQ-SUSP-0016", "EQ-SUSP-0017", "EQ-SUSP-0018"]
benchmark_ids = ["BENCH-SUSP-0011", "BENCH-SUSP-0012", "BENCH-SUSP-0013", "BENCH-SUSP-0014", "BENCH-SUSP-0015"]
authorization_id = "AUTH-SUSP-0005"
authorization_state = "generic_provider_PR50; nominal_Zbar_fixture_AUTH-SUSP-0006; two_arm_constitutive_semantics_AUTH-SUSP-0007; numerical_arm_deformation_map_pending"
authorization_document = "authorizations/suspension/AUTH-SUSP-0005.toml"
upstream_model_ids = ["MOD-SUSP-0001", "MOD-SUSP-0002", "MOD-SUSP-0003"]
downstream_model_ids = []
planned_downstream = [
  "two-arm WUFR Z-bar mechanism solver providing d=[d_L,d_R](q_L,q_R) and J_d against WUFR26_ZBAR_MECHANISM_V0",
  "vehicle-coordinate ARB generalized force composition",
  "quasi-static body equilibrium/load-state solver after the WUFR mechanism map is available",
  "later roll-stiffness/LLTD diagnostics and historical effective-axle correlation"
]
source_snapshot = "data_catalog/wufr27_anti_roll_bar_package_v0.toml"
source_audit = "docs/models/suspension/anti_roll_bar_source_audit.md"
