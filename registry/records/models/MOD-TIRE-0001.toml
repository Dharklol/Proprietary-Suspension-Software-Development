next_implementation_gate = "The provider-neutral synthetic-verification kernel is complete. Real R25B activation requires a reviewed binary processed-Trojan full-curve exchange, frozen source hashes and domains, a source-to-canonical unit/frame/sign/pressure/inclination adapter, representative source cross-checks, and a source-specific follow-on authorization. Mz, Fx, combined slip, transient response, thermal/wear, vertical compliance, vehicle integration, steering ranking, and physical correlation remain separately authorized work."
prohibited_scope = "Real R25B/R20 full-curve activation from summaries; hidden curve reconstruction; source mirroring or odd symmetry; Magic Formula/brush/spline/polynomial/ML fitting; slip or operating-state extrapolation; nearest-neighbor repair; track scaling; Mz; Fx; combined slip; transient relaxation; thermal/wear; tire vertical compliance; vehicle-state generation; QSS; steering ranking; installed/as-built, setup, design-release, or production authority."
