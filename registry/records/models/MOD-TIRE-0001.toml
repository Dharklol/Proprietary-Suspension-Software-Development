preimplementation_specification = "docs/models/tire/steady_state_lateral_tire_function_specification.md"
implementation_package = "src/pssd_tire/steady_state_lateral.py"
implementation_document = "docs/models/tire/steady_state_lateral_tire_implementation_v0.1.0.md"
implementation_tests = [
  "tests/test_steady_state_lateral_tire_authorization.py",
