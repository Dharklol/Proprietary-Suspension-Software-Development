[record]
id = "MOD-VEH-0008"
type = "model"
title = "WUFR static-gravity carrier external wrench adapter"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M1"
description = "Source-preserving adapter that converts one successful MOD-VEH-0007 uncorrelated static-gravity state into four complete prescribed outboard-carrier external wrenches for that exact restricted model. Per corner it assembles the recovered road-normal point force and the ASM-VEH-0003 prototype unsprung gravity point force at their exact current physical points, transports the resultant to the current MOD-SUSP-0007 carrier reference, and may express the same physical wrench in the reviewed Level-1 axle-local frame. It introduces no new force law and is not maneuver, installed/as-built, linkage-load, rocker, structural, or production authority."
inputs = [
  "One successful MOD-VEH-0007 / AUTH-VEH-0010 result with exact configuration, static-state, corner order, body pose, wheel state, nonnegative road reactions, road normal, contact points, wheel-center points, and physical closure",
  "MOD-VEH-0005 source-owned sprung and prototype unsprung gravity point loads under ASM-VEH-0002 and ASM-VEH-0003",
  "MOD-VEH-0003 whole-vehicle point placement, BodyPose rotation/translation, AppliedWrench assembly, and rigid-wrench transport",
  "Current MOD-SUSP-0007 Level-1 carrier reference and axle-local frame under ASM-SUSP-0005"
]
outputs = [
  "Four road-frame carrier resultant wrenches at exact current carrier reference points",
  "Separate road-reaction and unsprung-gravity contribution records with exact application points",
  "Equivalent Level-1 axle-local prescribed wrench representations for the same physical carrier boundaries",
  "Exact frame/origin/reference transforms and transport residuals",
  "Four-corner reconstruction residual against the accepted MOD-VEH-0007 whole-vehicle physical closure",
  "Complete source/configuration/assumption/load-case provenance and result_label=uncorrelated_design_intent_static_carrier_wrench"
]
assumptions = [
  "The source state remains driver/no-fuel, centered-rack, flat rigid road, all four contacts active, and quasi-static.",
  "ASM-VEH-0003 remains a prototype 5 kg-per-corner wheel-center point-load allocation, not measured component-level unsprung mass distribution.",
  "ASM-SUSP-0005 defines the outboard carrier as a net suspension-interface load-transmission boundary and does not resolve wheel/hub/bearing/brake/drive internals.",
  "No lateral/longitudinal tire force, brake, drive, aero, inertia, gyroscopic, tire-compliance, alternate-contact, damper-velocity, or bump-stop load exists in this model."
]
verification_level = "A"
equation_ids = ["EQ-VEH-0020", "EQ-VEH-0021", "EQ-VEH-0022"]
benchmark_ids = ["BENCH-VEH-0015", "BENCH-VEH-0016", "BENCH-VEH-0017"]
authorization_id = "AUTH-VEH-0011"
authorization_state = "implemented_under_AUTH-VEH-0011; static_gravity_case_only; integrated_linkage_publication_prohibited"
assumption_ids = ["ASM-VEH-0002", "ASM-VEH-0003", "ASM-VEH-0005", "ASM-SUSP-0005"]
upstream_model_ids = ["MOD-VEH-0003", "MOD-VEH-0005", "MOD-VEH-0006", "MOD-VEH-0007", "MOD-SUSP-0007"]
downstream_model_ids = ["MOD-SUSP-0007"]
source_snapshot = "data_catalog/wufr27_static_carrier_wrench_v0.toml"
