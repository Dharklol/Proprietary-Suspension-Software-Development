[record]
id = "MOD-STEER-0002"
type = "model"
title = "Steering inverse-design orchestration layer"
status = "active"
disposition = "rewrite"
maturity = "M0"
description = "Role-driven nominal-height steering inverse-design orchestration layer. The implemented first slice resolves named parameter roles, generates symmetric rack and tie-rod geometry, converts every candidate into the public MOD-STEER-0001 geometry contract, and calls the existing analyzer for centered-state validity. Constrained search, objectives, candidate ranking, and higher-fidelity providers remain unimplemented. The layer contains no independent steering-kinematics equations."
inputs = [
  "Named baseline steering configuration",
  "Named requirement set with fixed, variable, discrete, derived, constraint, target, report-only, and evidence roles",
  "Development or design-authority variable bounds",
  "Explicit upright-local outer-pickup frame",
  "Target-provider response with signal identities, units, domain, weights, and source authority for later search",
  "Deterministic search method configuration and seed for later search",
  "Future reviewed suspension-pose, rack-load, uncertainty, and physical-parameter providers"
]
outputs = [
  "Complete generated steering geometry per candidate",
  "Centered-state MOD-STEER-0001 analyzer result and diagnostics for the implemented generator preflight",
  "Reference-state derived left and right tie-rod joint-center lengths",
  "Role, unit, bound, symmetry, baseline, and candidate provenance",
  "Future full-sweep feasibility status and named constraint margins",
  "Future raw and normalized objective contributions",
  "Future alternative feasible or nondominated candidate set",
  "Future transparent convenience ranking and explanation",
  "Sensitivity and robustness outputs only where separately authorized",
  "Machine-readable provenance and engineering-review exports"
]
assumptions = [
  "The first implementation uses one nominal suspension pose with rigid links and joints.",
  "MOD-STEER-0001 is the only steering-kinematics and derived-metric authority.",
  "The first implementation enforces exact left/right reflection symmetry.",
  "Steering-axis geometry, upright pose, suspension hardpoints, wheel centers, and static alignment are fixed in the first development requirement set.",
  "Outer tie-rod pickup depth is tightly bounded and may be fixed by a requirement set.",
  "The current body-aligned nominal outer-pickup local frame is development-only, not physical steering-arm or packaging authority.",
  "Tie-rod joint-center length is derived from the reference joint coordinates.",
  "The WUFR-26/27 response is a regression target, not a universal optimum.",
  "Hard constraints cannot be offset by objective score.",
  "Development bounds are not packaging or manufacturing authority."
]
verification_level = "A"
equation_ids = ["EQ-STEER-0001", "EQ-STEER-0002", "EQ-STEER-0003", "EQ-STEER-0004", "EQ-STEER-0005", "EQ-STEER-0006", "EQ-STEER-0007"]
benchmark_ids = ["BENCH-STEER-0009"]
dependency_model_ids = ["MOD-STEER-0001"]
authorization_state = "prototype_authorized"
authorization_id = "AUTH-STEER-0002"
authorization_document = "docs/models/steering/steering_inverse_design_prototype_authorization.md"
architecture_document = "docs/models/steering/steering_optimizer_architecture.md"
authorized_configurations = ["WUFR27_STEERING_BASELINE_V0", "STEERING_INVERSE_DESIGN_DEV_V0"]
implementation_state = "role_resolver_and_geometry_generator_implemented_for_review"
implementation_package = "src/pssd_steering/optimization"
implementation_document = "docs/models/steering/steering_geometry_generator_implementation_v0.1.0.md"
implementation_tests = "tests/test_steering_geometry_generator.py"
implementation_review = "docs/reviews/phase1_steering_geometry_generator_review.md"
implemented_components = [
  "requirement-set role parser",
  "bounded and fixed scalar resolver",
  "source-preserving WUFR-27 baseline inheritance",
  "symmetric rack and outer-pickup geometry generator",
  "derived tie-rod length",
  "centered-state analyzer preflight",
  "structured pre-sweep failure behavior"
]
unimplemented_components = [
  "full candidate sweep orchestration",
  "target-provider implementation",
  "objective evaluation and normalization",
  "deterministic constrained search",
  "multi-start strategy",
  "candidate-set and ranking reports",
  "hardware constraints",
  "robustness and higher-fidelity providers"
]
first_code_scope = "Role resolver and parametric geometry generator only; optimizer search remains absent until the geometry-generator review and target-recovery benchmark packet pass."
prototype_scope = "Deterministic nominal-height constrained inverse design using the existing analyzer, historical or user-supplied target curves, explicit hard constraints, and multi-candidate reporting."
prohibited_scope = "Duplicate steering physics, production geometry authority, physical packaging claims, suspension-state physics, tire/effort/compliance/tolerance/transient modeling, learned optimization, and as-built validation."
literature_basis = [
  "Guiggiani, The Science of Vehicle Dynamics (2022), Chapter 3 Sections 3.4.1-3.4.3",
  "Gillespie, Fundamentals of Vehicle Dynamics, Chapter 8",
  "Romano, Multi-Body Modelling and Mechanical Analysis of a Steering System (2022), Chapters 2 and 4",
  "Huang et al., Find Optimal Suspension Kinematics Targets for Vehicle Dynamics Using Reinforcement Learning, SAE 2026"
]
