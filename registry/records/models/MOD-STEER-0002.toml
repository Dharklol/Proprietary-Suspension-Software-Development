first_code_scope = "Nominal-height deterministic target-recovery and exploratory candidate comparison through the existing analyzer. Search results remain development-only until the later constraint, sensitivity, robustness, provider, and production gates pass."
prototype_scope = "Deterministic nominal-height constrained inverse design using the existing analyzer, historical or analyzer-generated target curves, explicit first-layer hard constraints, and multi-candidate reporting."
prohibited_scope = "Duplicate steering physics, production geometry authority, physical packaging or manufacturing claims, suspension-state physics, tire/effort/compliance/tolerance/transient modeling, learned optimization, global-optimality claims, and as-built validation."
