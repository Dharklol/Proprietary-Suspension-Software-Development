first_code_scope = "Deterministic inverse design, development constraint screening, local sensitivity, candidate comparison, and provider-neutral multi-state steering response through the existing analyzer. Results remain development-only until reviewed hardware, actual suspension-state inputs, operating-state targets, robustness, and later production gates pass."
prototype_scope = "Deterministic steering inverse design using the existing analyzer, explicit first-layer constraints, local sensitivity, multi-candidate reporting, and externally supplied zero-steer suspension poses."
prohibited_scope = "Duplicate steering physics, native suspension kinematics inside steering, production geometry authority, physical packaging or manufacturing claims, synthetic-pose-as-WUFR claims, tire/effort/compliance/tolerance/transient modeling, learned optimization, Pareto or global-optimality claims, and as-built validation."
