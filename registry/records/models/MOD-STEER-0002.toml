  "reviewed steering-arm, rack, articulation, thread-engagement, stop, clearance, and manufacturing constraints",
  "objective sensitivity analysis",
  "multiobjective nondominated-set computation",
  "discrete hardware options",
  "tolerance and robustness evaluation",
  "suspension-pose provider integration",
  "tire-informed target generation",
  "rack-load and steering-effort objectives",
  "physical-parameter identification and as-built correction layers",
  "production geometry release workflow"
