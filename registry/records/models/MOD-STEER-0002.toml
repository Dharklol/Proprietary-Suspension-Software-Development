[record]
id = "MOD-STEER-0002"
type = "model"
title = "Steering inverse-design orchestration layer"
status = "active"
disposition = "rewrite"
maturity = "M1"
description = "Role-driven nominal-height steering inverse-design orchestration layer. The implemented prototype resolves named parameter roles, generates symmetric rack and tie-rod geometry, converts every candidate into the public MOD-STEER-0001 geometry contract, evaluates the complete target sweep through that analyzer, separates hard infeasibility from target error, and performs deterministic seeded multi-start coordinate-pattern search. It returns several feasible candidates with objective, constraint, analyzer, geometry, method, and provenance records. It contains no independent steering-kinematics equations."
inputs = [
  "Named baseline steering configuration",
  "Named requirement set with fixed, variable, discrete, derived, constraint, target, report-only, and evidence roles",
  "Development or design-authority variable bounds",
  "Explicit upright-local outer-pickup frame",
  "Historical, synthetic, or future reviewed target-provider response with signals, units, domain, weights, normalization, and source authority",
  "Deterministic bounded coordinate-pattern search settings and integer seed",
  "Role-selected active-variable subset",
  "Future reviewed suspension-pose, rack-load, uncertainty, and physical-parameter providers"
]
outputs = [
  "Complete generated steering geometry per candidate",
  "Complete MOD-STEER-0001 analyzer sweep and diagnostics per retained or rejected evaluated candidate",
  "Reference-state derived left and right tie-rod joint-center lengths",
  "Role, unit, bound, symmetry, baseline, candidate, target, and method provenance",
  "Feasibility status and named hard-constraint records",
  "Raw and normalized wheel-heading objective contribution with units, scale, weight, and domain",
  "Several retained feasible candidates and transparent convenience ranking",
  "Deterministic multi-start and termination records",
  "Machine-readable candidate and search comparison reports",
  "Future sensitivity and robustness outputs only where separately implemented and authorized"
]
assumptions = [
  "The first implementation uses one nominal suspension pose with rigid links and joints.",
  "MOD-STEER-0001 is the only steering-kinematics and derived-metric authority.",
  "The first implementation enforces exact left/right reflection symmetry.",
  "Steering-axis geometry, upright pose, suspension hardpoints, wheel centers, and static alignment are fixed in the first development requirement set.",
  "Outer tie-rod pickup depth is tightly bounded and may be fixed by a requirement set.",
  "The current body-aligned nominal outer-pickup local frame is development-only, not physical steering-arm or packaging authority.",
  "Tie-rod joint-center length is derived from the reference joint coordinates.",
  "The WUFR-26/27 response is a fit-derived regression target, not a universal optimum or independent validation source.",
  "The analyzer-generated synthetic target is software verification rather than vehicle evidence.",
  "Hard constraints cannot be offset by objective score.",
  "Development bounds are not packaging or manufacturing authority.",
  "The current single-objective ranking is not a Pareto or global-optimality claim."
]
verification_level = "A"
equation_ids = ["EQ-STEER-0001", "EQ-STEER-0002", "EQ-STEER-0003", "EQ-STEER-0004", "EQ-STEER-0005", "EQ-STEER-0006", "EQ-STEER-0007"]
benchmark_ids = ["BENCH-STEER-0009", "BENCH-STEER-0010", "BENCH-STEER-0011"]
dependency_model_ids = ["MOD-STEER-0001"]
authorization_state = "prototype_authorized"
authorization_id = "AUTH-STEER-0002"
authorization_document = "docs/models/steering/steering_inverse_design_prototype_authorization.md"
architecture_document = "docs/models/steering/steering_optimizer_architecture.md"
authorized_configurations = ["WUFR27_STEERING_BASELINE_V0", "STEERING_INVERSE_DESIGN_DEV_V0"]
implementation_state = "nominal_constrained_inverse_design_implemented_for_review"
implementation_package = "src/pssd_steering/optimization"
geometry_generator_document = "docs/models/steering/steering_geometry_generator_implementation_v0.1.0.md"
optimizer_implementation_document = "docs/models/steering/steering_nominal_optimizer_implementation_v0.1.0.md"
implementation_tests = ["tests/test_steering_geometry_generator.py", "tests/test_steering_nominal_optimizer.py"]
implementation_review = "docs/reviews/phase1_steering_nominal_optimizer_review.md"
benchmark_report_script = "scripts/run_steering_nominal_optimizer_benchmarks.py"
