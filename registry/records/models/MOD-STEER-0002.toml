[record]
id = "MOD-STEER-0002"
type = "model"
title = "Steering inverse-design orchestration layer"
status = "active"
disposition = "rewrite"
maturity = "M1"
description = "Role-driven nominal-height steering inverse-design orchestration layer. The implemented prototype resolves named parameter roles, generates symmetric rack and tie-rod geometry, converts every candidate into the public MOD-STEER-0001 geometry contract, evaluates the complete target sweep through that analyzer, separates hard infeasibility from target error, and performs deterministic seeded multi-start coordinate-pattern search. It now supports named supplemental constraint screening with unavailable-evidence dispositions, analyzer-composed local finite-difference sensitivity, and diversity-aware multi-candidate comparison. It contains no independent steering-kinematics equations."
inputs = [
  "Named baseline steering configuration",
  "Named requirement set with fixed, variable, discrete, derived, constraint, target, report-only, and evidence roles",
  "Development or design-authority variable bounds",
  "Explicit upright-local outer-pickup frame",
  "Historical, synthetic, or future reviewed target-provider response with signals, units, domain, weights, normalization, and source authority",
  "Deterministic bounded coordinate-pattern search settings and integer seed",
  "Role-selected active-variable subset",
  "Named constraint-provider set with active or unavailable dispositions, units, limits, states, and authority",
  "Local sensitivity variable selection and bounded finite-difference settings",
  "Future reviewed suspension-pose, rack-load, uncertainty, and physical-parameter providers"
]
outputs = [
  "Complete generated steering geometry per candidate",
  "Complete MOD-STEER-0001 analyzer sweep and diagnostics per retained or rejected evaluated candidate",
  "Reference-state derived left and right tie-rod joint-center lengths",
  "Role, unit, bound, symmetry, baseline, candidate, target, constraint, and method provenance",
  "Feasibility status and named base hard-constraint records",
  "Supplemental active, failed, or unavailable constraint records with value, limits, margin, unit, state, authority, and blocking status",
  "Raw and normalized wheel-heading objective contribution with units, scale, weight, and domain",
  "Several retained feasible candidates and transparent convenience ranking",
  "Deterministic multi-start and termination records",
  "Local objective and numeric constraint-margin sensitivities for selected bounded variables",
  "Diversity-aware candidate comparison with objective, geometry, constraint, and evidence differences",
  "Machine-readable candidate, search, screening, sensitivity, and comparison reports",
  "Future robustness outputs only where separately implemented and authorized"
]
assumptions = [
  "The first implementation uses one nominal suspension pose with rigid links and joints.",
  "MOD-STEER-0001 is the only steering-kinematics and derived-metric authority.",
  "The first implementation enforces exact left/right reflection symmetry.",
  "Steering-axis geometry, upright pose, suspension hardpoints, wheel centers, and static alignment are fixed in the first development requirement set.",
  "Outer tie-rod pickup depth is tightly bounded and may be fixed by a requirement set.",
  "The current body-aligned nominal outer-pickup local frame is development-only, not physical steering-arm or packaging authority.",
  "Tie-rod joint-center length is derived from the reference joint coordinates.",
  "The WUFR-26/27 response is a fit-derived regression target, not a universal optimum or independent validation source.",
  "The analyzer-generated synthetic target is software verification rather than vehicle evidence.",
  "Hard constraints cannot be offset by objective score.",
  "Unavailable hardware or installed-state evidence is not treated as a passed constraint.",
  "The first supplemental constraint set uses development-only values and screens the retained search archive; it does not yet steer search polling around a reviewed hardware-feasible region.",
  "Local finite-difference sensitivity is not manufacturing tolerance, uncertainty propagation, or robustness analysis.",
  "Development bounds are not packaging or manufacturing authority.",
  "The current single-objective ranking and design-distance filtering are not Pareto or global-optimality claims."
]
verification_level = "A"
equation_ids = ["EQ-STEER-0001", "EQ-STEER-0002", "EQ-STEER-0003", "EQ-STEER-0004", "EQ-STEER-0005", "EQ-STEER-0006", "EQ-STEER-0007"]
benchmark_ids = ["BENCH-STEER-0009", "BENCH-STEER-0010", "BENCH-STEER-0011", "BENCH-STEER-0012", "BENCH-STEER-0013"]
