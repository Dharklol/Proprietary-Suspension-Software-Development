[record]
id = "MOD-STEER-0002"
type = "model"
title = "Steering inverse-design orchestration layer"
status = "active"
disposition = "rewrite"
maturity = "M1"
description = "Role-driven steering inverse-design orchestration layer. The implemented prototype resolves named parameter roles, generates symmetric rack and tie-rod design geometry, converts every candidate and provider-supplied operating pose into the public MOD-STEER-0001 geometry contract, evaluates complete rack sweeps through that analyzer, separates hard infeasibility from target error, and performs deterministic seeded multi-start coordinate-pattern search. It supports supplemental constraint screening, analyzer-composed local sensitivity, diversity-aware candidate comparison, provider-neutral zero-steer upright poses, explicit external rigid-transform pose-table ingestion, multi-state steering response, explicit per-state target aggregation, scalar centered dynamic-toe/state-dependent rack-gain objectives, bounded TTC-derived tire-informed differential targets, bounded force-demand tire-slip targets, and explicit motion-aware force-demand target composition with no independent steering, suspension, tire, or load equations."
inputs = [
  "Named baseline steering configuration",
  "Named requirement set with fixed, variable, discrete, derived, constraint, target, report-only, and evidence roles",
  "Development or design-authority variable bounds",
  "Explicit upright-local outer-pickup frame",
  "Historical, synthetic, geometric, explicit-state, scalar-state-metric, bounded tire-informed, bounded force-demand, or motion-aware target-provider response with signals, units, domain, weights, normalization, and source authority",
  "Deterministic bounded coordinate-pattern search settings and integer seed",
  "Role-selected active-variable subset",
  "Named constraint-provider set with active or unavailable dispositions, units, limits, states, and authority",
  "Local sensitivity variable selection and bounded finite-difference settings",
  "Provider-neutral suspension-pose set with left/right rigid upright transforms, named state coordinates, source authority, and unresolved-steering declaration",
  "External rigid-upright pose exchange table with source path/revision, canonical frame declaration, metre translations, active rotation matrices, authority, state coordinates, and explicit exclusion of tie-rod steering response",
  "Operating-state target set with explicit objective/report-only roles, left/right target curves, sample weights, normalization, state weights, convention adapters, and source authority",
  "State-metric target set with explicit state/metric IDs, left/right scalar targets, output units, normalization, weights, sign adapters, and source authority",
  "Reviewed source-preserving lateral tire summary plus explicit inside/outside normal-load, inclination, pressure, and slip-utilization inputs for bounded tire-informed steering target studies",
  "Reviewed explicit monotonic pre-peak tire force branches plus explicit inside/outside Fy demands for bounded force-demand-to-slip target studies",
  "Optional reviewed MOD-VEH-0002 planar body-motion schedule u/v/r and wheel-center geometry for motion-aware force-demand target composition",
  "Future reviewed rack-load, uncertainty, full WUFR vehicle-motion/force-demand, and physical-parameter providers"
]
outputs = [
  "Complete generated nominal steering geometry per candidate",
  "Complete MOD-STEER-0001 analyzer sweep and diagnostics per retained, rejected, or pose-state candidate evaluation",
  "Reference-state derived left and right tie-rod joint-center lengths",
  "Role, unit, bound, symmetry, baseline, candidate, target, constraint, pose, adapter, tire-source, vehicle-motion-source, and method provenance",
  "Feasibility status and named base hard-constraint records",
  "Supplemental active, failed, or unavailable constraint records with value, limits, margin, unit, state, authority, and blocking status",
  "Raw and normalized nominal or per-operating-state wheel-heading objective contributions with units, scale, weight, and domain",
  "Raw and normalized centered dynamic-toe or centered rack-to-wheel-gain state-metric objective contributions with explicit left/right residuals, units, scale, weight, and state",
  "Tire-informed operating-state target curves with source/intended tire identities, inside/outside operating points, source-censor disposition, slip-utilization schedule, and differential correction provenance",
  "Force-demand tire-slip target curves with bounded per-wheel force inversion and per-sample Ackermann-regime diagnostics",
  "Motion-aware force-demand target curves using explicit wheel-center velocity headings plus required tire slips, with the Ackermann anchor explicitly disabled when reviewed u/v/r is supplied",
  "Explicit weighted aggregate of visible operating-state or state-metric objective contributions",
  "Several retained feasible candidates and transparent convenience ranking",
  "Deterministic multi-start and termination records",
  "Local objective and numeric constraint-margin sensitivities for selected bounded variables",
  "Diversity-aware candidate comparison with objective, geometry, constraint, and evidence differences",
  "Pose-state wheel headings, centered global heading change, side-local dynamic-toe change, branch diagnostics, and minimum singularity ratio",
  "Machine-readable candidate, search, screening, sensitivity, comparison, suspension-pose, external-pose-adapter, operating-target, state-metric, tire-target, force-demand-target, and motion-aware-target reports",
  "Future robustness, effort, production vehicle-motion/tire-demand, and physical-correlation outputs only where separately implemented and authorized"
]
assumptions = [
  "MOD-STEER-0001 is the only steering-kinematics and derived-metric authority.",
  "The design-variable implementation enforces exact left/right reflection symmetry; operating suspension poses may be asymmetric.",
  "Steering-axis geometry, upright pose, suspension hardpoints, wheel centers, and static alignment are nominal design references before a suspension pose is applied.",
  "Outer tie-rod pickup depth is tightly bounded and may be fixed by a requirement set.",
  "The current body-aligned nominal outer-pickup local frame is development-only, not physical steering-arm or packaging authority.",
  "Tie-rod joint-center length is derived at the nominal reference geometry and remains fixed when suspension poses are applied.",
  "A suspension-pose provider supplies the zero-steer upright reference pose and must not already contain tie-rod-induced steering rotation.",
  "Rack geometry and rack inner joints remain chassis-fixed while steering axes, outer tie-rod pickups, and wheel-plane references move with the upright pose.",
  "A valid suspension pose may still produce an infeasible steering mechanism state; pose validity and steering-state feasibility are separate.",
  "The external adapter receives data already converted into the canonical steering body frame; vendor-specific frame, sign, unit, or Euler conversions are upstream responsibilities and must be documented by the source-specific exporter.",
  "The implemented suspension-pose and external-exchange fixtures are synthetic software verification and are not WUFR suspension-motion, OptimumK, CAD, or physical evidence.",
  "No reviewed machine-readable WUFR zero-steer upright transform series has yet been identified in the recorded source audit.",
  "The WUFR-26/27 response is a fit-derived regression target, not a universal optimum or independent validation source.",
  "Analyzer-generated synthetic nominal, operating-state curve, scalar state-metric, force-demand, and motion-aware targets are software verification rather than vehicle evidence.",
  "Operating-state and state-metric target weights and normalization scales are explicit model/provider inputs and are not vehicle-dynamics truth by presence alone.",
  "The OptimumK Steering Toe Angle Gain channel in the supplied export is dimensionless and is not equivalent by definition to the implemented centered rack-to-wheel gain in deg/mm.",
  "The Hoosier 43105 18x7.5-10 R25B TTC data are an explicit project engineering proxy for the intended Hoosier 43104 18x7.5-10 R20 for steering target development; source and intended identities remain distinct.",
  "TTC source peak-slip values at absolute 12 deg are censored by the source sweep boundary and are rejected from default peak-slip target generation.",
  "The first tire summary permits bounded trilinear interpolation only and never extrapolates pressure, inclination, or normal load.",
  "The historical MATLAB model's 2/3 sandpaper-to-track force/moment scale is external model-chain evidence and is not intrinsic TTC data or automatically applied by the Python tire provider.",
  "Tire-informed target wheel loads, cambers, pressures, and slip-utilization schedules are explicit provider inputs; the PR28 benchmark values are development references, not production WUFR operating-state authority.",
  "Force-demand tire branches are externally supplied monotonic pre-peak response tables; the steering layer does not fit or extrapolate tire force.",
  "A motion-aware target receives u, v, and r from MOD-VEH-0002 or an equivalent reviewed provider; the steering layer does not infer body sideslip, yaw rate, curvature, or velocity-center position.",
  "The exact low-speed Ackermann target remains a valid limiting/development route but is not silently substituted for an explicitly supplied non-Ackermann vehicle velocity field.",
  "Unlisted suspension states are report-only by explicit first-contract policy for curve targets and never silently inherit the nominal target.",
  "All states in the supplied operating pose set remain hard mechanism-feasibility checks before curve or scalar state objectives are scored.",
  "Hard constraints cannot be offset by objective score.",
  "Unavailable hardware or installed-state evidence is not treated as a passed constraint.",
  "The first supplemental constraint set uses development-only values and screens the retained search archive; it does not yet steer search polling around a reviewed hardware-feasible region.",
  "Local finite-difference sensitivity is not manufacturing tolerance, uncertainty propagation, or robustness analysis.",
  "Development bounds are not packaging or manufacturing authority.",
  "Current scalar target aggregation and design-distance filtering are not Pareto or global-optimality claims."
]
