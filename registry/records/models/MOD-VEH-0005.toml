[record]
id = "MOD-VEH-0005"
type = "model"
title = "WUFR driver/no-fuel static gravity allocation provider"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M1"
description = "WUFR-specific R&D adapter that converts the reviewed driver/no-fuel total corner-scale state plus reviewer-measured 10 kg front/10 kg rear unsprung axle totals and explicit ASM-VEH-0003 equal-corner prototype allocation into a validated sprung-body mass/CG gravity point and four unsprung point masses. The implemented provider supplies physical gravity point loads and maps sprung-body gravity through MOD-VEH-0003. It does not define the road-compatibility map, suspension equilibrium, or road reactions."
inputs = [
  "WUFR26_WHOLE_VEHICLE_FRAME_V0 driver/no-fuel total scale state and 3D design-intent CG reference",
  "Reviewer-measured 10 kg front-axle and 10 kg rear-axle unsprung totals",
  "ASM-VEH-0003 reviewed prototype allocation: 5 kg per corner at the corresponding physical wheel-center point",
  "Explicit gravity acceleration"
]
outputs = [
  "Total driver/no-fuel mass",
  "Prototype per-corner unsprung masses and nominal wheel-center source points",
  "Derived sprung mass and sprung CG from independently checked mass/first-moment subtraction",
  "Sprung-body physical gravity point load and MOD-VEH-0003 generalized body gravity",
  "Four unsprung physical wheel-center gravity point loads with explicit assumption/source provenance"
]
assumptions = [
  "The equal 5 kg/corner split is a reviewed prototype allocation, not a measured per-corner result.",
  "Each prototype unsprung lump follows its corresponding physical wheel center for the static-gravity slice; this is not an unsprung inertia model.",
  "The derived sprung CG inherits the source-separated driver/no-fuel planar scale state and driver-equivalent-ballast 0.290 m tilt-test height.",
  "Wheel gravity must be mapped by virtual work through the actual reviewed wheel/contact coordinate projection; a constant scalar -m*g is only the nominal level-state value."
]
verification_level = "B"
benchmark_ids = ["BENCH-VEH-0007"]
authorization_id = "AUTH-VEH-0005"
authorization_state = "static_gravity_allocation_implemented_under_AUTH-VEH-0005; road_compatibility_map_blocked"
assumption_ids = ["ASM-VEH-0002", "ASM-VEH-0003"]
upstream_model_ids = ["MOD-VEH-0003", "MOD-VEH-0004", "MOD-SUSP-0002"]
downstream_model_ids = []
source_record = "data_catalog/wufr27_static_gravity_allocation_v0.toml"
implementation_package = "src/pssd_vehicle/wufr_gravity.py"
implementation_document = "docs/models/vehicle/wufr_static_gravity_implementation_v0.1.0.md"
implementation_tests = ["tests/test_wufr_static_gravity.py", "tests/test_wufr_static_gravity_result_record.py"]
benchmark_report_script = "scripts/run_wufr_static_gravity_benchmarks.py"
benchmark_result_record = "benchmarks/vehicle/wufr_static_gravity_result_v0.1.0.toml"
