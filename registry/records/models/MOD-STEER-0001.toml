[record]
id = "MOD-STEER-0001"
type = "model"
title = "Rigid steering-linkage inverse-design model"
status = "active"
disposition = "rewrite"
maturity = "M1"
description = "Bounded rigid nominal-height steering-kinematics evaluator with a separately unauthorized future constrained inverse-design workflow. The implemented evaluator returns rigid closure, upright rotation, branch and singularity diagnostics, projected wheel heading, and derived Ackermann/radius/ratio quantities only where their prerequisites are explicitly supplied. The WUFR-26 nominal configuration has a frozen descriptive Level E design-source comparison."
inputs = [
  "QTY-GEO-0001 wheelbase",
  "QTY-GEO-0004 front steering-axis ground-intersection track",
  "Reviewed body/road frames and named reference configuration",
  "Reviewed steering-axis lines, upright poses, rack axis, rack inner-joint points, and steering-arm outer-joint points",
  "QTY-STEER-0001 steering-wheel angle where the full transmission is evaluated",
  "QTY-STEER-0002 primary steering-shaft angle where modeled or measured",
  "QTY-STEER-0003 pinion angle",
  "QTY-STEER-0004 rack displacement",
  "QTY-STEER-0005 rack displacement per pinion angle or reviewed variable-ratio function",
  "QTY-ALIGN-0001 and QTY-ALIGN-0002 static toe definitions",
  "Reviewed static camber and wheel-plane basis for projected heading",
  "Parameter roles: evidence, fixed, design variable, discrete option, hard constraint, acceptable band, target, derived output, or report-only",
  "Input sweep, target steering curves, packaging envelopes, articulation limits, manufacturing limits, adjustment limits, rack travel, and turning constraints"
]
outputs = [
  "QTY-STEER-0012 nominal left and right tie-rod joint-center distances",
  "QTY-STEER-0004 rack displacement versus available QTY-STEER-0006 and QTY-STEER-0007 left/right total-heading and incremental-steer maps",
  "Steering-wheel and pinion input maps only where transmission inputs are available",
  "Inside-versus-outside road-wheel relation for both turn directions where wheel headings are available",
  "QTY-STEER-0013 Ackermann reference and QTY-STEER-0014 Ackermann error where prerequisites exist",
  "QTY-STEER-0010 local and QTY-STEER-0011 secant steering ratios where signal identities exist",
  "QTY-STEER-0015 turning-path capabilities with named reference paths where prerequisites exist",
  "Feasibility, active constraints, constraint margins, branch identity, singularity margin, provenance, and solver diagnostics"
]
assumptions = [
  "First implementation uses rigid links and joints at a named nominal ride-height reference configuration.",
  "The mechanism branch is explicitly identified by the reference closure-Jacobian sign and maintained.",
  "Left/right quantities are canonical; inside/outside labels are assigned from turn direction rather than angle magnitude.",
  "Total toe-inclusive wheel heading and incremental steer are separate outputs.",
  "Ideal Ackermann is a low-speed reference or optional target, not a universal performance optimum.",
  "The WUFR-26 nominal CAD right side is an exact reflection of the left, but installed symmetry is not implied.",
  "No compliance, backlash, friction, steering loads, tire-force optimization, suspension travel, collision verification, or transient behavior is implied by the first model.",
  "External CAD and multibody motion studies are comparison evidence rather than runtime dependencies."
]
