[record]
id = "MOD-SUSP-0002"
type = "model"
title = "WUFR source-bounded wheel reference and physical suspension-state adapter"
status = "proposed"
disposition = "accepted_with_restrictions"
maturity = "M0"
description = "Composes MOD-SUSP-0001 with the frozen WUFR OptimumK wheel setup to construct a source-bounded nominal wheel center and reviewed wheel-plane reference, transport those references rigidly with solved upright pose, expose body-frame wheel-center vertical displacement as a physical suspension-state coordinate, invert that coordinate to q_L on the nominal branch, and remove tie-rod steering from historical front OptimumK result poses for validation. It does not add front steering closure, tire/contact physics, actuation kinematics, whole-vehicle source placement, or installed authority."
inputs = [
  "MOD-SUSP-0001 solved upright state and upright reference transform",
  "Frozen WUFR zero-offset wheel setup: half-track, tire diameter, static camber, static toe, side and axle identity",
  "Requested body-frame wheel-center vertical displacement for physical-state inversion",
  "Historical OptimumK lower/upper upright and upright tie-point result coordinates when source-steering removal is requested",
  "Source/configuration authority and bounded q_L domain"
]
outputs = [
  "Nominal source-bounded wheel-center point",
  "Nominal reviewed wheel-plane normal and forward reference",
  "Rigidly transported unresolved-steering front wheel reference or toe-link-closed rear wheel reference",
  "Body-frame wheel-center vertical displacement relative to nominal",
  "Bounded q_L solution and inversion diagnostics for a requested physical displacement",
  "Historical source-steering-removal twist and unresolved-steering validation pose",
  "Explicit feasibility, provenance, branch, residual, and unsupported-source diagnostics"
]
assumptions = [
  "The first WUFR nominal wheel-center construction is limited to the frozen OptimumK source state with zero longitudinal/lateral/vertical wheel offsets.",
  "Positive canonical z is upward; physical wheel-center vertical displacement is current body-frame wheel-center z minus nominal body-frame wheel-center z.",
  "The existing project static-alignment convention is reused: side-local positive toe is toe-out and positive camber is wheel-top outward.",
  "Wheel center and wheel-plane basis are rigidly attached to the ideal upright for this kinematic layer.",
  "Front suspension output remains unresolved in steering; MOD-STEER-0001 remains the physical front tie-rod steering closure owner.",
  "The historical OptimumK scalar Steer Angle channel is not the 3D rotation used to remove source steering.",
  "Wheelbase 1.5624 m is a reviewed vehicle scalar but does not establish the front/rear OptimumK source-origin translation by itself."
]
verification_level = "none"
equation_ids = ["EQ-SUSP-0005", "EQ-SUSP-0006", "EQ-SUSP-0007", "EQ-SUSP-0008"]
benchmark_ids = ["BENCH-SUSP-0004", "BENCH-SUSP-0005", "BENCH-SUSP-0006"]
authorization_id = "AUTH-SUSP-0002"
authorization_state = "review_ready_pending_merge"
authorization_document = "authorizations/suspension/AUTH-SUSP-0002.toml"
upstream_model_ids = ["MOD-SUSP-0001"]
downstream_model_ids = ["MOD-STEER-0001", "MOD-STEER-0002", "MOD-VEH-0002"]
source_snapshot = "data_catalog/wufr26_optimumk_suspension_hardpoints_v0.toml"
source_audit = "docs/models/suspension/wheel_reference_source_audit.md"
preimplementation_specification = "docs/models/suspension/wheel_reference_function_specification.md"
review_record = "docs/reviews/phase2_wheel_reference_authorization_review.md"
implementation_package = "src/pssd_suspension"
prohibited_scope = "Generic nonzero OptimumK wheel-offset interpretation, front tie-rod steering solve, generic contact patch/tire envelope or tire deflection, actuation/motion ratio, loads/compliance, whole-vehicle source-origin inference, installed/as-built or production claims."