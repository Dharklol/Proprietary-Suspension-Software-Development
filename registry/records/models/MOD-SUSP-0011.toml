assumption_ids = ["ASM-SUSP-0005", "ASM-SUSP-0007", "ASM-SUSP-0008", "ASM-VEH-0002", "ASM-VEH-0003", "ASM-VEH-0005"]
upstream_model_ids = ["MOD-VEH-0007", "MOD-VEH-0008", "MOD-SUSP-0009", "MOD-SUSP-0010"]
