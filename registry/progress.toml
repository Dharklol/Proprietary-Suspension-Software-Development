report_script = "scripts/run_steering_pose_provider_benchmarks.py"
merge_record = "PR #24, merge commit d5f4c983c1291458dff2665b650b28c322ee0395"

[[phase_1.tasks]]
id = "P1-STR-006C"
title = "Operating-state steering target aggregation"
status = "review_ready"
depends_on = ["P1-STR-006B"]
exit_criterion = "Named operating states can carry reviewed steering targets, weights, domains, normalization, source authority, and explicit objective/report-only roles; multi-state objectives are decomposed and aggregated without being inferred from historical or synthetic pose data."
review_record = "docs/reviews/phase1_steering_operating_state_target_review.md"
implementation_record = "docs/models/steering/steering_operating_state_target_implementation_v0.1.0.md"
benchmark_ids = ["BENCH-STEER-0016", "BENCH-STEER-0017"]
