[[phase_0.tasks]]
id = "P0-STR-011"
title = "WUFR-26 Level F uncertainty and physical correlation"
status = "active"
exit_criterion = "Existing whole-system free-play, historical compliance, calculated steering-load, and available-sensor evidence are source-linked; installed stops, primary-shaft-to-rack correlation, left/right rack-to-wheel response, repeatability, staged backlash/compliance attribution, sensor calibration, uncertainty, and an independently justified acceptance rule remain to be completed."
critical_path_rule = "Blocks as-built and compliance-inclusive claims, but does not block generic geometry generation, constrained search, historical target recovery, synthetic/external suspension-pose provider development, explicit nonphysical operating-state target aggregation, nonphysical scalar state-metric objective development, bounded tire-target provider development from reviewed external tire data, source-preserving vehicle operating-state exchange development, bounded force-demand tire-slip target software verification, or explicit planar motion-aware tire-slip target software verification."

[phase_1]
status = "active"
objective = "Build the steering vertical slice from the verified analyzer through nominal inverse design, explicit constraints, candidate comparison, suspension-state integration, tire targets, shared vehicle operating-state integration, bounded force-demand slip targets, and explicit planar motion-aware target composition before unavailable physical data become necessary."

