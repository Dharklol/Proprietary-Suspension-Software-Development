[[phase_1.tasks]]
id = "P1-STR-006D"
title = "Rack-load and steering-effort provider"
status = "active"
depends_on = ["P1-STR-006B"]
exit_criterion = "A reviewed externally supplied rack-force or column-torque envelope can enter state-dependent steering evaluation without embedding load physics in the rigid analyzer."
activation_rule = "Begin when steering effort/load becomes a real design dependency and a reviewed analytical or external load source exists."

[[phase_1.tasks]]
id = "P1-STR-006E"
title = "Physical-parameter and installed-correlation provider"
status = "active"
depends_on = ["P1-STR-006B", "P0-STR-011"]
exit_criterion = "Calibrated transmission, deadband, compliance, stops, and as-built offsets can correct or compare installed behavior without replacing rigid steering equations."
execution_rule = "Explicitly deferred. Do not implement until the required 2027 installed-system measurements, calibrations, and repeatability evidence exist."
