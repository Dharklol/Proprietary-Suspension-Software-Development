review_record = "docs/reviews/phase1_steering_suspension_pose_provider_review.md"
implementation_record = "docs/models/steering/steering_suspension_pose_provider_implementation_v0.1.0.md"
benchmark_ids = ["BENCH-STEER-0014"]
report_script = "scripts/run_steering_pose_provider_benchmarks.py"
merge_record = "PR #24, merge commit d5f4c983c1291458dff2665b650b28c322ee0395"

[[phase_1.tasks]]
id = "P1-STR-006B"
title = "Multi-state steering response evaluation"
status = "complete"
depends_on = ["P1-STR-006A"]
exit_criterion = "One generated steering candidate evaluates over symmetric and asymmetric suspension poses through complete MOD-STEER-0001 sweeps with state-dependent heading, dynamic toe, branch, and singularity diagnostics while synthetic pose results remain nonphysical software evidence."
review_record = "docs/reviews/phase1_steering_suspension_pose_provider_review.md"
implementation_record = "docs/models/steering/steering_suspension_pose_provider_implementation_v0.1.0.md"
