[phase_0]
status = "active"
objective = "Establish conventions, registries, migration dispositions, and benchmark gates before authoritative physics implementation."

[[phase_0.workstreams]]
id = "P0-W01"
title = "Governance and conventions"
status = "active"
exit_criterion = "Convention specification reviewed and frozen."

[[phase_0.workstreams]]
id = "P0-W02"
title = "Canonical quantity dictionary"
status = "active"
exit_criterion = "All MVP quantities have stable IDs and unambiguous definitions."

[[phase_0.workstreams]]
id = "P0-W03"
title = "Literature concordance"
status = "active"
exit_criterion = "Every accepted equation or model has equation-level references and applicability notes."

[[phase_0.workstreams]]
id = "P0-W04"
title = "Legacy calculator migration"
status = "active"
exit_criterion = "Every legacy block has a stable ID, disposition, canonical input/output mapping, and replacement path."

[[phase_0.workstreams]]
id = "P0-W05"
title = "Verification benchmark suite"
status = "active"
exit_criterion = "MVP equations pass dimensional, limiting-case, and independent benchmark checks."

[[phase_0.workstreams]]
id = "P0-W06"
title = "Sensor and data registry"
status = "active"
exit_criterion = "Sensors, channels, calibrations, data roles, and uncertainty paths are defined."

[[phase_0.tasks]]
id = "P0-DOC-001"
title = "Stable legacy block IDs"
status = "active"
exit_criterion = "Every meaningful workbook and external-process block has a permanent migration ID."

[[phase_0.tasks]]
id = "P0-DOC-002"
title = "Canonical quantity mapping"
status = "active"
exit_criterion = "Every retained legacy input and output maps to a reviewed canonical quantity."

[[phase_0.tasks]]
id = "P0-DOC-003"
title = "Evidence and redundancy controls"
status = "active"
exit_criterion = "Duplicate, derived, calibration, identification, validation, and historical evidence relationships are classified."

[[phase_0.tasks]]
id = "P0-DOC-004"
title = "External source recovery"
status = "active"
exit_criterion = "Priority external artifacts are recovered and hashed or formally declared unavailable."

[[phase_0.tasks]]
id = "P0-DOC-005"
title = "Equation cards and benchmark plans"
status = "active"
exit_criterion = "Candidate equations have sources, applicability, and verification plans before implementation."

[[phase_0.tasks]]
id = "P0-DOC-006"
title = "Implementation authorization"
status = "active"
exit_criterion = "No physics implementation begins without an explicit bounded authorization record."
