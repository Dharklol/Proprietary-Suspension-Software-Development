[phase_0]
status = "active"
objective = "Establish conventions, registries, migration dispositions, and benchmark gates before authoritative physics implementation."

[[phase_0.workstreams]]
id = "P0-W01"
title = "Governance and conventions"
status = "active"
exit_criterion = "Convention specification reviewed and frozen."

[[phase_0.workstreams]]
id = "P0-W02"
title = "Canonical quantity dictionary"
status = "active"
exit_criterion = "All MVP quantities have stable IDs and unambiguous definitions."

[[phase_0.workstreams]]
id = "P0-W03"
title = "Literature concordance"
status = "active"
exit_criterion = "Every accepted equation or model has equation-level references and applicability notes."

[[phase_0.workstreams]]
id = "P0-W04"
title = "Legacy calculator migration"
status = "active"
exit_criterion = "Every legacy block has a stable ID, disposition, canonical input/output mapping, and replacement path."

[[phase_0.workstreams]]
id = "P0-W05"
title = "Verification benchmark suite"
status = "active"
exit_criterion = "MVP equations pass dimensional, limiting-case, and independent benchmark checks."

[[phase_0.workstreams]]
id = "P0-W06"
title = "Sensor and data registry"
status = "active"
exit_criterion = "Sensors, channels, calibrations, data roles, and uncertainty paths are defined."

[[phase_0.tasks]]
id = "P0-DOC-001"
title = "Stable legacy block IDs"
status = "active"
exit_criterion = "Every meaningful workbook and external-process block has a permanent migration ID."

[[phase_0.tasks]]
id = "P0-DOC-002"
title = "Canonical quantity mapping"
status = "active"
exit_criterion = "Every retained legacy input and output maps to a reviewed canonical quantity."

[[phase_0.tasks]]
id = "P0-DOC-003"
title = "Evidence and redundancy controls"
status = "active"
exit_criterion = "Duplicate, derived, calibration, identification, validation, and historical evidence relationships are classified."

[[phase_0.tasks]]
id = "P0-DOC-004"
title = "External source recovery"
status = "active"
exit_criterion = "Priority external artifacts are recovered and hashed or formally declared unavailable."

[[phase_0.tasks]]
id = "P0-DOC-005"
title = "Equation cards and benchmark plans"
status = "active"
exit_criterion = "Candidate equations have sources, applicability, and verification plans before implementation."

[[phase_0.tasks]]
id = "P0-DOC-006"
title = "Implementation authorization"
status = "active"
exit_criterion = "No physics implementation begins without an explicit bounded authorization record."

[[phase_0.tasks]]
id = "P0-STR-001"
title = "Steering canonical definition subset"
status = "active"
exit_criterion = "Frames, geometry objects, transmission quantities, road-wheel angles, tie-rod length, steering ratios, Ackermann metrics, and turning-path definitions are reviewed and frozen for the rigid steering evaluator."

[[phase_0.tasks]]
id = "P0-STR-002"
title = "Steering source recovery"
status = "active"
exit_criterion = "The legacy optimizer and best available WUFR CAD motion-study package are recovered and hashed or their absence is formally accepted for prototype scope."

[[phase_0.tasks]]
id = "P0-STR-003"
title = "Steering requirement-role matrix"
status = "active"
exit_criterion = "Current WUFR steering values are classified as evidence, fixed parameters, design variables, discrete options, hard constraints, acceptable bands, targets, or derived outputs."

[[phase_0.tasks]]
id = "P0-STR-004"
title = "Steering benchmark geometry"
status = "review_ready"
exit_criterion = "GEO-STEER-BASIC-001 and Level A/B/C expected results are reviewed and frozen before mechanism code begins."

[[phase_0.tasks]]
id = "P0-STR-005"
title = "Rigid steering function and equation packet"
status = "review_ready"
exit_criterion = "EQ-STEER-0001 through 0007 have reviewed sources, equations, validity limits, numerical behavior, failure states, and benchmark links."

[[phase_0.tasks]]
id = "P0-STR-006"
title = "WUFR-26 steering benchmark freeze"
status = "active"
exit_criterion = "Final WUFR-26 geometry, signal identities, static toe/datum, operational stops, source hashes, and Level E comparison tolerances are frozen."

[[phase_0.tasks]]
id = "P0-PAR-001"
title = "Steering parameter-observation seed"
status = "review_ready"
exit_criterion = "Recovered WUFR steering dimensions and settings are stored as non-authoritative observations with provenance, units, frame, uncertainty, and applicability before active-value selection."

[[phase_0.tasks]]
id = "P0-STR-007"
title = "Steering drawing and BOM authority"
status = "review_ready"
exit_criterion = "WUFR-26 steering assembly, rack, tie-rod, and front-upright drawing/BOM hierarchy is mapped; conflicting part identities are recorded; and the active-geometry extraction path is defined."

[[phase_0.tasks]]
id = "P0-STR-008"
title = "WUFR-26 steering baseline reconciliation"
status = "review_ready"
exit_criterion = "The real-geometry baseline, specification observations, rejected steering ratio, rack-center/travel interpretation, coordinate adapters, front-left FDR identity, static-toe reference state, geometry-study assembly relationship, and remaining SolidWorks correlation requirements are reviewed."

[[phase_0.tasks]]
id = "P0-STR-009"
title = "Bounded rigid steering prototype authorization"
status = "review_ready"
exit_criterion = "AUTH-STEER-0001 is reviewed and merged with permitted functions, numerical behavior, configurations, benchmark requirements, provenance, prohibited scope, and promotion gates explicitly recorded."

[[phase_0.tasks]]
id = "P0-STR-010"
title = "WUFR-26 Level E comparison and residual review"
status = "review_ready"
exit_criterion = "The source parser, canonical wheel-plane projection, convention adapter, dense nominal sweep, residual metrics, result record, and acceptance disposition are reviewed and frozen for nominal design-source comparison."
