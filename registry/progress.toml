[phase_0]
status = "active"
objective = "Establish conventions, registries, migration dispositions, and benchmark gates before authoritative physics implementation."

[[phase_0.workstreams]]
id = "P0-W01"
title = "Governance and conventions"
status = "active"
exit_criterion = "Convention specification reviewed and frozen."

[[phase_0.workstreams]]
id = "P0-W02"
title = "Canonical quantity dictionary"
status = "active"
exit_criterion = "All MVP quantities have stable IDs and unambiguous definitions."

[[phase_0.workstreams]]
id = "P0-W03"
title = "Literature concordance"
status = "active"
exit_criterion = "Every accepted equation or model has equation-level references and applicability notes."

[[phase_0.workstreams]]
id = "P0-W04"
title = "Legacy calculator migration"
status = "active"
exit_criterion = "Every legacy block has a stable ID, disposition, canonical input/output mapping, and replacement path."

[[phase_0.workstreams]]
id = "P0-W05"
title = "Verification benchmark suite"
status = "active"
exit_criterion = "MVP equations pass dimensional, limiting-case, and independent benchmark checks."

[[phase_0.workstreams]]
id = "P0-W06"
title = "Sensor and data registry"
status = "active"
exit_criterion = "Sensors, channels, calibrations, data roles, and uncertainty paths are defined."

[[phase_0.tasks]]
id = "P0-DOC-001"
title = "Stable legacy block IDs"
status = "active"
exit_criterion = "Every meaningful workbook and external-process block has a permanent migration ID."

[[phase_0.tasks]]
id = "P0-DOC-002"
title = "Canonical quantity mapping"
status = "active"
exit_criterion = "Every retained legacy input and output maps to a reviewed canonical quantity."

[[phase_0.tasks]]
id = "P0-DOC-003"
title = "Evidence and redundancy controls"
status = "active"
exit_criterion = "Duplicate, derived, calibration, identification, validation, and historical evidence relationships are classified."

[[phase_0.tasks]]
id = "P0-DOC-004"
title = "External source recovery"
status = "active"
exit_criterion = "Priority external artifacts are recovered and hashed or formally declared unavailable."

[[phase_0.tasks]]
id = "P0-DOC-005"
title = "Equation cards and benchmark plans"
status = "active"
exit_criterion = "Candidate equations have sources, applicability, and verification plans before implementation."

[[phase_0.tasks]]
id = "P0-DOC-006"
title = "Implementation authorization"
status = "active"
exit_criterion = "No physics implementation begins without an explicit bounded authorization record."

[[phase_0.tasks]]
id = "P0-STR-001"
title = "Steering canonical definition subset"
status = "complete"
exit_criterion = "Frames, geometry objects, transmission quantities, road-wheel angles, tie-rod length, steering ratios, Ackermann metrics, and turning-path definitions are reviewed and frozen for the rigid steering evaluator."
review_record = "docs/reviews/phase0_steering_definition_role_closeout.md"

[[phase_0.tasks]]
id = "P0-STR-002"
title = "Steering source recovery"
status = "complete"
exit_criterion = "The legacy optimizer and best available WUFR CAD motion-study package are recovered and hashed or their absence is formally accepted for prototype scope."
review_record = "docs/reviews/phase0_steering_source_hash_review.md"

[[phase_0.tasks]]
id = "P0-STR-003"
title = "Steering requirement-role matrix"
status = "complete"
exit_criterion = "Current WUFR steering values are classified as evidence, fixed parameters, design variables, discrete options, hard constraints, acceptable bands, targets, or derived outputs."
review_record = "docs/reviews/phase0_steering_definition_role_closeout.md"

[[phase_0.tasks]]
id = "P0-STR-004"
title = "Steering benchmark geometry"
status = "complete"
exit_criterion = "GEO-STEER-BASIC-001 and Level A/B/C expected results are reviewed and frozen before mechanism code begins."
review_record = "docs/reviews/phase0_steering_review_closeout.md"

[[phase_0.tasks]]
id = "P0-STR-005"
title = "Rigid steering function and equation packet"
status = "complete"
exit_criterion = "EQ-STEER-0001 through 0007 have reviewed sources, equations, validity limits, numerical behavior, failure states, and benchmark links."
review_record = "docs/reviews/phase0_steering_review_closeout.md"

[[phase_0.tasks]]
id = "P0-STR-006"
title = "WUFR-26 steering benchmark and installed-state freeze"
status = "active"
exit_criterion = "The nominal design geometry, source package, and descriptive Level E result are frozen; installed stops, staged transmission correlation, setup uncertainty, component-level backlash/compliance attribution, and independently justified Level F tolerances remain to be frozen."
critical_path_rule = "Blocks installed or as-built WUFR-26 claims, but does not block generic nominal inverse-design development under AUTH-STEER-0002."

[[phase_0.tasks]]
id = "P0-PAR-001"
title = "Steering parameter-observation seed"
status = "complete"
exit_criterion = "Recovered WUFR steering dimensions and settings are stored as non-authoritative observations with provenance, units, frame, uncertainty, and applicability before active-value selection."
review_record = "docs/reviews/phase0_steering_review_closeout.md"

[[phase_0.tasks]]
id = "P0-STR-007"
title = "Steering drawing and BOM authority"
status = "complete"
exit_criterion = "WUFR-26 steering assembly, rack, tie-rod, and front-upright drawing/BOM hierarchy is mapped; conflicting part identities are recorded; and the active-geometry extraction path is defined."
review_record = "docs/reviews/phase0_steering_review_closeout.md"

[[phase_0.tasks]]
id = "P0-STR-008"
title = "WUFR-26 steering baseline reconciliation"
status = "complete"
exit_criterion = "The real-geometry baseline, specification observations, rejected steering ratio, rack-center/travel interpretation, coordinate adapters, front-left FDR identity, static-toe reference state, geometry-study assembly relationship, and remaining SolidWorks correlation requirements are reviewed."
review_record = "docs/reviews/phase0_steering_review_closeout.md"

[[phase_0.tasks]]
id = "P0-STR-009"
title = "Bounded rigid steering prototype authorization"
status = "complete"
exit_criterion = "AUTH-STEER-0001 is reviewed and merged with permitted functions, numerical behavior, configurations, benchmark requirements, provenance, prohibited scope, and promotion gates explicitly recorded."
review_record = "docs/reviews/phase0_steering_review_closeout.md"

[[phase_0.tasks]]
id = "P0-STR-010"
title = "WUFR-26 Level E comparison and residual review"
status = "complete"
exit_criterion = "The source parser, canonical wheel-plane projection, convention adapter, dense nominal sweep, residual metrics, result record, FDR endpoint cross-check, and descriptive acceptance disposition are reviewed and frozen for nominal design-source comparison."

[[phase_0.tasks]]
id = "P0-STR-011"
title = "WUFR-26 Level F uncertainty and physical correlation"
status = "active"
exit_criterion = "Existing whole-system free-play, historical compliance, calculated steering-load, and available-sensor evidence are source-linked; installed stops, primary-shaft-to-rack correlation, left/right rack-to-wheel response, repeatability, staged backlash/compliance attribution, sensor calibration, uncertainty, and an independently justified acceptance rule remain to be completed."
critical_path_rule = "Blocks as-built and compliance-inclusive claims, but does not block generic geometry generation, constrained search, historical target recovery, synthetic/external suspension-pose provider development, or explicit nonphysical operating-state target aggregation."

[phase_1]
status = "active"
objective = "Build the steering vertical slice from the verified analyzer through nominal inverse design, explicit constraints, candidate comparison, suspension-state integration, and provider-ready operating-state objectives before unavailable physical data become necessary."

[[phase_1.workstreams]]
id = "P1-W01"
title = "Steering inverse-design vertical slice"
status = "active"
exit_criterion = "A literature-grounded, analyzer-composed steering platform returns traceable feasible candidate sets across reviewed operating states and remains ready for tire, effort, robustness, and later physical-correlation providers."

[[phase_1.tasks]]
id = "P1-STR-001"
title = "Steering inverse-design requirements and authorization"
status = "complete"
exit_criterion = "AUTH-STEER-0002, MOD-STEER-0002, WUFR27_STEERING_BASELINE_V0, STEERING_INVERSE_DESIGN_DEV_V0, architecture, literature basis, analyzer-composition rule, provider boundaries, and benchmark gates are reviewed and merged."
review_record = "docs/reviews/phase1_steering_inverse_design_authorization_review.md"
merge_record = "PR #20, merge commit eb3d240d235cd6ba0cf52601df31a67768e751ff"

[[phase_1.tasks]]
id = "P1-STR-002"
title = "Parametric steering geometry generator"
status = "complete"
depends_on = ["P1-STR-001"]
exit_criterion = "Role-resolved candidates generate complete symmetric analyzer geometry; zero offsets reproduce the WUFR-27 baseline; tie-rod length is derived; invalid candidates fail before sweep; and no optimizer search is included."
review_record = "docs/reviews/phase1_steering_geometry_generator_review.md"
implementation_record = "docs/models/steering/steering_geometry_generator_implementation_v0.1.0.md"
merge_record = "PR #21, merge commit cdb8a89605cb8532d4758f384597de39b456d0ef"

[[phase_1.tasks]]
id = "P1-STR-003"
title = "Nominal constrained inverse-design optimizer"
status = "complete"
depends_on = ["P1-STR-002"]
exit_criterion = "Deterministic multi-start constrained search recovers frozen synthetic and historical target behavior, preserves hard infeasibility, is repeatable, and reports multiple candidates with transparent objective contributions and diagnostics."
review_record = "docs/reviews/phase1_steering_nominal_optimizer_review.md"
implementation_record = "docs/models/steering/steering_nominal_optimizer_implementation_v0.1.0.md"
benchmark_ids = ["BENCH-STEER-0010", "BENCH-STEER-0011"]
report_script = "scripts/run_steering_nominal_optimizer_benchmarks.py"
merge_record = "PR #22, merge commit 5ab40328346e14a491e1b1a1775a71af67980744"

[[phase_1.tasks]]
id = "P1-STR-004"
title = "Steering constraint and candidate-report layer"
status = "complete"
depends_on = ["P1-STR-003"]
exit_criterion = "Every active hard constraint has a named value, limit, margin, state, and authority; candidate reports include complete analyzer outputs, objective decomposition, sensitivity, alternative candidates, and provenance."
review_record = "docs/reviews/phase1_steering_constraints_sensitivity_review.md"
implementation_record = "docs/models/steering/steering_constraints_sensitivity_implementation_v0.1.0.md"
benchmark_ids = ["BENCH-STEER-0012", "BENCH-STEER-0013"]
report_script = "scripts/run_steering_constraint_sensitivity_benchmarks.py"
constraint_set = "STEERING_CONSTRAINT_PROVIDER_DEV_V0"
scope_note = "The current active checks are development-only and supplemental screening is applied to the retained search archive. Reviewed hardware constraints must later enter every search-candidate disposition before hardware-feasible optimization claims."
merge_record = "PR #23, merge commit 71fee442e905bb11033b0b6c3ec854552b19237e"

[[phase_1.tasks]]
id = "P1-STR-005"
title = "Steering robustness and discrete-option layer"
status = "active"
depends_on = ["P1-STR-004"]
exit_criterion = "Reviewed tolerance and hardware-option inputs produce nominal, perturbed, and worst-case results without promoting development bounds to design authority."
activation_rule = "Defer major implementation until reviewed tolerance inputs or real discrete-hardware choices are available; state-dependent steering and operating-state objectives no longer block the software architecture."

[[phase_1.tasks]]
id = "P1-STR-006"
title = "Steering higher-fidelity provider integration"
status = "active"
depends_on = ["P1-STR-004"]
exit_criterion = "Reviewed suspension-pose, tire-target, rack-load/effort, uncertainty, and physical-parameter providers can be connected without replacing the analyzer or optimizer geometry contracts."

[[phase_1.tasks]]
id = "P1-STR-006A"
