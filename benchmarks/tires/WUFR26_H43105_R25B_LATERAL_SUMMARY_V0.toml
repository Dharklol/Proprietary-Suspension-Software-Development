cornering_runs = "TTC Round 6 runs 21 and 22"
drive_brake_runs = "TTC Round 6 runs 35 and 36; inventoried for future expansion, not consumed by this lateral steering provider"
coordinate_system = "SAE Tire Coordinate System as recorded in Tire Selection Notes"

[engineering_equivalence]
basis = "Project steering-authority decision on 2026-07-24: use the 43105 R25B TTC behavior as the engineering data equivalent for the selected 43104 R20 tire."
identity_rule = "Preserve source tire and intended tire identities separately in all derived targets."

[conventions]
normal_load_unit = "N"
inclination_unit = "deg"
pressure_unit = "kPa"
cornering_stiffness_unit = "N/deg"
peak_lateral_force_unit = "N"
peak_slip_angle_unit = "deg"
peak_lateral_force = "positive magnitude from Tire Selection Notes, leaning into corner"
source_peak_slip_angle = "signed source value from Tire Selection Notes, leaning into corner; steering adapter uses magnitude explicitly"
peak_slip_censor_rule = "Values with abs(source_peak_slip_angle_deg) == 12.0 are flagged censored because the source sweep terminates at 12 deg."
interpolation = "bounded trilinear interpolation only; no extrapolation"

[restrictions]
items = [
  "Do not treat R25B and R20 as literal material or part-number identity; this file records an explicit project engineering-equivalence decision.",
  "Do not treat a 12 deg source peak as a verified true peak without separate evidence; it is censored at the source sweep boundary.",
  "Do not extrapolate beyond the reviewed pressure, inclination, or normal-load grid.",
  "Do not apply the historical 2/3 sandpaper-to-track scale factor inside this tire-data layer.",
  "Do not treat peak-slip differential targets as a complete steady-state vehicle equilibrium or production tire-optimal steering claim."
]

