status = "review_ready_engineering_proxy"
source_tire_id = "HOOSIER_43105_18X7.5-10_R25B"
intended_tire_id = "HOOSIER_43104_18X7.5-10_R20"
authority = "Team-authorized R25B TTC engineering-equivalent proxy for WUFR steering target development; not literal compound/part-number identity or installed-tire correlation."

[source]
provider = "Box"
folder_id = "325714540497"
tire_model_tracker_file_id = "1890898261243"
tire_selection_notes_file_id = "1890901561957"
cornering_trojan_file_id = "1890914118742"
