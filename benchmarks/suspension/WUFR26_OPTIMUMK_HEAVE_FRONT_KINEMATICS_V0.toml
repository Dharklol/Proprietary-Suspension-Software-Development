version = "0.1.0"
benchmark_fixture_id = "WUFR26_OPTIMUMK_HEAVE_FRONT_KINEMATICS_V0"
authority = "historical_external_kinematics_evidence_only"
source_type = "optimumk_result_export"
source_filename = "WUFR-26 8.21 Heaves 1inch.xlsx"
source_sha256 = "db071b7e696149ec82213e9ed05aa557349d18d19debe7925e7e01058534e4b8"
source_export_version = "2.3.0"
source_corner = "front_right"
source_motion = "pure_heave"
source_steering_input_deg = 0.0
geometry_source = "data_catalog/wufr26_optimumk_suspension_hardpoints_v0.toml"
source_static_precision_note = "PR38 static hardpoints are transcribed from the Box text representation to 0.001 mm while the result workbook exposes higher precision. The 2 micrometre cross-tool position tolerance intentionally covers this source precision difference."

[adapter]
source_result_frame_observation = "During pure heave, exported chassis hardpoint z coordinates translate by exactly the Motion [Heave] value while wheel/upright coordinates remain road-fixed. For this benchmark only, subtract the body heave translation before applying the reviewed OptimumK orientation conversion."
body_rereference_rule = "p_body_optk_mm = p_export_optk_mm - [0,0,heave_mm]"
canonical_rule = "p_body_can_m = 0.001 * [x_body_optk,-y_body_optk,z_body_optk]"
applicability = "pure_heave_result_only; do_not_generalize_to_roll_pitch_or_other_OptimumK_exports_without_separate_review"

[solver_input]
independent_coordinate = "lower_arm_rotation_q_L_rad"
rotation_sign_rule = "right-hand rotation about each fore-to-aft inboard hinge axis in the canonical axle-local frame"
upper_rotation_role = "benchmark_reference_only; implementation must solve q_U through EQ-SUSP-0002 rather than ingest expected_q_U_deg as a solver input"

