  "Toe Angle",
  "Steer Angle",
  "Steering Toe Angle Gain",
  "Steering Ratio",
  "wheel plane / wheel heading",
  "bump steer"
]
reason = "The OptimumK result already contains tie-rod-constrained steering; using those channels inside the suspension reference solver would double count front steering when composed with MOD-STEER-0001."

[rear_origin_observation]
status = "evidence_only_not_authorized_in_PR39"
observation = "The same heave result export places nominal rear-right upright x approximately 1562.4 mm behind the front suspension-local origin, matching the setup Reference Distance magnitude. PR38 intentionally retained front/rear static source-local origins, so no rear whole-vehicle translation is promoted by this benchmark."
