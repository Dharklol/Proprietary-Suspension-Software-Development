[derivation]
tie_rod_length = "sqrt(0.12^2 + 0.29^2)"
branch_limit = "For the limiting outside link, distance between steering axis and rack joint equals steering-arm radius plus tie-rod length."
expected_value_method = "Independent double-precision solution of the stated rigid distance constraints followed by the exact Ackermann equations; values are frozen as benchmark expectations, not WUFR parameters."
