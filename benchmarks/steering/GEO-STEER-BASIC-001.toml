steering_axis_direction = [0.0, 0.0, 1.0]
outer_tie_rod_joint_at_center = [-0.08, 0.54, 0.0]
wheel_forward_direction_at_center = [1.0, 0.0, 0.0]
static_toe = 0.0
nominal_tie_rod_length = 0.3138470965295043
reference_branch_upright_rotation = 0.0
mechanical_angle_min = -1.0
