version = "0.1.0"
geometry_id = "GEO-STEER-BASIC-001"
status = "frozen_for_bounded_prototype"
purpose = "Fully specified planar-symmetric special case of the spatial rigid steering model for closure, branch, symmetry, derivative, Ackermann, and failure tests."
authorization_id = "AUTH-STEER-0001"

[conventions]
length_unit = "m"
angle_unit = "rad"
body_axes = "+x forward, +y vehicle left, +z upward"
road_plane = "z = 0"
positive_road_wheel_heading = "left yaw by right-hand rule about +z"
positive_rack_displacement = "translation along +y"
turn_mapping = "negative rack displacement produces a left turn in this fixture"

[vehicle]
wheelbase = 1.6
steering_axis_ground_intersection_track = 1.2

[rack]
axis_origin = [-0.2, 0.0, 0.0]
axis_direction = [0.0, 1.0, 0.0]
left_inner_joint_at_center = [-0.2, 0.25, 0.0]
right_inner_joint_at_center = [-0.2, -0.25, 0.0]
