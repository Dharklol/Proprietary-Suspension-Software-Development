[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pssd-registry"
version = "0.2.0"
description = "Model-assurance registry tooling and bounded rigid-steering prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
