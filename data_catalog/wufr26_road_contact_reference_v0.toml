[map_contract]
body_coordinate_order = ["z_s_m", "phi_rad", "theta_rad"]
wheel_coordinate_order = ["front_left_delta_z_wc_body_m", "front_right_delta_z_wc_body_m", "rear_left_delta_z_wc_body_m", "rear_right_delta_z_wc_body_m"]
road_closure = "For each active corner solve g_i(q_b,z_i)=n_road dot (r_cp_i^road(q_b,z_i)-r_road_ref)=0 on the nominal-continuation suspension branch."
jacobian = "J_wb = partial(z_w)/partial(q_b), evaluated with declared two-step numerical differentiation and branch-preserving solves."
contact_coefficient = "c_i = n_road dot partial(r_cp_i^road)/partial(z_i), evaluated from the same contact-reference provider."
unsprung_gravity_projection = "Q_u_i = F_u_i^road dot partial(r_wc_i^road)/partial(z_i), using the physical wheel-center point load from MOD-VEH-0005."

[authority_boundaries]
generic_tire_contact_patch_authority = false
loaded_radius_authority = false
tire_deflection_authority = false
installed_as_built_authority = false
runtime_front_steering_owned_by = "MOD-STEER-0001"
runtime_suspension_pose_owned_by = "MOD-SUSP-0002"
body_pose_and_road_owned_by = "MOD-VEH-0003"
prohibited_substitutions = [
  "body roll times track or half-track as wheel travel",
  "direct left-right wheel-travel difference as a whole-vehicle compatibility rule",
  "scalar spring or ARB motion ratio as the compatibility Jacobian",
  "OptimumK scalar Steer Angle as the front upright rotation input",
  "translation-only front contact point that omits centered tie-rod closure",
  "generic tire-radius/lowest-point inference in place of the source contact reference",
  "hard-coded unit contact coefficient or hard-coded -49.05 N unsprung generalized force away from a verified nominal level case"
]
