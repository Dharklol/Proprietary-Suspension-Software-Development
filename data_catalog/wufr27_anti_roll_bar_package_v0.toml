[reviewed_setup]
review_date = "2026-07-26"
review_source = "Reviewer/user correction in the FSAE project conversation"
architecture = "WUFR Z-bar / adjustable blade anti-roll-bar concept"
intentional_preload = "zero"
constitutive_selection = "The governing WUFR constitutive data are the five discrete SolidWorks FEA blade-tip stiffness values from the Google Sheet tab ARB FEA vs Simulink. Values are linear force/deflection slopes in N/mm. No interpolation between settings is authorized."

[governing_solidworks_fea]
spreadsheet_url = "https://docs.google.com/spreadsheets/d/1rJjQBnSOMEGQmyromb9SjNgOEMwBBOdUpUKPPLOf-3c/edit?gid=0#gid=0"
sheet_name = "ARB FEA vs Simulink"
quantity = "linear blade-tip stiffness"
source_column = "FEA SolidWorks Stiffness"
source_unit = "N/mm"
setting_numbers = [1, 2, 3, 4, 5]
stiffness_N_per_mm = [280.0, 300.0, 400.0, 700.0, 2300.0]
stiffness_N_per_m = [280000.0, 300000.0, 400000.0, 700000.0, 2300000.0]
beam_theory_unit_check = "The sheet uses k=3EI/L^3 in N/m and divides by 1000 to report N/mm, confirming the force/deflection units used by the FEA column."
constitutive_law = "F_b = k_b * delta_b; U_b = 0.5 * k_b * delta_b^2; Q_ARB = -J_delta_b^T * F_b"
selection_rule = "Setting is discrete. Select exactly one of settings 1..5; do not interpolate, average, blend, or stack stiffness sources without separate authorization."

[comparison_only]
matlab_source = "Weight_transfer_sensitivity.m"
matlab_reduced_axle_Nm_per_deg = [2560.0, 2270.0]
matlab_semantics = "historical reduced effective axle roll-stiffness evidence only; not governing and not converted into or stacked with the blade-tip law"
simulink_stiffness_N_per_mm = [285.0, 309.0, 400.0, 724.0, 2628.0]
simulink_semantics = "comparison-only values from the same spreadsheet; do not average or substitute for SolidWorks FEA authority"
instron_stiffness_N_per_mm = [900.0, 980.0, 1320.0, 1970.0, 2630.0]
instron_semantics = "comparison-only values from the same spreadsheet; do not average or substitute for SolidWorks FEA authority"
comparison_rule = "MATLAB, Simulink, and Instron values are evidence for comparison/correlation only. They are not parallel springs and must not be combined with the governing SolidWorks blade stiffness."

[authority_boundaries]
zero_preload_authority = "reviewed design-intent statement under ASM-SUSP-0003; not installed metrology"
blade_constitutive_authority = "available only as the five discrete SolidWorks FEA linear blade-tip stiffness settings"
interpolation_authorized = false
z_bar_geometry_map_authorized = false
z_bar_geometry_map_status = "Not yet authorized or implemented: (q_L, q_R) -> delta_b and partial(delta_b)/partial(q_L,q_R)."
body_roll_substitution_allowed = false
track_width_approximation_allowed = false
wheel_rate_authority = false
stress_fatigue_authority = false
linkage_load_authority = false
installed_limits_authority = false
