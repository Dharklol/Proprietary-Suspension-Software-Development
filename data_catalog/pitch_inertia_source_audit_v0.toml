no_point_mass_at_cg_substitution = true
no_mass_times_wheelbase_squared_substitution = true

[telemetry]
requested_route = "Testing-day Box CSV or AiM Race Studio XRK only if needed"
used = false
reason = "Not needed for static equilibrium or local spring tangents. IMU response alone does not identify pitch inertia independently of unknown damping, road/force excitation, sensor pose and configuration."
preferred_follow_up = "Source mass-property export first; if unavailable, separately scoped identification with calibrated pitch-rate/acceleration, input excitation and synchronized channels. CSV preferred before investigating XRK decoding."

