[force_recovery]
deflection_coordinate = "For side i, n_i(theta_h) is the signed unit transverse direction used by the existing blade-arm coordinate d_i, and f_i=k_b*d_i is the already-authorized signed elastic force conjugate to d_i."
link_axis = "u_i=(P_i-B_i)/||P_i-B_i|| points from current blade tip B_i to current rocker pickup P_i."
axial_sign = "T_i>0 means linkage tension. Force on blade tip is +T_i*u_i; force on rocker is -T_i*u_i."
virtual_work_equilibrium = "T_i*(u_i dot n_i)=f_i, hence T_i=f_i/(u_i dot n_i)."
degeneracy = "Reject |u_i dot n_i| at or below the reviewed projection threshold; do not divide through a near-zero transverse projection or substitute generalized force."

[verification_identity]
rocker_torque = "For each side i, tau_i = rocker_axis dot ((P_i-R_i) cross F_rocker_i), where F_rocker_i=-T_i*u_i. This physical-link torque must reproduce the existing AUTH-SUSP-0008 generalized rocker torque Q_rocker_i=-dU/dtheta_Ri within the frozen numerical tolerance."
reason = "The housing angle is an ideal free energy-minimizing coordinate, so the envelope/virtual-work derivative with respect to a prescribed rocker angle is carried by the physical linkage force at that rocker pickup."

