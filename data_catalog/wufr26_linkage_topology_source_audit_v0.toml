[confirmed_topology]
items = [
  "The next WUFR statics layer must preserve separate upper and lower A-arm bodies/ownership rather than replacing the corner with six links attached directly to the upright.",
  "The front actuation load enters the upper A-arm at its source-defined attachment point; the rear actuation load enters the lower A-arm.",
  "The front tie rod and rear toe link remain separate lateral links with different kinematic ownership.",
  "Rocker/pushrod/spring/ARB reactions are downstream of the arm-mounted actuation path and must not be collapsed into an invented upright force.",
  "Brake and drive torque paths must be represented by an explicit external-wrench/interface contract rather than inferred from contact-patch force alone."
]

[unresolved_topology]
items = [
  "Explicit WUFR27 confirmation of which WUFR26 front/rear corner parts, joints, and actuation architecture are carried over versus redesigned.",
  "Endpoint-by-endpoint mapping of rod ends/spherical bearings/clevises/bolts and the first-model ideal joint type/axis at every A-arm, push/pull-rod, tie/toe-link, and rocker connection.",
  "Whether the two inboard A-arm joints may be reduced to one ideal revolute support about the frozen chassis hinge axis for interface-reaction statics; this is a modeling decision, not established by geometry points alone.",
  "Exact body ownership and joint idealization of each front pullrod tab/connector and rear pushrod tab/connector in the current hardware assembly.",
  "Exact brake rotor/caliper/upright/hub reaction contract for braking load cases and rear hub/CV/halfshaft torque contract for drive load cases.",
  "Exact rocker pivot support idealization and the point-force/reaction interface required to connect MOD-SUSP-0004 spring and MOD-SUSP-0005 ARB mechanics into structural statics.",
  "Required fidelity for A-arm outputs: net hinge/outboard reactions only versus individual chassis-tab/bearing forces versus tube axial/bending loads."
]

[candidate_architecture_not_authorized]
summary = "A promising first interface-level model is a multi-rigid-body equilibrium graph: upright/corner body + rigid UCA + rigid LCA + axial tie/toe link + axial push/pull rod + rigid rocker + chassis ground. Each A-arm would use its frozen inboard hinge line as an equivalent revolute support only after joint/source review. This can preserve arm-mounted actuation without pretending the welded wishbone is two independent axial links."
important_limit = "Even if an equivalent revolute A-arm support is accepted, rigid-body statics can at most provide the net hinge reaction/wrench. Unique forward-vs-aft chassis bearing/tab load sharing and welded tube axial/bending stress generally require an additional load-sharing or beam/FE stiffness model."
implementation_authorized = false

