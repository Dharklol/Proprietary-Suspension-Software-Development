[source.generic_mechanics]
reference = "John C. Dixon, The Shock Absorber Handbook, Second Edition, Section 7.4 Static Forces"
source_role = "generic mechanics and measurement-method authority only; not KW V5 numerical authority"
observations = [
  "At very low speed a pressurized damper can exhibit pressure-area force, pressure-rise stiffness with position, and Coulomb-like friction.",
  "For a slow bidirectional force loop, the mean of compression/extension creep forces identifies the gas-force bias under the stated symmetry assumptions, while half the difference identifies friction.",
  "Analytic gas-force prediction requires effective area and pressure; position dependence additionally requires gas volume/geometry and a thermodynamic assumption."
]

