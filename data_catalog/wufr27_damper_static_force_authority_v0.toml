[required_measurement_packet]
minimum_fields = [
  "damper item/serial identity and service history",
  "nitrogen charge/service state and whether pressure was changed before test",
  "damper body/reservoir temperature",
  "compression and rebound adjuster positions",
  "eye-to-eye position or shaft displacement with sign and zero reference",
  "very-low constant speed and dwell protocol",
  "force in both travel directions at the same positions",
  "load-cell zero, fixture tare, and uncertainty",
  "repeatability over at least three cycles after conditioning"
]
preferred_outputs = [
  "F_in(x) and F_out(x) quasi-static force curves",
  "F_G(x)=0.5*(F_in(x)+F_out(x)) where the loop assumptions are valid",
  "F_F(x)=0.5*(F_in(x)-F_out(x)) with direction/sign retained",
  "reviewed interpolation domain covering the installed operating region"
]

