name: Temporary apply carrier implementation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'phase-3-wufr-static-carrier-wrench-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed local implementation payload
        shell: bash
        run: |
          sha256sum .carrier_payload/chunk*
          cat .carrier_payload/chunk* > /tmp/carrier-implementation.b64
          base64 --decode /tmp/carrier-implementation.b64 > /tmp/carrier-implementation.tar.gz
          echo 'aff9e523eb1629091183f60fef6c2fdf9be7cee1b66b99d2c82d3a68b5755da0  /tmp/carrier-implementation.tar.gz' | sha256sum --check
          tar -xzf /tmp/carrier-implementation.tar.gz -C .
          rm -rf .carrier_payload
          rm -f .github/workflows/apply-carrier-implementation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement WUFR static carrier external wrenches'
          git push origin HEAD:phase-3-wufr-static-carrier-wrench-implementation
