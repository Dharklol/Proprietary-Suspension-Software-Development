name: WUFR static equilibrium isolated diagnostic

on:
  pull_request:

concurrency:
  group: wufr-static-equilibrium-isolated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Probe fine-step equilibrium refinement
        run: |
          python - <<'PY'
          from dataclasses import replace
          import json
          from scripts.run_wufr_static_equilibrium_benchmarks import _provider, _result_record
          from pssd_vehicle.wufr_static_equilibrium import solve_wufr_static_equilibrium

          provider = _provider()
          refined_config = replace(
              provider.quasi_static_config,
              residual_absolute_tolerance=1.0e-10,
              residual_relative_tolerance=1.0e-10,
              max_iterations=3,
              finite_difference_relative_step=0.002,
              finite_difference_min_step=1.0e-8,
              line_search_max_trials=12,
          )
          provider = replace(provider, quasi_static_config=refined_config)
          result = solve_wufr_static_equilibrium(
              provider,
              front_arb_setting=1,
              rear_arb_setting=1,
              initial_q_body=(-0.002680778331, -0.000080147145, 0.002694184074),
          )
          print(json.dumps(_result_record(result), indent=2, sort_keys=True))
          if not result.ok:
              raise SystemExit(1)
          PY
