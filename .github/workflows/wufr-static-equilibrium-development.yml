name: WUFR implementation source export

on:
  pull_request:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          git archive --format=zip --output=wufr-implementation-source.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: wufr-implementation-source
          path: wufr-implementation-source.zip
          if-no-files-found: error
