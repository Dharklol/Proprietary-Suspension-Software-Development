name: WUFR static equilibrium development

on:
  push:
    branches: [phase-2-wufr-static-equilibrium-implementation]

permissions:
  actions: write
  contents: read

concurrency:
  group: wufr-static-equilibrium-development
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded branch runs
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );
            for (const run of runs) {
              if (
                run.id !== context.runId &&
                run.head_branch === branch &&
                ['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status)
              ) {
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  core.info(`Cancelled superseded run ${run.id}: ${run.name}`);
                } catch (error) {
                  core.warning(`Could not cancel run ${run.id}: ${error.message}`);
                }
              }
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate source composition
        run: |
          python -m unittest tests.test_wufr_static_equilibrium_authorization -v
          python -m unittest tests.test_wufr_static_equilibrium -v
          python -m unittest tests.test_wufr_static_equilibrium_failures -v
      - name: Generate integrated benchmark
        run: |
          python scripts/run_wufr_static_equilibrium_benchmarks.py \
            --output wufr_static_equilibrium_report.json \
            --summary-output wufr_static_equilibrium_summary.json \
            --summary
      - name: Upload development report
        uses: actions/upload-artifact@v4
        with:
          name: wufr-static-equilibrium-development-report
          path: |
            wufr_static_equilibrium_report.json
            wufr_static_equilibrium_summary.json
          if-no-files-found: error
