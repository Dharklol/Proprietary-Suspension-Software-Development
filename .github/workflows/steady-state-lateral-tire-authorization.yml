name: Steady-state lateral tire authorization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate AUTH-TIRE-0001
        run: python -m unittest tests.test_steady_state_lateral_tire_authorization -v
