name: WUFR static equilibrium diagnostic

on:
  pull_request:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and run focused static-equilibrium test
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git clone --quiet --depth 1 --branch "$BRANCH" \
            https://github.com/${{ github.repository }}.git repo
          cd repo
          python3 -m pip install -q -e .
          python3 -m unittest \
            tests.test_wufr_static_equilibrium.WUFRStaticEquilibriumTests.test_setting_1_fixture_converges_with_positive_unmodified_reactions \
            -v
