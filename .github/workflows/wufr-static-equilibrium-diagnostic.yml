name: WUFR static equilibrium diagnostic

on:
  pull_request:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and run focused upstream test
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git clone --quiet --depth 1 --branch "$BRANCH" \
            https://github.com/${{ github.repository }}.git repo
          cd repo
          PYTHONPATH=src python3 -m unittest tests.test_wufr_road_contact -v
