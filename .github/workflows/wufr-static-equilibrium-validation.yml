name: WUFR static equilibrium validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify upstream road-contact import and implementation
        run: python -m unittest tests.test_wufr_road_contact -v
      - name: Validate authorization
        run: python -m unittest tests.test_wufr_static_equilibrium_authorization -v
      - name: Validate implementation
        run: |
          python -m unittest tests.test_wufr_static_equilibrium -v
          python -m unittest tests.test_wufr_static_equilibrium_failures -v
      - name: Generate report
        run: |
          python scripts/run_wufr_static_equilibrium_benchmarks.py \
            --output wufr_static_equilibrium_report.json
          python scripts/run_wufr_static_equilibrium_benchmarks.py \
            --summary \
            --output wufr_static_equilibrium_summary.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: wufr-static-equilibrium-reports
          path: |
            wufr_static_equilibrium_report.json
            wufr_static_equilibrium_summary.json
          if-no-files-found: error
