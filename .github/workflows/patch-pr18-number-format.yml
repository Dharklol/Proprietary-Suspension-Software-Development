name: Patch PR 18 number formatting

on:
  push:
    branches:
      - phase-0-solidworks-metadata-exporter

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: phase-0-solidworks-metadata-exporter
          fetch-depth: 0

      - name: Patch exporter and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          macro_path = Path("tools/solidworks/WUFR26_SolidWorks_Metadata_Exporter.bas")
          macro = macro_path.read_text(encoding="utf-8")
          macro = macro.replace("' Version 1.0.0", "' Version 1.0.1", 1)
          macro = macro.replace(
              'Private Const EXTRACTOR_VERSION As String = "1.0.0"',
              'Private Const EXTRACTOR_VERSION As String = "1.0.1"',
              1,
          )
          old_function = '''Private Function InvariantNumber(ByVal value As Double) As String
              Dim textValue As String
              textValue = Trim$(Str$(value))
              textValue = Replace$(textValue, ",", ".")
              If textValue = "-0" Then textValue = "0"
              InvariantNumber = textValue
          End Function'''
          new_function = '''Private Function InvariantNumber(ByVal value As Double) As String
              Dim textValue As String
              textValue = Trim$(Str$(value))
              textValue = Replace$(textValue, ",", ".")
              If Left$(textValue, 1) = "." Then textValue = "0" & textValue
              If Left$(textValue, 2) = "-." Then textValue = "-0" & Mid$(textValue, 2)
              If textValue = "-0" Then textValue = "0"
              InvariantNumber = textValue
          End Function'''
          if macro.count(old_function) != 1:
              raise SystemExit("InvariantNumber source block did not match exactly once")
          macro = macro.replace(old_function, new_function, 1)
          macro_path.write_text(macro, encoding="utf-8")

          test_path = Path("tests/test_solidworks_metadata_exporter.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              'Private Const EXTRACTOR_VERSION As String = "1.0.0"',
              'Private Const EXTRACTOR_VERSION As String = "1.0.1"',
              1,
          )
          insertion_point = "    def test_documentation_preserves_source_authority_boundary(self) -> None:\n"
          new_test = '''    def test_invariant_number_emits_strict_json_fraction_tokens(self) -> None:
              match = re.search(
                  r"Private Function InvariantNumber\\b.*?^End Function$",
                  self.source,
                  flags=re.MULTILINE | re.DOTALL,
              )
              self.assertIsNotNone(match)
              function_source = match.group(0)
              self.assertIn(
                  'If Left$(textValue, 1) = "." Then textValue = "0" & textValue',
                  function_source,
              )
              self.assertIn(
                  'If Left$(textValue, 2) = "-." Then textValue = "-0" & Mid$(textValue, 2)',
                  function_source,
              )

              vba_like_tokens = [".5", "-.5", "-0", "2.75"]
              normalized: list[str] = []
              for token in vba_like_tokens:
                  token = token.strip().replace(",", ".")
                  if token.startswith("."):
                      token = "0" + token
                  if token.startswith("-."):
                      token = "-0" + token[1:]
                  if token == "-0":
                      token = "0"
                  normalized.append(token)

              report = json.loads('{"values":[' + ",".join(normalized) + "]}")
              self.assertEqual([0.5, -0.5, 0, 2.75], report["values"])

'''
          if insertion_point not in tests:
              raise SystemExit("Test insertion point was not found")
          if "test_invariant_number_emits_strict_json_fraction_tokens" not in tests:
              tests = tests.replace(insertion_point, new_test + insertion_point, 1)
          test_path.write_text(tests, encoding="utf-8")

          doc_path = Path("docs/tools/solidworks_metadata_exporter.md")
          docs = doc_path.read_text(encoding="utf-8")
          output_marker = "- nonfatal extraction warnings.\n"
          output_note = (
              "- nonfatal extraction warnings;\n"
              "- locale-independent JSON numbers with a required leading zero for fractional values.\n"
          )
          if output_marker not in docs:
              raise SystemExit("Documentation insertion point was not found")
          docs = docs.replace(output_marker, output_note, 1)
          doc_path.write_text(docs, encoding="utf-8")
          PY

      - name: Run focused tests
        run: python -m unittest tests.test_solidworks_metadata_exporter

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-pr18-number-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/solidworks/WUFR26_SolidWorks_Metadata_Exporter.bas \
                  tests/test_solidworks_metadata_exporter.py \
                  docs/tools/solidworks_metadata_exporter.md \
                  .github/workflows/patch-pr18-number-format.yml
          git commit -m "Fix SOLIDWORKS JSON number formatting"
          git push origin HEAD:phase-0-solidworks-metadata-exporter
