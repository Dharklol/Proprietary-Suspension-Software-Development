name: Motion-aware vehicle/steering validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  motion-aware-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate whole-vehicle force-coordinate authorization
        run: python -m unittest tests.test_whole_vehicle_force_coordinate_authorization -v
      - name: Validate quasi-static equilibrium authorization
        run: python -m unittest tests.test_vehicle_quasi_static_authorization -v
      - name: Validate WUFR static gravity allocation authorization
        run: python -m unittest tests.test_wufr_static_gravity_authorization -v
      - name: Validate WUFR road contact map authorization
        run: python -m unittest tests.test_wufr_road_contact_authorization -v
      - name: Validate WUFR static carrier wrench authorization
        run: python -m unittest tests.test_wufr_static_carrier_wrench_authorization -v
      - name: Validate WUFR static carrier wrench implementation
        run: |
          python -m unittest tests.test_wufr_static_carrier_wrench -v
          python -m unittest tests.test_wufr_static_carrier_wrench_failures -v
          python -m unittest tests.test_wufr_static_carrier_wrench_result_record -v
      - name: Validate WUFR rigid-contact implementation
        run: |
          python -m unittest tests.test_wufr_road_contact -v
          python -m unittest tests.test_wufr_road_contact_result_record -v
      - name: Validate WUFR static gravity allocation implementation
        run: |
          python -m unittest tests.test_wufr_static_gravity -v
          python -m unittest tests.test_wufr_static_gravity_result_record -v
      - name: Validate quasi-static equilibrium implementation
        run: |
          python -m unittest tests.test_vehicle_quasi_static -v
          python -m unittest tests.test_vehicle_quasi_static_tangent_boundary -v
          python -m unittest tests.test_vehicle_quasi_static_result_record -v
      - name: Validate whole-vehicle force-coordinate implementation
        run: |
          python -m unittest tests.test_vehicle_force_coordinates -v
          python -m unittest tests.test_vehicle_force_coordinate_result_record -v
      - name: Generate whole-vehicle force-coordinate reports
        run: |
          python scripts/run_vehicle_force_coordinate_benchmarks.py \
            --output vehicle_force_coordinate_report.json > /dev/null
          python scripts/run_vehicle_force_coordinate_benchmarks.py \
            --summary \
            --output vehicle_force_coordinate_summary.json
      - name: Generate quasi-static equilibrium reports
        run: |
          python scripts/run_vehicle_quasi_static_benchmarks.py \
            --output vehicle_quasi_static_report.json > /dev/null
          python scripts/run_vehicle_quasi_static_benchmarks.py \
            --summary \
            --output vehicle_quasi_static_summary.json
      - name: Generate WUFR static gravity reports
        run: |
          python scripts/run_wufr_static_gravity_benchmarks.py \
            --output wufr_static_gravity_report.json > /dev/null
          python scripts/run_wufr_static_gravity_benchmarks.py \
            --summary \
            --output wufr_static_gravity_summary.json
      - name: Generate WUFR road-contact reports
        run: |
          python scripts/run_wufr_road_contact_benchmarks.py \
            --output wufr_road_contact_report.json > /dev/null
          python scripts/run_wufr_road_contact_benchmarks.py \
            --summary \
            --output wufr_road_contact_summary.json
      - name: Generate WUFR static carrier wrench reports
        run: |
          python scripts/run_wufr_static_carrier_wrench_benchmarks.py \
            --output wufr_static_carrier_wrench_report.json \
            --summary-output wufr_static_carrier_wrench_summary.toml \
            --summary
      - name: Generate planar slip-kinematics reports
        run: |
          python scripts/run_planar_slip_kinematics_benchmarks.py \
            --output planar_slip_kinematics_report.json > /dev/null
          python scripts/run_planar_slip_kinematics_benchmarks.py \
            --summary \
            --output planar_slip_kinematics_summary.json
      - name: Generate motion-aware steering target reports
        run: |
          python scripts/run_motion_aware_force_demand_benchmarks.py \
            --output motion_aware_force_demand_report.json > /dev/null
          python scripts/run_motion_aware_force_demand_benchmarks.py \
            --summary \
            --output motion_aware_force_demand_summary.json
      - name: Verify steady-cornering development kernel and generate synthetic reports
        run: |
          python scripts/run_steady_cornering_development_benchmarks.py \
            --output steady_cornering_development_report.json
      - name: Upload motion-aware benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: motion-aware-vehicle-steering-reports
          path: |
            steady_cornering_development_report.json
            vehicle_force_coordinate_report.json
            vehicle_force_coordinate_summary.json
            vehicle_quasi_static_report.json
            vehicle_quasi_static_summary.json
            wufr_static_gravity_report.json
            wufr_static_gravity_summary.json
            wufr_road_contact_report.json
            wufr_road_contact_summary.json
            wufr_static_carrier_wrench_report.json
            wufr_static_carrier_wrench_summary.toml
            planar_slip_kinematics_report.json
            planar_slip_kinematics_summary.json
            motion_aware_force_demand_report.json
            motion_aware_force_demand_summary.json
          if-no-files-found: error
      - name: Verify native WUFR development composition and both-turn fixtures
        run: |
          python scripts/run_wufr_steady_cornering_benchmarks.py \
            --output wufr_steady_cornering_development_report.json
      - name: Upload native WUFR development report
        uses: actions/upload-artifact@v4
        with:
          name: wufr-steady-cornering-development-report
          path: |
            wufr_steady_cornering_development_report.json
          if-no-files-found: error
      - name: Verify synchronized native maneuver exports
        run: |
          python scripts/run_wufr_synced_cornering_export.py \
            --output native_synced_cornering_export.json \
            --summary-output native_synced_cornering_export_summary.json
      - name: Upload synchronized native maneuver evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-synced-cornering-export
          path: |
            native_synced_cornering_export.json
            native_synced_cornering_export_summary.json
          if-no-files-found: error
      - name: Verify varying-state native steering evidence
        run: |
          python scripts/run_varying_state_steering_evidence.py \
            --output varying_state_steering_evidence.json \
            --summary-output varying_state_steering_evidence_summary.json
      - name: Audit straight-state tire force sources and independent balance
        run: |
          python -m unittest tests.test_straight_state_tire_audit -v
          python scripts/run_straight_state_tire_audit.py \
            --output straight_state_tire_audit.json \
            --summary-output straight_state_tire_audit_summary.json
      - name: Upload straight-state tire audit
        uses: actions/upload-artifact@v4
        with:
          name: straight-state-tire-audit
          path: |
            straight_state_tire_audit.json
            straight_state_tire_audit_summary.json
          if-no-files-found: error
      - name: Verify manufactured analytical low-force references
        run: |
          python -m unittest tests.test_low_force_reference -v
          python scripts/run_low_force_reference_benchmarks.py \
            --output low_force_reference_report.json \
            --summary-output low_force_reference_summary.json
      - name: Upload analytical low-force reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: analytical-low-force-reference
          path: |
            low_force_reference_report.json
            low_force_reference_summary.json
          if-no-files-found: error
      - name: Upload varying-state native steering evidence
        uses: actions/upload-artifact@v4
        with:
          name: varying-state-native-steering-evidence
          path: |
            varying_state_steering_evidence.json
            varying_state_steering_evidence_summary.json
          if-no-files-found: error

  native-computational-envelope:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        direction: [-1, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify envelope orchestration and packaging
        run: python -m unittest tests.test_native_computational_envelope tests.test_native_envelope_bound_control -v
      - name: Map native signed computational envelope
        run: |
          python scripts/run_native_computational_envelope.py \
            --directions ${{ matrix.direction }} \
            --curvatures .02 .06 .10 .14 \
            --refinement-steps 3 --curvature-resolution .001 \
            --output native_envelope_${{ matrix.direction }}.json \
            --summary-output native_envelope_${{ matrix.direction }}_summary.json
      - name: Check the separate numerical sideslip-bound control
        run: |
          python scripts/run_native_envelope_bound_control.py \
            --report native_envelope_${{ matrix.direction }}.json \
            --sideslip-bound .10 \
            --output native_envelope_bound_control_${{ matrix.direction }}.json
      - name: Upload native branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-computational-envelope-${{ matrix.direction }}
          path: |
            native_envelope_${{ matrix.direction }}.json
            native_envelope_${{ matrix.direction }}_summary.json
            native_envelope_bound_control_${{ matrix.direction }}.json
          if-no-files-found: error
  native-computational-envelope-package:
    needs: native-computational-envelope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-computational-envelope-*
          merge-multiple: true
      - name: Validate and package both signed branches
        run: |
          python scripts/package_native_computational_envelope.py \
            --reports native_envelope_-1.json native_envelope_1.json \
            --bound-controls native_envelope_bound_control_-1.json native_envelope_bound_control_1.json \
            --output native_envelope_combined_summary.json \
            --compact-output native_envelope_compact_summary.json
      - name: Upload combined computational envelope
        uses: actions/upload-artifact@v4
        with:
          name: native-computational-envelope-combined
          path: |
            native_envelope_combined_summary.json
            native_envelope_compact_summary.json
          if-no-files-found: error

  native-sensitivity-study:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        direction: [-1, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify study, recovery and packaging controls
        run: |
          python -m unittest tests.test_native_sensitivity_study \
            tests.test_native_numerical_recovery tests.test_native_sensitivity_package -v
      - name: Re-equilibrate physical and numerical sensitivity cases
        run: |
          python scripts/run_native_sensitivity_study.py \
            --seed-report benchmarks/vehicle/native_computational_envelope_summary_v0.1.0.json \
            --controls benchmarks/vehicle/native_sensitivity_controls_v0.1.0.toml \
            --directions ${{ matrix.direction }} \
            --output native_sensitivity_${{ matrix.direction }}.json \
            --summary-output native_sensitivity_${{ matrix.direction }}_summary.json
      - name: Recover from a common off-root seed
        run: |
          python scripts/run_native_numerical_recovery.py \
            --study native_sensitivity_${{ matrix.direction }}.json \
            --controls benchmarks/vehicle/native_numerical_recovery_controls_v0.1.0.toml \
            --output native_numerical_recovery_${{ matrix.direction }}.json \
            --summary-output native_numerical_recovery_${{ matrix.direction }}_summary.json
      - name: Upload signed sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sensitivity-${{ matrix.direction }}
          path: |
            native_sensitivity_${{ matrix.direction }}.json
            native_sensitivity_${{ matrix.direction }}_summary.json
            native_numerical_recovery_${{ matrix.direction }}.json
            native_numerical_recovery_${{ matrix.direction }}_summary.json
          if-no-files-found: error
  native-sensitivity-package:
    needs: native-sensitivity-study
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: native-sensitivity-*
          merge-multiple: true
      - name: Validate and combine signed sensitivity evidence
        run: |
          python scripts/package_native_sensitivity_study.py \
            --studies native_sensitivity_-1.json native_sensitivity_1.json \
            --recoveries native_numerical_recovery_-1.json native_numerical_recovery_1.json \
            --output native_sensitivity_combined.json \
            --summary-output native_sensitivity_combined_summary.json
      - name: Upload combined sensitivity report
        uses: actions/upload-artifact@v4
        with:
          name: native-sensitivity-combined
          path: |
            native_sensitivity_combined.json
            native_sensitivity_combined_summary.json
          if-no-files-found: error
