name: WUFR static rocker included-load authorization

on:
  pull_request:
  push:
    branches: [main]

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate AUTH-SUSP-0018
        run: python -m unittest tests.test_wufr_static_rocker_included_loads_authorization -v
