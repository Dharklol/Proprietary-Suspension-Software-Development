name: Patch WUFR road-contact derivative scale

on:
  push:
    branches: [phase-2-wufr-rigid-contact-implementation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-wufr-rigid-contact-implementation
      - name: Move finite differences above inversion noise floor
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/pssd_vehicle/wufr_road_contact.py")
          text = source.read_text(encoding="utf-8")
          replacements = {
              "    wheel_fd_step_m: float = 2.0e-5\n": "    wheel_fd_step_m: float = 2.0e-4\n",
              "            q_L_tolerance_rad=2.0e-14,\n            displacement_tolerance_m=1.0e-14,\n": "            q_L_tolerance_rad=2.0e-12,\n            displacement_tolerance_m=1.0e-12,\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one source block: {old!r}; found {text.count(old)}")
              text = text.replace(old, new)
          source.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_wufr_road_contact.py")
          test = test_path.read_text(encoding="utf-8")
          old = "        h = 7.5e-6\n"
          new = "        h = 7.5e-5\n"
          if test.count(old) != 1:
              raise SystemExit(f"expected independent derivative step once; found {test.count(old)}")
          test_path.write_text(test.replace(old, new), encoding="utf-8")
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-wufr-road-contact-fd-scale.yml
          git add src/pssd_vehicle/wufr_road_contact.py tests/test_wufr_road_contact.py
          git commit -m "Set road-contact finite differences above inversion noise floor"
          git push origin HEAD:phase-2-wufr-rigid-contact-implementation
