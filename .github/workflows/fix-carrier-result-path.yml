name: Temporary fix carrier result path

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'phase-3-wufr-static-carrier-wrench-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Normalize frozen upstream path and regenerate records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_wufr_static_carrier_wrench_benchmarks.py')
          text = path.read_text(encoding='utf-8')
          old = '            "result_path": provider.accepted_result.source_path,'
          new = '            "result_path": Path(provider.accepted_result.source_path).resolve().relative_to(ROOT.resolve()).as_posix(),'
          if text.count(old) != 1:
              raise SystemExit(f'expected one replace target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          PYTHONPATH=src python scripts/run_wufr_static_carrier_wrench_benchmarks.py \
            --output benchmarks/vehicle/wufr_static_carrier_wrench_result_v0.1.0.json \
            --summary-output benchmarks/vehicle/wufr_static_carrier_wrench_result_v0.1.0.toml \
            --summary
          PYTHONPATH=src python -m unittest tests.test_wufr_static_carrier_wrench_result_record -v
          grep -F '"result_path": "benchmarks/vehicle/wufr_static_equilibrium_result_v0.2.0.json"' \
            benchmarks/vehicle/wufr_static_carrier_wrench_result_v0.1.0.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_wufr_static_carrier_wrench_benchmarks.py \
            benchmarks/vehicle/wufr_static_carrier_wrench_result_v0.1.0.json \
            benchmarks/vehicle/wufr_static_carrier_wrench_result_v0.1.0.toml
          git diff --cached --check
          git commit -m 'Normalize frozen carrier result provenance path'
          git push origin HEAD:phase-3-wufr-static-carrier-wrench-implementation
