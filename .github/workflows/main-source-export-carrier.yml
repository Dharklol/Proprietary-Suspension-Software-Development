name: Temporary main source export for carrier implementation

on:
  pull_request:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output=main-source-export-carrier.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: main-source-export-carrier
          path: main-source-export-carrier.zip
          if-no-files-found: error
