name: Suspension kinematics validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suspension-kinematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate linkage statics authorization
        run: python -m unittest tests.test_suspension_linkage_statics_authorization -v > linkage_statics_authorization_test.log 2>&1
      - name: Upload linkage statics authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkage-statics-authorization-test-log
          path: linkage_statics_authorization_test.log
          if-no-files-found: error
      - name: Validate linkage statics implementation
        run: |
          set -e
          {
            python -m unittest tests.test_suspension_linkage_statics -v
            python -m unittest tests.test_suspension_linkage_statics_failures -v
            python -m unittest tests.test_suspension_linkage_statics_result_record -v
          } > linkage_statics_implementation_test.log 2>&1
      - name: Upload linkage statics implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkage-statics-implementation-test-log
          path: linkage_statics_implementation_test.log
          if-no-files-found: error
      - name: Validate WUFR linkage topology audit hold
        run: python -m unittest tests.test_suspension_wufr_linkage_topology_audit -v > wufr_linkage_topology_audit_test.log 2>&1
      - name: Upload WUFR linkage topology audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-linkage-topology-audit-test-log
          path: wufr_linkage_topology_audit_test.log
          if-no-files-found: error
      - name: Validate WUFR Level-1 interface statics authorization
        run: python -m unittest tests.test_wufr_interface_statics_authorization -v > wufr_interface_statics_authorization_test.log 2>&1
      - name: Upload WUFR Level-1 authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-interface-statics-authorization-test-log
          path: wufr_interface_statics_authorization_test.log
          if-no-files-found: error
      - name: Validate WUFR Level-1 interface statics implementation
        run: |
          set -e
          {
            python -m unittest tests.test_wufr_interface_statics -v
            python -m unittest tests.test_wufr_interface_statics_failures -v
            python -m unittest tests.test_wufr_interface_adapter -v
            python -m unittest tests.test_wufr_interface_statics_result_record -v
          } > wufr_interface_statics_implementation_test.log 2>&1
      - name: Upload WUFR Level-1 implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-interface-statics-implementation-test-log
          path: wufr_interface_statics_implementation_test.log
          if-no-files-found: error
      - name: Validate WUFR static four-corner Level-1 load authorization
        run: python -m unittest tests.test_wufr_static_level1_interface_loads_authorization -v > wufr_static_level1_interface_loads_authorization_test.log 2>&1
      - name: Upload WUFR static four-corner Level-1 authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-static-level1-interface-loads-authorization-test-log
          path: wufr_static_level1_interface_loads_authorization_test.log
          if-no-files-found: error
      - name: Validate anti-roll-bar authorization
        run: python -m unittest tests.test_suspension_anti_roll_bar_authorization -v > anti_roll_bar_authorization_test.log 2>&1
      - name: Upload anti-roll-bar authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-roll-bar-authorization-test-log
          path: anti_roll_bar_authorization_test.log
          if-no-files-found: error
      - name: Validate WUFR Z-bar map authorization
        run: python -m unittest tests.test_suspension_wufr_zbar_map_authorization -v > wufr_zbar_map_authorization_test.log 2>&1
      - name: Upload WUFR Z-bar map authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-zbar-map-authorization-test-log
          path: wufr_zbar_map_authorization_test.log
          if-no-files-found: error
      - name: Validate WUFR Z-bar implementation authorization
        run: python -m unittest tests.test_suspension_wufr_zbar_implementation_authorization -v > wufr_zbar_implementation_authorization_test.log 2>&1
      - name: Upload WUFR Z-bar implementation authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-zbar-implementation-authorization-test-log
          path: wufr_zbar_implementation_authorization_test.log
          if-no-files-found: error
      - name: Validate WUFR Z-bar implementation
        run: python -m unittest tests.test_suspension_wufr_zbar_implementation -v > wufr_zbar_implementation_test.log 2>&1
      - name: Upload WUFR Z-bar implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-zbar-implementation-test-log
          path: wufr_zbar_implementation_test.log
          if-no-files-found: error
      - name: Validate physical WUFR Z-bar linkage-force authorization
        run: python -m unittest tests.test_suspension_wufr_zbar_link_force_authorization -v > wufr_zbar_link_force_authorization_test.log 2>&1
      - name: Upload physical WUFR Z-bar linkage-force authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-zbar-link-force-authorization-test-log
          path: wufr_zbar_link_force_authorization_test.log
          if-no-files-found: error
      - name: Validate physical WUFR Z-bar linkage-force implementation
        run: python -m unittest tests.test_suspension_wufr_zbar_link_force -v > wufr_zbar_link_force_test.log 2>&1
      - name: Upload physical WUFR Z-bar linkage-force implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-zbar-link-force-test-log
          path: wufr_zbar_link_force_test.log
          if-no-files-found: error
      - name: Validate WUFR Z-bar wheel-coordinate authorization
        run: python -m unittest tests.test_suspension_wufr_zbar_wheel_authorization -v > wufr_zbar_wheel_authorization_test.log 2>&1
      - name: Upload WUFR Z-bar wheel-coordinate authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-zbar-wheel-authorization-test-log
          path: wufr_zbar_wheel_authorization_test.log
          if-no-files-found: error
      - name: Validate WUFR Z-bar wheel-coordinate implementation
        run: python -m unittest tests.test_suspension_wufr_zbar_wheel -v > wufr_zbar_wheel_test.log 2>&1
      - name: Upload WUFR Z-bar wheel-coordinate implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wufr-zbar-wheel-test-log
          path: wufr_zbar_wheel_test.log
          if-no-files-found: error
      - name: Validate anti-roll-bar implementation
        run: |
          set -e
          {
            python -m unittest tests.test_suspension_anti_roll_bar -v
            python -m unittest tests.test_suspension_anti_roll_bar_result_record -v
          } > anti_roll_bar_implementation_test.log 2>&1
      - name: Upload anti-roll-bar implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-roll-bar-implementation-test-log
          path: anti_roll_bar_implementation_test.log
          if-no-files-found: error
      - name: Validate spring force authorization
        run: python -m unittest tests.test_suspension_spring_force_authorization -v > spring_force_authorization_test.log 2>&1
      - name: Upload spring authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-force-authorization-test-log
          path: spring_force_authorization_test.log
          if-no-files-found: error
      - name: Validate spring force implementation
        run: |
          set -e
          {
            python -m unittest tests.test_suspension_spring_force -v
            python -m unittest tests.test_suspension_spring_force_result_record -v
            python -m unittest tests.test_suspension_spring_force_integration -v
          } > spring_force_implementation_test.log 2>&1
      - name: Upload spring implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-force-implementation-test-log
          path: spring_force_implementation_test.log
          if-no-files-found: error
      - name: Run existing focused suspension kinematics tests
        run: |
          set -e
          {
            python -m unittest tests.test_suspension_kinematics -v
            python -m unittest tests.test_wheel_reference_authorization -v
            python -m unittest tests.test_wheel_reference_state_adapter -v
            python -m unittest tests.test_suspension_actuation_authorization -v
            python -m unittest tests.test_suspension_actuation -v
            python -m unittest tests.test_suspension_actuation_source_recovery -v
          } > existing_suspension_tests.log 2>&1
      - name: Upload existing suspension test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-suspension-test-log
          path: existing_suspension_tests.log
          if-no-files-found: error
      - name: Generate suspension kinematics reports
        run: |
          python scripts/run_suspension_kinematics_benchmarks.py --output suspension_kinematics_report.json > /dev/null
          python scripts/run_suspension_kinematics_benchmarks.py --summary --output suspension_kinematics_summary.json
          python scripts/run_wheel_reference_benchmarks.py --output wheel_reference_report.json > /dev/null
          python scripts/run_wheel_reference_benchmarks.py --summary --output wheel_reference_summary.json
          python scripts/run_suspension_actuation_benchmarks.py --output suspension_actuation_report.json > /dev/null
          python scripts/run_suspension_actuation_benchmarks.py --summary --output suspension_actuation_summary.json
          python scripts/run_suspension_spring_force_benchmarks.py --output suspension_spring_force_report.json > /dev/null
          python scripts/run_suspension_spring_force_benchmarks.py --summary --output suspension_spring_force_summary.json
          python scripts/run_suspension_anti_roll_bar_benchmarks.py --output suspension_anti_roll_bar_report.json > /dev/null
          python scripts/run_suspension_anti_roll_bar_benchmarks.py --summary --output suspension_anti_roll_bar_summary.json
          python scripts/run_suspension_linkage_statics_benchmarks.py --output suspension_linkage_statics_report.json > /dev/null
          python scripts/run_suspension_linkage_statics_benchmarks.py --summary --output suspension_linkage_statics_summary.json
          python scripts/run_wufr_interface_statics_benchmarks.py --output wufr_interface_statics_report.json > /dev/null
          python scripts/run_wufr_interface_statics_benchmarks.py --summary --output wufr_interface_statics_summary.json
          python scripts/run_wufr_zbar_link_force_benchmarks.py --output wufr_zbar_link_force_report.json > /dev/null
          python scripts/run_wufr_zbar_link_force_benchmarks.py --summary --output wufr_zbar_link_force_summary.json
      - name: Upload suspension kinematics reports
        uses: actions/upload-artifact@v4
        with:
          name: suspension-kinematics-reports
          path: |
            suspension_kinematics_report.json
            suspension_kinematics_summary.json
            wheel_reference_report.json
            wheel_reference_summary.json
            suspension_actuation_report.json
            suspension_actuation_summary.json
            suspension_spring_force_report.json
            suspension_spring_force_summary.json
            suspension_anti_roll_bar_report.json
            suspension_anti_roll_bar_summary.json
            suspension_linkage_statics_report.json
            suspension_linkage_statics_summary.json
            wufr_interface_statics_report.json
            wufr_interface_statics_summary.json
            wufr_zbar_link_force_report.json
            wufr_zbar_link_force_summary.json
          if-no-files-found: error
