name: Suspension kinematics validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actuation-source-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rear source-state recovery regression
        run: python -m unittest tests.test_suspension_actuation_source_recovery -v

  suspension-kinematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run focused suspension kinematics tests
        run: |
          python -m unittest tests.test_suspension_kinematics -v
          python -m unittest tests.test_wheel_reference_authorization -v
          python -m unittest tests.test_wheel_reference_state_adapter -v
          python -m unittest tests.test_suspension_actuation_authorization -v
          python -m unittest tests.test_suspension_actuation -v
          python -m unittest tests.test_suspension_actuation_source_recovery -v
      - name: Generate suspension kinematics reports
        run: |
          python scripts/run_suspension_kinematics_benchmarks.py \
            --output suspension_kinematics_report.json > /dev/null
          python scripts/run_suspension_kinematics_benchmarks.py \
            --summary \
            --output suspension_kinematics_summary.json
          python scripts/run_wheel_reference_benchmarks.py \
            --output wheel_reference_report.json > /dev/null
          python scripts/run_wheel_reference_benchmarks.py \
            --summary \
            --output wheel_reference_summary.json
          python scripts/run_suspension_actuation_benchmarks.py \
            --output suspension_actuation_report.json > /dev/null
          python scripts/run_suspension_actuation_benchmarks.py \
            --summary \
            --output suspension_actuation_summary.json
      - name: Upload suspension kinematics reports
        uses: actions/upload-artifact@v4
        with:
          name: suspension-kinematics-reports
          path: |
            suspension_kinematics_report.json
            suspension_kinematics_summary.json
            wheel_reference_report.json
            wheel_reference_summary.json
            suspension_actuation_report.json
            suspension_actuation_summary.json
          if-no-files-found: error
