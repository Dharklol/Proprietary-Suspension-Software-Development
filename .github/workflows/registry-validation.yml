name: Registry validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest-results.txt
      - name: Upload unittest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-results
          path: unittest-results.txt
          if-no-files-found: error
      - name: Generate WUFR-26 Level E reports
        run: |
          python scripts/run_wufr26_level_e_prep.py \
            --output wufr26_level_e_report.json > /dev/null
          python scripts/run_wufr26_level_e_prep.py \
            --summary \
            --output wufr26_level_e_summary.json
      - name: Upload WUFR-26 Level E reports
        uses: actions/upload-artifact@v4
        with:
          name: wufr26-level-e-reports
          path: |
            wufr26_level_e_report.json
            wufr26_level_e_summary.json
          if-no-files-found: error
      - name: Generate steering nominal optimizer reports
        run: |
          python scripts/run_steering_nominal_optimizer_benchmarks.py \
            --output steering_nominal_optimizer_report.json > /dev/null
          python scripts/run_steering_nominal_optimizer_benchmarks.py \
            --summary \
            --output steering_nominal_optimizer_summary.json
      - name: Upload steering nominal optimizer reports
        uses: actions/upload-artifact@v4
        with:
          name: steering-nominal-optimizer-reports
          path: |
            steering_nominal_optimizer_report.json
            steering_nominal_optimizer_summary.json
          if-no-files-found: error
