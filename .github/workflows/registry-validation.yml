name: Registry validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest-results.txt
      - name: Upload unittest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-results
          path: unittest-results.txt
          if-no-files-found: error
      - name: Generate WUFR-26 Level E reports
        run: |
          python scripts/run_wufr26_level_e_prep.py \
            --output wufr26_level_e_report.json > /dev/null
          python scripts/run_wufr26_level_e_prep.py \
            --summary \
            --output wufr26_level_e_summary.json
      - name: Upload WUFR-26 Level E reports
        uses: actions/upload-artifact@v4
        with:
          name: wufr26-level-e-reports
          path: |
            wufr26_level_e_report.json
            wufr26_level_e_summary.json
          if-no-files-found: error
      - name: Generate steering nominal optimizer reports
        run: |
          python scripts/run_steering_nominal_optimizer_benchmarks.py \
            --output steering_nominal_optimizer_report.json > /dev/null
          python scripts/run_steering_nominal_optimizer_benchmarks.py \
            --summary \
            --output steering_nominal_optimizer_summary.json
      - name: Upload steering nominal optimizer reports
        uses: actions/upload-artifact@v4
        with:
          name: steering-nominal-optimizer-reports
          path: |
            steering_nominal_optimizer_report.json
            steering_nominal_optimizer_summary.json
          if-no-files-found: error
      - name: Generate steering constraint and sensitivity reports
        run: |
          python scripts/run_steering_constraint_sensitivity_benchmarks.py \
            --output steering_constraint_sensitivity_report.json > /dev/null
          python scripts/run_steering_constraint_sensitivity_benchmarks.py \
            --summary \
            --output steering_constraint_sensitivity_summary.json
      - name: Upload steering constraint and sensitivity reports
        uses: actions/upload-artifact@v4
        with:
          name: steering-constraint-sensitivity-reports
          path: |
            steering_constraint_sensitivity_report.json
            steering_constraint_sensitivity_summary.json
          if-no-files-found: error
      - name: Generate steering suspension-pose reports
        run: |
          python scripts/run_steering_pose_provider_benchmarks.py \
            --output steering_pose_provider_report.json > /dev/null
          python scripts/run_steering_pose_provider_benchmarks.py \
            --summary \
            --output steering_pose_provider_summary.json
      - name: Upload steering suspension-pose reports
        uses: actions/upload-artifact@v4
        with:
          name: steering-suspension-pose-reports
          path: |
            steering_pose_provider_report.json
            steering_pose_provider_summary.json
          if-no-files-found: error
      - name: Generate steering operating-state target reports
        run: |
          python scripts/run_steering_operating_state_benchmarks.py \
            --output steering_operating_state_report.json > /dev/null
          python scripts/run_steering_operating_state_benchmarks.py \
            --summary \
            --output steering_operating_state_summary.json
      - name: Upload steering operating-state target reports
        uses: actions/upload-artifact@v4
        with:
          name: steering-operating-state-target-reports
          path: |
            steering_operating_state_report.json
            steering_operating_state_summary.json
          if-no-files-found: error
      - name: Generate steering external-pose adapter reports
        run: |
          python scripts/run_steering_external_pose_adapter_benchmarks.py \
            --output steering_external_pose_adapter_report.json > /dev/null
          python scripts/run_steering_external_pose_adapter_benchmarks.py \
            --summary \
            --output steering_external_pose_adapter_summary.json
      - name: Upload steering external-pose adapter reports
        uses: actions/upload-artifact@v4
        with:
          name: steering-external-pose-adapter-reports
          path: |
            steering_external_pose_adapter_report.json
            steering_external_pose_adapter_summary.json
          if-no-files-found: error
      - name: Generate steering state-metric objective reports
        run: |
          python scripts/run_steering_state_metric_benchmarks.py \
            --output steering_state_metric_report.json > /dev/null
          python scripts/run_steering_state_metric_benchmarks.py \
            --summary \
            --output steering_state_metric_summary.json
      - name: Upload steering state-metric objective reports
        uses: actions/upload-artifact@v4
        with:
          name: steering-state-metric-objective-reports
          path: |
            steering_state_metric_report.json
            steering_state_metric_summary.json
          if-no-files-found: error
      - name: Generate steering tire-informed target reports
        run: |
          python scripts/run_steering_tire_target_benchmarks.py \
            --output steering_tire_target_report.json > /dev/null
          python scripts/run_steering_tire_target_benchmarks.py \
            --summary \
            --output steering_tire_target_summary.json
      - name: Upload steering tire-informed target reports
        uses: actions/upload-artifact@v4
        with:
          name: steering-tire-informed-target-reports
          path: |
            steering_tire_target_report.json
            steering_tire_target_summary.json
          if-no-files-found: error
      - name: Generate vehicle operating-state reports
        run: |
          python scripts/run_vehicle_operating_state_benchmarks.py \
            --output vehicle_operating_state_report.json > /dev/null
          python scripts/run_vehicle_operating_state_benchmarks.py \
            --summary \
            --output vehicle_operating_state_summary.json
      - name: Upload vehicle operating-state reports
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-operating-state-reports
          path: |
            vehicle_operating_state_report.json
            vehicle_operating_state_summary.json
          if-no-files-found: error
