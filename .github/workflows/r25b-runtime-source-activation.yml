name: R25B runtime source activation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run R25B tests
        run: |
          python -m unittest \
            tests.test_r25b_runtime_source_activation_preflight \
            tests.test_r25b_runtime_source_audit \
            tests.test_r25b_generator_provenance \
            tests.test_r25b_complete_signed_source_native \
            tests.test_r25b_runtime_provider \
            tests.test_r25b_branch_classification_audit \
            tests.test_r25b_branch_classification_authorization \
            tests.test_r25b_force_demand_adapter \
            tests.test_r25b_steering_target_input_readiness \
            -v
      - name: Verify R25B coverage
        run: |
          python - <<'PY'
          from pssd_tire.r25b_branch_classification import CENTRAL_TRANSITION
          from pssd_tire.r25b_force_demand_adapter import (
              INSIDE_REFERENCE_POINT,
              OUTSIDE_REFERENCE_POINT,
              load_r25b_reference_force_demand_branch_set,
          )
          from pssd_tire.r25b_named_runtime import load_r25b_classified_lateral_table
          table = load_r25b_classified_lateral_table()
          assert len(table.curves) == 60
          assert sum(len(curve.slip_angle_rad) for curve in table.curves) == 9630
          assert all(
              curve.segment_branch_ids.count(CENTRAL_TRANSITION) == 1
              for curve in table.curves
          )
          branches = load_r25b_reference_force_demand_branch_set(table)
          assert len(branches.branch_for(INSIDE_REFERENCE_POINT).samples) == 64
          assert len(branches.branch_for(OUTSIDE_REFERENCE_POINT).samples) == 86
          assert all(branch.minimum_force_magnitude_n > 0.0 for branch in branches.branches)
          PY
