name: Steady-state lateral tire implementation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run MOD-TIRE-0001 tests
        run: |
          python -m unittest \
            tests.test_steady_state_lateral_tire \
            tests.test_steady_state_lateral_tire_failures \
            tests.test_steady_state_lateral_tire_result_record \
            -v
      - name: Regenerate frozen benchmark records
        run: python scripts/run_steady_state_lateral_tire_benchmarks.py --write
      - name: Verify byte-stable benchmark records
        run: |
          git diff --exit-code -- \
            benchmarks/tires/steady_state_lateral_tire_result_v0.1.0.json \
            benchmarks/tires/steady_state_lateral_tire_result_v0.1.0.toml
