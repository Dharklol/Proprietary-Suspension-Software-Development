name: Patch WUFR road-contact inversion precision v2

on:
  push:
    branches: [phase-2-wufr-rigid-contact-implementation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-wufr-rigid-contact-implementation
      - name: Tighten outer wheel-coordinate inversion below gravity benchmark floor
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/pssd_vehicle/wufr_road_contact.py")
          text = path.read_text(encoding="utf-8")
          old = '''            q_L_tolerance_rad=2.0e-12,\n            displacement_tolerance_m=1.0e-12,\n'''
          new = '''            q_L_tolerance_rad=2.0e-14,\n            displacement_tolerance_m=1.0e-14,\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one tightened physical-state tolerance block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-wufr-road-contact-inversion-v2.yml
          git add src/pssd_vehicle/wufr_road_contact.py
          git commit -m "Resolve gravity virtual-work precision floor"
          git push origin HEAD:phase-2-wufr-rigid-contact-implementation
