name: Reduced ride verification
on: [push, pull_request]
jobs:
  manufactured:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python scripts/run_reduced_ride_verification.py
      - run: python scripts/run_ride_parameter_study.py
      - run: python scripts/run_half_car_verification.py
      - run: python -m unittest discover -s tests -p test_no_driver_pitch_reconstruction.py
      - run: python scripts/run_no_driver_pitch_study.py
      - run: python scripts/run_no_driver_mass_consistency.py
      - run: python scripts/run_equilibrium_local_stiffness.py
      - uses: actions/upload-artifact@v4
        with:
          name: reduced-ride-${{ matrix.python }}
          path: |
            docs/reports/reduced_ride_verification_v0.1.0/
            docs/reports/ride_parameter_study_v0.1.0/
            docs/reports/half_car_verification_v0.1.0/
            docs/reports/no_driver_pitch_study_v0.1.0/
            docs/reports/no_driver_mass_consistency_v0.1.0/
            docs/reports/equilibrium_local_stiffness_v0.1.0/
