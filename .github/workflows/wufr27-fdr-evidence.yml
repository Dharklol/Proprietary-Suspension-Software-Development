name: WUFR-27 FDR nominal steering evidence

on:
  pull_request:
    paths:
      - "src/pssd_steering/**"
      - "configurations/steering/**"
      - "scripts/run_wufr27_design_compliance_benchmarks.py"
      - "scripts/render_wufr27_fdr_evidence.py"
      - ".github/workflows/wufr27-fdr-evidence.yml"
      - "docs/models/steering/wufr27_fdr_definition_freeze_v0.md"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install steering package and optional plotting dependencies
        run: python -m pip install -e ".[viz]"
      - name: Test source-to-figure design-input contract
        run: python -m unittest discover -s tests -p "test_wufr27_design_compliance*.py"
      - name: Regenerate canonical WUFR-27 nominal comparison JSON
        run: |
          mkdir -p fdr_wufr27_evidence
          python scripts/run_wufr27_design_compliance_benchmarks.py > fdr_wufr27_evidence/wufr27_nominal_design_source_compliance.json
      - name: Render source-labeled figures and immutable evidence manifest
        run: |
          python scripts/render_wufr27_fdr_evidence.py \
            --report fdr_wufr27_evidence/wufr27_nominal_design_source_compliance.json \
            --outdir fdr_wufr27_evidence
      - name: Upload FDR design-source evidence packet
        uses: actions/upload-artifact@v4
        with:
          name: wufr27-fdr-nominal-steering-evidence
          path: fdr_wufr27_evidence/
          if-no-files-found: error
          retention-days: 90
