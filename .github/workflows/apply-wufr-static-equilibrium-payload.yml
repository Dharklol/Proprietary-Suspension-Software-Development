name: Apply WUFR static equilibrium payload

on:
  pull_request:
    paths:
      - "tools/wufr-static-equilibrium-payload/**"
      - ".github/workflows/apply-wufr-static-equilibrium-payload.yml"

permissions:
  contents: write

concurrency:
  group: apply-wufr-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate payload
        run: |
          cat tools/wufr-static-equilibrium-payload/part-* | base64 --decode > /tmp/wufr-static-equilibrium-payload.tar.gz
          echo "e51710aeb57a80557a32ebff3a9c0bc42020ed330a4315ab8ae2f32af657b718  /tmp/wufr-static-equilibrium-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wufr-static-equilibrium-payload.tar.gz
          python -m pip install -e .
          python -m pytest -q \
            tests/test_suspension_wufr_zbar_wheel.py \
            tests/test_wufr_static_equilibrium.py \
            tests/test_wufr_static_equilibrium_failures.py \
            tests/test_wufr_unsprung_gravity_reduction.py
          rm -rf tools/wufr-static-equilibrium-payload
          rm .github/workflows/apply-wufr-static-equilibrium-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement corrected WUFR static equilibrium runtime"
          git push origin HEAD:${{ github.head_ref }}
