name: Apply WUFR static equilibrium payload

on:
  pull_request:
    paths:
      - "tools/wufr-static-equilibrium-payload/**"
      - ".github/workflows/apply-wufr-static-equilibrium-payload.yml"

permissions:
  contents: write

concurrency:
  group: apply-wufr-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate payload
        run: |
          cat <<'CHECKSUMS' | sha256sum -c -
          b23b2ddcd714576882f4fb83d16a8a728c5f65a6584cd7cfefd522ebd8762b67  tools/wufr-static-equilibrium-payload/part-00
          8c4386b658dbd6c891ea8708079e29cfed0b24b01dcc95cdc23c493ff6632be1  tools/wufr-static-equilibrium-payload/part-01
          f8e6cf2fc6450467fd67b366268830b711b398a32d534ab7c96b540afb149dc7  tools/wufr-static-equilibrium-payload/part-02
          e321dd11a5cbf85fdc869a2ad70c696a36865e15dd9ebc1e693eec604a0f5de3  tools/wufr-static-equilibrium-payload/part-03
          b973967734a4b33292fff731fe9642ca68ad5ad768bbf2997a35766f4b43c4b6  tools/wufr-static-equilibrium-payload/part-04
          52a879d15a9d7463727a51290c0a0b372afcf62136d3a05a451c8aa7c6ab26ad  tools/wufr-static-equilibrium-payload/part-05
          536b5e1e5a3a8a5e1f5980a06939b01c02dd041440a6d40628f63de116d3883c  tools/wufr-static-equilibrium-payload/part-06
          cf6df64e72d1d34044baa90783e062681e4d87f2f9e6c1aca30c06dda7f483f7  tools/wufr-static-equilibrium-payload/part-07
          CHECKSUMS
          cat tools/wufr-static-equilibrium-payload/part-* | base64 --decode > /tmp/wufr-static-equilibrium-payload.tar.gz
          echo "e51710aeb57a80557a32ebff3a9c0bc42020ed330a4315ab8ae2f32af657b718  /tmp/wufr-static-equilibrium-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wufr-static-equilibrium-payload.tar.gz
          python -m pip install -e .
          python -m pytest -q \
            tests/test_suspension_wufr_zbar_wheel.py \
            tests/test_wufr_static_equilibrium.py \
            tests/test_wufr_static_equilibrium_failures.py \
            tests/test_wufr_unsprung_gravity_reduction.py
          rm -rf tools/wufr-static-equilibrium-payload
          rm .github/workflows/apply-wufr-static-equilibrium-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement corrected WUFR static equilibrium runtime"
          git push origin HEAD:${{ github.head_ref }}
