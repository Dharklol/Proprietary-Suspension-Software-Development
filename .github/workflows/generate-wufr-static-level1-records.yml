name: Generate WUFR static Level-1 frozen records

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'phase-3-wufr-static-level1-interface-load-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Generate and push frozen records
        run: |
          set -euo pipefail
          python scripts/run_wufr_static_level1_interface_load_benchmarks.py \
            --output benchmarks/suspension/wufr_static_level1_interface_loads_result_v0.1.0.json \
            --summary-output benchmarks/suspension/wufr_static_level1_interface_loads_result_v0.1.0.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/suspension/wufr_static_level1_interface_loads_result_v0.1.0.json \
            benchmarks/suspension/wufr_static_level1_interface_loads_result_v0.1.0.toml
          if git diff --cached --quiet; then
            echo "Frozen records already current"
            exit 0
          fi
          git commit -m "Freeze WUFR static Level-1 interface load result"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
