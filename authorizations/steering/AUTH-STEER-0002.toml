[architecture]
authoritative_evaluator_model_id = "MOD-STEER-0001"
optimizer_orchestrator_model_id = "MOD-STEER-0002"
composition_rule = "Every candidate and every posed operating state must be converted into the public MOD-STEER-0001 geometry contract and evaluated by that implementation. MOD-STEER-0002 may transform provider-supplied upright poses, ingest explicitly converted external pose tables, and compare evaluator outputs with explicit curve or scalar state targets, but may not duplicate, approximate, fit, or replace rigid closure, wheel-plane projection, branch, singularity, Ackermann, ratio, or turning-path calculations."
result_rule = "Optimizer and multi-state results must retain complete evaluator diagnostics, provider provenance, and individual objective contributions for accepted or rejected states. Supplemental screening, sensitivity, pose, external-adapter, curve-target, and scalar state-metric records preserve underlying analyzer results rather than replacing them."

[permitted]
items = [
  "Role-based steering design studies in which each parameter is fixed, bounded continuous, discrete, derived, constrained, targeted, or report-only within a named requirement set.",
  "A symmetric nominal candidate generator for rack longitudinal position, rack vertical position, rack inner-joint half-spacing, and upright-local outer tie-rod pickup coordinates.",
  "A heavily bounded upright-local outer-pickup depth variable whose default may be changed to fixed without changing the generator architecture.",
  "Reference-state derivation of tie-rod joint-center length from generated inner and outer joint coordinates.",
  "Deterministic multi-start constrained search over candidates evaluated exclusively by MOD-STEER-0001.",
  "Historical WUFR-26/27 steering-response regression targets, exact geometric Ackermann references, user-supplied target curves, ratio bands, and turning-capability requirements through a target-provider contract.",
  "Return of multiple feasible or nondominated candidates together with transparent objective contributions, hard-constraint margins, sensitivity information, and a convenience ranking.",
  "Development-only mathematical sanity bounds that are explicitly not WUFR-27 or WUFR-28 packaging authority.",
  "Named supplemental constraint sets that distinguish active, failed, and unavailable requirements and retain missing evidence as unavailable rather than passed.",
  "Bounded local finite-difference sensitivity in which every perturbation is role-resolved, regenerated, and evaluated through MOD-STEER-0001.",
  "Objective-ranked candidate comparison with explicit normalized design-space separation, geometry deltas, constraint records, and unavailable evidence.",
  "Consumption of source-agnostic suspension-pose records containing left/right zero-steer upright rigid transforms, named state coordinates, source authority, and the explicit unresolved-steering rule.",
  "Transformation of steering axes, upright-bound outer tie-rod pickups, and wheel-plane references by a supplied pose while keeping rack geometry, rack inner joints, and nominal tie-rod length fixed.",
  "Complete MOD-STEER-0001 rack sweeps at symmetric or asymmetric suspension operating poses with state-dependent heading, side-local dynamic-toe, branch, and singularity reporting.",
  "Explicit operating-state target sets assigning objective or report-only roles, left/right requested heading curves, sample weights, normalization scales, state weights, convention adapters, and source authority.",
  "Analyzer-generated synthetic multi-state targets for software recovery benchmarks and explicit provider tables for future manual, geometric, or externally generated targets.",
  "A transparent sum of weighted normalized state-level target errors for the existing deterministic development search while preserving each state contribution separately.",
  "Ingestion of explicit external rigid-upright pose exchange tables after the source-specific converter has declared source path/revision, canonical frame, translation and rotation convention, authority, state coordinates, and exclusion of tie-rod steering response.",
  "Explicit scalar operating-state targets for centered side-local dynamic-toe change and centered rack-to-wheel steering gain, using only quantities already produced by the MOD-STEER-0001 multi-state path.",
  "A transparent sum of weighted normalized left/right state-metric pair RMS terms, with state, metric, unit, normalization, weight, convention adapters, authority, and residuals preserved separately.",
  "Analyzer-generated synthetic dynamic-toe and rack-gain state targets for deterministic software recovery benchmarks.",
  "Provider interfaces for later tire-informed target generation, rack-load or effort envelopes, tolerance distributions, and physical-correlation parameters without implementing those later physics layers in this authorization."
]

[prohibited]
items = [
  "Any second steering-kinematics evaluator inside the optimizer, pose layer, external-pose adapter, operating-target layer, or scalar state-metric objective layer.",
  "Polynomial, surrogate, learned, CAD, or external response curves replacing rigid mechanism evaluation.",
  "Feeding a suspension pose that already contains tie-rod-induced steering or bump-steer response into MOD-STEER-0001 as an unresolved zero-steer pose.",
  "Hidden vendor-specific axis, handedness, Euler-order, sign, length-unit, or frame conversions inside the steering external-pose adapter.",
  "Treating descriptive design documents, toe/camber curves, physical kinematics-validation sheets, or source metadata alone as an authoritative unresolved upright-pose transform series.",
  "Silently applying a nominal or historical target to an unlisted non-nominal suspension state.",
  "Treating synthetic operating-state target curves, scalar state targets, state weights, or pose transforms as WUFR vehicle-dynamics design truth.",
  "Treating the OptimumK Steering Toe Angle Gain channel labeled with unit '-' as equivalent to the centered rack-to-wheel gain in deg/mm without a separately reviewed input/transmission and convention conversion.",
  "Hidden relaxation of hard constraints, alternate-root substitution, clipping, extrapolation, or penalty-only treatment of infeasible mechanisms.",
  "Treating unavailable hardware or installed-state evidence as a passed constraint.",
  "Production geometry ranking, WUFR-27 redesign authority, WUFR-28 release authority, or automatic CAD modification.",
  "Independent left/right design variables in the first implementation unless a later requirement set explicitly enables and justifies asymmetry; asymmetric operating suspension states remain permitted.",
  "Native suspension bump, rebound, roll, pitch, heave, or wheel-travel kinematics calculations inside the steering package. The package may consume reviewed pose-provider outputs only.",
  "Treating synthetic suspension-pose, external-adapter fixture, or analyzer-generated state-metric results as WUFR bump-steer, roll-steer, OptimumK correlation, CAD correlation, tire-optimal targets, or physical evidence.",
  "Native tire-force target generation, steering effort, rack loads, compliance, backlash, friction, tolerance propagation, or transient steering physics without a later reviewed provider/model gate.",
  "Describing local finite-difference sensitivity as manufacturing tolerance, uncertainty propagation, or robustness analysis.",
  "Reinforcement-learning, genetic, or other learned/global optimization claims before deterministic baseline methods and benchmark burdens are established.",
  "Treating the historical regression target as the permanent or universally optimal steering target.",
  "Pareto-completeness, global-optimality, packaging-feasibility, manufacturing-feasibility, or production-release claims from the current scalar development search, diversity filter, synthetic pose studies, external-adapter fixture, curve-target aggregation, or state-metric aggregation."
]

[first_implementation_boundary]
fixed_geometry = [
  "wheel centers and nominal wheel-plane reference states",
  "nominal left steering-axis line",
  "nominal right steering-axis line generated by reviewed reflection",
  "nominal upright reference poses",
  "suspension hardpoints",
  "wheelbase",
  "nominal steering-axis ground-intersection track definition",
  "rack-axis direction",
  "static toe and camber reference values",
  "rack travel and input transmission for the selected development configuration"
]
active_variables = [
  "rack_longitudinal_offset",
  "rack_vertical_offset",
  "rack_inner_joint_half_spacing",
  "outer_pickup_local_u_offset",
  "outer_pickup_local_v_offset",
  "outer_pickup_local_depth_offset"
]
symmetry = "Exact left/right reflection is mandatory for design variables in the first implementation. Operating suspension poses may differ left-to-right because independent wheel travel is a state, not intentional design asymmetry."
tie_rod_length_role = "derived_output_at_nominal_reference_then_fixed_across_pose_states"

[provider_contracts]
pose_provider = "Implemented provider-neutral contract returns left/right rigid upright transforms, named state coordinates, source authority, and steering_dof_rule=upright_reference_pose_excludes_tie_rod_steering_rotation. The external exchange adapter accepts already converted canonical body-frame metre translations and full active rotation matrices with explicit source/revision/frame metadata and rejects sources containing tie-rod steering response. Synthetic fixtures are implemented; reviewed WUFR/OptimumK/CAD/native-solver pose authority remains open."
target_provider = "Historical and analyzer-generated nominal targets are implemented. OperatingStateTargetSet assigns explicit objective or report-only roles, left/right curves, sample weights, normalization, state weights, convention adapters, and source authority to named suspension states. StateMetricTargetSet adds explicit left/right scalar targets for centered dynamic-toe change and centered rack-to-wheel gain with metric-specific units, normalization, weights, sign adapters, and authority. Synthetic and explicit table construction routes are implemented; reviewed tire/vehicle target generation remains open."
constraint_provider = "Returns active, failed, or unavailable named constraints with value, limits, margin, units, state, authority, blocking status, and missing-evidence reason. The implemented development set is screening authority only, not hardware authority."
rack_load_provider = "Future provider returns rack-force or column-torque envelopes with operating-state and uncertainty metadata. No load physics is implemented here."
uncertainty_provider = "Future provider returns named parameter distributions or bounded perturbations. No robustness claim is authorized."
physical_parameter_provider = "Future provider returns calibrated transmission, deadband, compliance, stops, and as-built observations without changing the rigid evaluator equations. Implementation is explicitly deferred until required physical data exist."

[candidate_results]
required = [
  "candidate and requirement-set IDs",
  "complete generated nominal geometry",
  "complete MOD-STEER-0001 sweep result",
  "feasibility status and named failure reason",
  "margin to every active hard constraint",
  "unavailable constraint records and missing-evidence reasons",
  "individual normalized and unnormalized objective contributions",
  "solver initialization and termination status",
  "alternative feasible or nondominated candidates",
  "local sensitivity records where requested",
  "ranking and candidate-separation explanation",
  "pose-set and state IDs when suspension states are evaluated",
  "pose source, source revision, frame, coordinate, transform, steering-DOF, and adapter provenance",
  "state-dependent headings, dynamic toe, branch, and singularity diagnostics",
  "operating-state target role, requested curves, sample weights, normalization, state weight, convention adapter, source authority, and residual summary",
  "state-metric ID, left/right requested values, output unit, normalization, weight, convention adapters, source authority, and residual summary",
  "aggregate-objective method and every constituent state or state-metric contribution",
  "source and configuration provenance"
]
ranking_rule = "A convenience ranking may be provided, but the candidate set and individual tradeoffs remain visible. Hard-constraint violations cannot be compensated by objective score. Unavailable constraints remain visible and prevent hardware-feasible claims. Unlisted operating states are report-only by explicit first-contract policy; they never silently inherit a nominal target. External pose ingestion does not authorize WUFR design ranking until the actual pose source and conversion are reviewed. Scalar state-metric targets do not gain vehicle/tire authority merely because a software-recovery fixture exists."

[required_before_geometry_generator_merge]
items = [
  "A role resolver maps requirement-set items without embedding WUFR-specific variable behavior in code.",
  "A zero-offset candidate reconstructs WUFR27_STEERING_BASELINE_V0 and produces evaluator inputs numerically identical to the referenced WUFR26_DESIGN_NOMINAL_V0 geometry.",
  "Tie-rod length is derived from joint centers and inconsistency is reported if a second independent length is supplied.",
  "Reflection tests cover axes, inner joints, outer joints, wheel bases, toe signs, and source roles.",
  "Development bounds and the narrow depth policy are explicit in the requirement set and result provenance.",
  "No optimizer search or objective ranking is merged with the geometry-generator pull request."
]
status = "complete_in_PR21"

[required_before_optimizer_merge]
items = [
  "The optimizer calls the existing analyzer public interface for every candidate and contains no duplicate closure or derived-metric equations.",
  "Synthetic target-recovery and WUFR-26/27 historical regression cases have frozen expected behavior.",
  "Hard infeasibility is represented separately from objective values.",
  "At least one deterministic local constrained method and one multi-start strategy are documented and benchmarked.",
  "Repeat runs with identical configuration and seed produce identical candidate and ranking results.",
  "Candidate reports expose objective units, normalization, weights, domains, margins, and termination diagnostics."
]
