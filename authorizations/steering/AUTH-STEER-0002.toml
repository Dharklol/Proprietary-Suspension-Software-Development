[promotion_gates]
items = [
  "Nominal inverse-design benchmarks and code review complete before use for exploratory geometry studies.",
  "Reviewed packaging, articulation, thread-engagement, rack, steering-arm, and manufacturing constraints before hardware-feasible ranking claims.",
  "Future reviewed hardware constraints must enter every search-candidate disposition before the search is described as hardware-feasible rather than archive-screened.",
  "A reviewed external or native pose data source, including source-specific frame conversion and unresolved-steering verification, before any suspension-state response is described as WUFR bump steer or used for WUFR design ranking.",
  "Explicit operating-state target definitions and source authority before state-dependent response enters design ranking; synthetic targets satisfy only software verification.",
  "Reviewed tire and vehicle operating-point models before tire-informed target generation or tire-optimal steering claims.",
  "Reviewed rack-load or effort model before steering-effort optimization.",
  "Reviewed tolerance and uncertainty model before robustness claims.",
  "Physical Level F evidence before as-built or installed-performance claims.",
  "A later focused authorization before WUFR-28 production geometry selection."
]

