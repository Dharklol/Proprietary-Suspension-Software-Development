  "EQ-STEER-0002",
  "EQ-STEER-0003",
  "EQ-STEER-0004",
  "EQ-STEER-0005",
  "EQ-STEER-0006",
  "EQ-STEER-0007"
]

[implementation_tracking]
authorization_merge = "PR #20"
geometry_generator_implementation = "PR #21"
geometry_generator_merge_commit = "cdb8a89605cb8532d4758f384597de39b456d0ef"
nominal_optimizer_implementation = "PR #22"
nominal_optimizer_merge_commit = "5ab40328346e14a491e1b1a1775a71af67980744"
