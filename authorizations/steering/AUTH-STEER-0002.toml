[required_before_external_pose_adapter_merge]
items = [
  "The external adapter contains no suspension or steering equations and only converts explicitly declared rigid-transform data into SuspensionPoseSet.",
  "The manifest requires source path, source revision, authority, frame identity/definition, metre translation, active rotation convention, state coordinates, and the unresolved-steering rule.",
  "The manifest explicitly declares tie_rod_steering_response_included=false and a true declaration is rejected before mechanism evaluation.",
  "Source-specific vendor frame/sign/unit conversion occurs upstream and is not guessed inside steering.",
  "The external exchange fixture reconstructs every reference pose coordinate and transform component exactly.",
  "The imported fixture produces identical MOD-STEER-0001 feasibility, rack-sweep wheel headings, and centered dynamic-toe response to the canonical reference fixture.",
  "The source audit records that descriptive SolidWorks/OptimumK evidence was found but no reviewed machine-readable WUFR zero-steer upright transform series was identified.",
  "Synthetic exchange data remain software integration evidence and do not authorize WUFR suspension-state design ranking."
]
status = "implemented_for_PR26_review"
benchmark_ids = ["BENCH-STEER-0018"]
implementation_tests = "tests/test_steering_external_pose_adapter.py"
benchmark_report_script = "scripts/run_steering_external_pose_adapter_benchmarks.py"
