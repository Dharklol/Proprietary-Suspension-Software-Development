[architecture]
authoritative_evaluator_model_id = "MOD-STEER-0001"
optimizer_orchestrator_model_id = "MOD-STEER-0002"
composition_rule = "Every candidate and every posed operating state must be converted into the public MOD-STEER-0001 geometry contract and evaluated by that implementation. MOD-STEER-0002 may transform provider-supplied upright poses, ingest explicitly converted external pose tables, compare evaluator outputs with explicit curve or scalar state targets, and request tire-informed target curves from reviewed provider data, but may not duplicate, approximate, fit, or replace rigid closure, wheel-plane projection, branch, singularity, Ackermann, ratio, or turning-path calculations."
result_rule = "Optimizer and multi-state results must retain complete evaluator diagnostics, provider provenance, and individual objective contributions for accepted or rejected states. Supplemental screening, sensitivity, pose, external-adapter, curve-target, scalar state-metric, and tire-informed target records preserve underlying analyzer results rather than replacing them."

[permitted]
items = [
  "Role-based steering design studies in which each parameter is fixed, bounded continuous, discrete, derived, constrained, targeted, or report-only within a named requirement set.",
  "A symmetric nominal candidate generator for rack longitudinal position, rack vertical position, rack inner-joint half-spacing, and upright-local outer tie-rod pickup coordinates.",
  "Reference-state derivation of tie-rod joint-center length from generated inner and outer joint coordinates.",
  "Deterministic multi-start constrained search over candidates evaluated exclusively by MOD-STEER-0001.",
  "Historical WUFR-26/27 steering-response regression targets, exact geometric Ackermann references, user-supplied target curves, ratio bands, turning-capability requirements, explicit operating-state targets, and explicit state-metric targets through provider contracts.",
  "Consumption of source-agnostic zero-steer suspension-pose records and canonical external rigid-upright pose exchange tables with explicit unresolved-steering declarations.",
  "Complete MOD-STEER-0001 rack sweeps at symmetric or asymmetric suspension operating poses with state-dependent heading, side-local dynamic-toe, branch, and singularity reporting.",
  "A reusable dependency-free TireLateralSummaryGrid carrying reviewed pressure, inclination, normal-load, cornering-stiffness, peak-lateral-force, source peak-slip, source censoring, source-tire identity, intended-tire identity, authority, and provenance.",
  "The team-authorized Hoosier 43105 18x7.5-10 R25B TTC data as an explicitly labeled engineering proxy for the intended Hoosier 43104 18x7.5-10 R20 during steering target development, while preserving both identities.",
  "Bounded trilinear interpolation inside the reviewed tire grid with no extrapolation and rejection of peak-slip target queries whose interpolation stencil touches a source value censored at the +/-12 deg sweep boundary.",
  "Standard-library TIR metadata parsing and optional SciPy-backed MATLAB TTC channel ingestion as source adapters; neither path is a second tire-force evaluator and SciPy is not a required runtime dependency.",
  "A tire-informed differential steering target adapter that reuses the reviewed exact Ackermann helper, preserves an explicit base inside-wheel heading trajectory, and adds only a caller-visible utilization-scaled outside-minus-inside peak-slip correction to the outside-wheel Ackermann reference.",
  "Historical MATLAB/Magic Formula model-chain values as external integration evidence while keeping its historical 2/3 force/moment scaling assumption separate from the TTC-derived tire provider.",
  "Return of multiple feasible candidates together with transparent objective contributions, hard-constraint margins, provider provenance, tire operating points, and convenience ranking."
]

[prohibited]
items = [
  "Any second steering-kinematics evaluator inside the optimizer, pose layer, external-pose adapter, operating-target layer, scalar state-metric objective layer, or tire-informed target adapter.",
  "Polynomial, surrogate, learned, CAD, tire, or external response curves replacing rigid mechanism evaluation.",
  "Feeding a suspension pose that already contains tie-rod-induced steering or bump-steer response into MOD-STEER-0001 as an unresolved zero-steer pose.",
  "Hidden vendor-specific axis, handedness, Euler-order, sign, length-unit, or frame conversions inside the steering external-pose adapter.",
  "Silently applying a nominal or historical target to an unlisted non-nominal suspension state.",
  "Treating synthetic operating-state target curves, scalar state targets, state weights, pose transforms, the PR28 TTC reference pair, or its utilization schedule as WUFR vehicle-dynamics design truth.",
  "Treating the OptimumK Steering Toe Angle Gain channel labeled with unit '-' as equivalent to the centered rack-to-wheel gain in deg/mm without a separately reviewed input/transmission and convention conversion.",
  "Treating the Hoosier 43105 R25B source and Hoosier 43104 R20 intended tire as literal compound or part-number identity; the current relationship is an explicit engineering-equivalence proxy decision.",
  "Using a source peak-slip value at the +/-12 deg TTC sweep boundary as a verified true peak for target generation without separate evidence.",
  "Extrapolating tire pressure, inclination, or normal load outside the reviewed summary grid or hiding interpolation/source censoring from target provenance.",
  "Applying the historical 2/3 sandpaper-to-track force or moment scale automatically inside the tire-data layer.",
  "A Python Magic Formula rewrite, full combined-slip tire-force solver, transient tire model, or vehicle equilibrium/load-transfer solver in this steering-target authorization.",
  "Treating manually supplied wheel loads, cambers, pressures, or slip-utilization schedules as production WUFR operating-state truth or claiming production tire-optimal steering from them.",
  "Hidden relaxation of hard constraints, alternate-root substitution, clipping, extrapolation, or penalty-only treatment of infeasible mechanisms.",
  "Treating unavailable hardware or installed-state evidence as a passed constraint.",
  "Production geometry ranking, WUFR-27 redesign authority, WUFR-28 release authority, or automatic CAD modification.",
  "Native suspension bump, rebound, roll, pitch, heave, or wheel-travel kinematics calculations inside the steering package.",
  "Steering effort, rack loads, compliance, backlash, friction, tolerance propagation, or transient steering physics without their later reviewed provider/model gates.",
  "Describing local finite-difference sensitivity as manufacturing tolerance, uncertainty propagation, or robustness analysis.",
  "Reinforcement-learning, genetic, or other learned/global optimization claims before deterministic baseline methods and benchmark burdens are established.",
  "Pareto-completeness, global-optimality, packaging-feasibility, manufacturing-feasibility, or production-release claims from the current development search."
]

[first_implementation_boundary]
fixed_geometry = ["wheel centers and nominal wheel-plane reference states", "nominal steering-axis lines", "nominal upright reference poses", "suspension hardpoints", "wheelbase", "nominal steering-axis ground-intersection track definition", "rack-axis direction", "static toe and camber reference values", "rack travel and input transmission for the selected development configuration"]
active_variables = ["rack_longitudinal_offset", "rack_vertical_offset", "rack_inner_joint_half_spacing", "outer_pickup_local_u_offset", "outer_pickup_local_v_offset", "outer_pickup_local_depth_offset"]
symmetry = "Exact left/right reflection is mandatory for design variables in the first implementation. Operating suspension poses may differ left-to-right because independent wheel travel is a state, not intentional design asymmetry."
tie_rod_length_role = "derived_output_at_nominal_reference_then_fixed_across_pose_states"

[provider_contracts]
pose_provider = "Implemented provider-neutral contract returns left/right rigid upright transforms, named state coordinates, source authority, and steering_dof_rule=upright_reference_pose_excludes_tie_rod_steering_rotation. Reviewed WUFR/OptimumK/CAD/native-solver pose authority remains open."
target_provider = "Historical/analyzer targets, OperatingStateTargetSet, StateMetricTargetSet, and a bounded tire-informed differential target route are implemented. The tire route consumes TireLateralSummaryGrid plus explicit inside/outside TireOperatingPoint values and an explicit slip-utilization schedule. Full WUFR vehicle force-demand/load-state generation remains open."
tire_data_provider = "TireLateralSummaryGrid is a reusable source-preserving lateral summary, not a Magic Formula evaluator. Current reviewed steering source is Hoosier 43105 R25B TTC data as the explicitly authorized engineering proxy for the intended Hoosier 43104 R20; TIR metadata and optional MAT channel readers support later source ingestion without becoming core dependencies."
constraint_provider = "Returns active, failed, or unavailable named constraints with value, limits, margin, units, state, authority, blocking status, and missing-evidence reason. The implemented development set is screening authority only, not hardware authority."
rack_load_provider = "Future provider returns rack-force or column-torque envelopes with operating-state and uncertainty metadata. No load physics is implemented here."
uncertainty_provider = "Future provider returns named parameter distributions or bounded perturbations. No robustness claim is authorized."
physical_parameter_provider = "Future provider returns calibrated transmission, deadband, compliance, stops, and as-built observations without changing the rigid evaluator equations. Implementation is explicitly deferred until required physical data exist."

[candidate_results]
required = ["candidate and requirement-set IDs", "complete generated nominal geometry", "complete MOD-STEER-0001 sweep result", "feasibility status and named failure reason", "margin to every active hard constraint", "unavailable constraint records and missing-evidence reasons", "individual normalized and unnormalized objective contributions", "solver initialization and termination status", "alternative feasible or nondominated candidates", "local sensitivity records where requested", "ranking and candidate-separation explanation", "pose-set and state IDs when suspension states are evaluated", "pose source and adapter provenance", "state-dependent headings, dynamic toe, branch, and singularity diagnostics", "operating-state target role and residual summary", "state-metric target and residual summary", "tire grid/source/intended tire identity, inside/outside operating points, source censoring disposition, slip-utilization schedule, and differential correction provenance when tire-informed targets are used", "aggregate-objective method and every constituent state or state-metric contribution", "source and configuration provenance"]
ranking_rule = "A convenience ranking may be provided, but the candidate set and individual tradeoffs remain visible. Hard-constraint violations cannot be compensated by objective score. Unavailable constraints remain visible and prevent hardware-feasible claims. Tire-informed targets gain no production vehicle authority merely because a TTC proxy and software benchmark exist."

