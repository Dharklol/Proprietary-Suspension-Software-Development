constraint_sensitivity_review = "docs/reviews/phase1_steering_constraints_sensitivity_review.md"

[architecture]
authoritative_evaluator_model_id = "MOD-STEER-0001"
optimizer_orchestrator_model_id = "MOD-STEER-0002"
composition_rule = "Every candidate must be converted into the public MOD-STEER-0001 geometry contract and evaluated by that implementation. MOD-STEER-0002 may not duplicate, approximate, fit, or replace the rigid closure, wheel-plane projection, branch, singularity, Ackermann, ratio, or turning-path calculations."
result_rule = "Optimizer results must retain the complete evaluator result and diagnostics for every accepted or rejected candidate. Supplemental screening and sensitivity records must preserve the underlying CandidateEvaluation unchanged."

[permitted]
items = [
  "Role-based steering design studies in which each parameter is fixed, bounded continuous, discrete, derived, constrained, targeted, or report-only within a named requirement set.",
  "A symmetric nominal-height candidate generator for rack longitudinal position, rack vertical position, rack inner-joint half-spacing, and upright-local outer tie-rod pickup coordinates.",
  "A heavily bounded upright-local outer-pickup depth variable whose default may be changed to fixed without changing the generator architecture.",
  "Reference-state derivation of tie-rod joint-center length from generated inner and outer joint coordinates.",
  "Deterministic multi-start constrained search over candidates evaluated exclusively by MOD-STEER-0001.",
  "Historical WUFR-26/27 steering-response regression targets, exact geometric Ackermann references, user-supplied target curves, ratio bands, and turning-capability requirements through a target-provider contract.",
  "Return of multiple feasible or nondominated candidates together with transparent objective contributions, hard-constraint margins, sensitivity information, and a convenience ranking.",
  "Development-only mathematical sanity bounds that are explicitly not WUFR-27 or WUFR-28 packaging authority.",
  "Named supplemental constraint sets that distinguish active, failed, and unavailable requirements and retain missing evidence as unavailable rather than passed.",
  "Bounded local finite-difference sensitivity in which every perturbation is role-resolved, regenerated, and evaluated through MOD-STEER-0001.",
  "Objective-ranked candidate comparison with explicit normalized design-space separation, geometry deltas, constraint records, and unavailable evidence.",
  "Provider interfaces for later suspension poses, tire-informed targets, rack-load or effort envelopes, tolerance distributions, and physical-correlation parameters without implementing those later physics layers in this authorization."
]

[prohibited]
items = [
  "Any second steering-kinematics evaluator inside the optimizer.",
  "Polynomial, surrogate, learned, or CAD response curves replacing rigid mechanism evaluation.",
  "Hidden relaxation of hard constraints, alternate-root substitution, clipping, extrapolation, or penalty-only treatment of infeasible mechanisms.",
  "Treating unavailable hardware or installed-state evidence as a passed constraint.",
  "Production geometry ranking, WUFR-27 redesign authority, WUFR-28 release authority, or automatic CAD modification.",
  "Independent left/right design variables in the first implementation unless a later requirement set explicitly enables and justifies asymmetry.",
  "Suspension bump, rebound, roll, pitch, or heave calculations beyond consuming a future reviewed pose-provider result.",
  "Tire-force target generation, steering effort, rack loads, compliance, backlash, friction, tolerance propagation, or transient steering physics.",
  "Describing local finite-difference sensitivity as manufacturing tolerance, uncertainty propagation, or robustness analysis.",
  "Reinforcement-learning, genetic, or other learned/global optimization claims before deterministic baseline methods and benchmark burdens are established.",
  "Treating the historical regression target as the permanent or universally optimal steering target.",
  "Pareto-completeness, global-optimality, packaging-feasibility, manufacturing-feasibility, or production-release claims from the current single-objective development search and diversity filter."
]

[first_implementation_boundary]
fixed_geometry = [
  "wheel centers and wheel-plane reference states",
  "left steering-axis line",
  "right steering-axis line generated by reviewed reflection",
  "upright reference poses",
  "suspension hardpoints",
  "wheelbase",
  "steering-axis ground-intersection track definition",
  "rack-axis direction",
  "static toe and camber reference values",
  "rack travel and input transmission for the selected development configuration"
]
active_variables = [
  "rack_longitudinal_offset",
  "rack_vertical_offset",
  "rack_inner_joint_half_spacing",
  "outer_pickup_local_u_offset",
  "outer_pickup_local_v_offset",
  "outer_pickup_local_depth_offset"
]
symmetry = "Exact left/right reflection is mandatory in the first implementation. The schema must permit a later explicit asymmetric requirement set without changing the evaluator."
tie_rod_length_role = "derived_output"

[provider_contracts]
pose_provider = "Future provider returns reviewed left/right upright pose, steering-axis line, wheel basis, and outer-pickup transform for a named suspension state. The first release uses the nominal baseline pose."
target_provider = "Returns left/right target headings or inside/outside target relations, input coordinates, weights, units, validity domain, source authority, and convention adapter. Historical and analyzer-generated target providers are implemented."
constraint_provider = "Returns active, failed, or unavailable named constraints with value, limits, margin, units, state, authority, blocking status, and missing-evidence reason. The implemented development set is screening authority only, not hardware authority."
rack_load_provider = "Future provider returns rack-force or column-torque envelopes with operating-state and uncertainty metadata. No load physics is implemented here."
uncertainty_provider = "Future provider returns named parameter distributions or bounded perturbations. No robustness claim is authorized in the first code release."
physical_parameter_provider = "Future provider returns calibrated transmission, deadband, compliance, and as-built observations without changing the rigid evaluator equations."

[candidate_results]
required = [
  "candidate and requirement-set IDs",
  "complete generated geometry",
  "complete MOD-STEER-0001 sweep result",
  "feasibility status and named failure reason",
  "margin to every active hard constraint",
  "unavailable constraint records and missing-evidence reasons",
  "individual normalized and unnormalized objective contributions",
  "solver initialization and termination status",
  "alternative feasible or nondominated candidates",
  "local sensitivity records where requested",
  "ranking and candidate-separation explanation",
  "source and configuration provenance"
]
ranking_rule = "A convenience ranking may be provided, but the candidate set and individual tradeoffs must remain visible. Hard-constraint violations cannot be compensated by objective score. Unavailable constraints remain visible and prevent hardware-feasible claims."

[required_before_geometry_generator_merge]
items = [
  "A role resolver maps requirement-set items without embedding WUFR-specific variable behavior in code.",
  "A zero-offset candidate reconstructs WUFR27_STEERING_BASELINE_V0 and produces evaluator inputs numerically identical to the referenced WUFR26_DESIGN_NOMINAL_V0 geometry.",
  "Tie-rod length is derived from joint centers and inconsistency is reported if a second independent length is supplied.",
  "Reflection tests cover axes, inner joints, outer joints, wheel bases, toe signs, and source roles.",
  "Development bounds and the narrow depth policy are explicit in the requirement set and result provenance.",
  "No optimizer search or objective ranking is merged with the geometry-generator pull request."
]
status = "complete_in_PR21"

[required_before_optimizer_merge]
items = [
  "The optimizer calls the existing analyzer public interface for every candidate and contains no duplicate closure or derived-metric equations.",
  "Synthetic target-recovery and WUFR-26/27 historical regression cases have frozen expected behavior.",
  "Hard infeasibility is represented separately from objective values.",
  "At least one deterministic local constrained method and one multi-start strategy are documented and benchmarked.",
  "Repeat runs with identical configuration and seed produce identical candidate and ranking results.",
  "Candidate reports expose objective units, normalization, weights, domains, margins, and termination diagnostics.",
  "Literature and numerical-method references are recorded at model or method level."
]
status = "complete_in_PR22"
benchmark_ids = ["BENCH-STEER-0010", "BENCH-STEER-0011"]
implementation_tests = "tests/test_steering_nominal_optimizer.py"
benchmark_report_script = "scripts/run_steering_nominal_optimizer_benchmarks.py"

[required_before_constraint_layer_merge]
items = [
  "A named constraint-provider set distinguishes active, failed, and unavailable requirements.",
  "Every active provider result includes value, limit, margin, unit, state, authority, blocking status, and message.",
  "Unavailable hardware evidence is nonblocking but remains visible and is never described as passed.",
  "A failed blocking supplemental constraint removes the screened candidate from objective-ranked use without altering its base analyzer result.",
  "Every local sensitivity perturbation is bounded, role-resolved, regenerated, and evaluated through MOD-STEER-0001.",
  "Repeated sensitivity requests with identical inputs return identical results.",
  "Candidate comparison exposes objective, geometry, constraint, unavailable-evidence, and normalized design-distance differences.",
  "The report states that supplemental constraints screen the retained archive and do not yet guide search through a reviewed hardware-feasible region."
]
status = "implemented_for_PR23_review"
benchmark_ids = ["BENCH-STEER-0012", "BENCH-STEER-0013"]
implementation_tests = "tests/test_steering_constraints_sensitivity.py"
benchmark_report_script = "scripts/run_steering_constraint_sensitivity_benchmarks.py"

[promotion_gates]
items = [
  "Nominal inverse-design benchmarks and code review complete before use for exploratory geometry studies.",
  "Reviewed packaging, articulation, thread-engagement, rack, steering-arm, and manufacturing constraints before hardware-feasible ranking claims.",
  "Future reviewed hardware constraints must enter every search-candidate disposition before the search is described as hardware-feasible rather than archive-screened.",
  "A reviewed pose provider before bump-steer or suspension-state optimization.",
  "Reviewed tire and vehicle operating-point models before tire-informed target generation.",
  "Reviewed rack-load or effort model before steering-effort optimization.",
  "Reviewed tolerance and uncertainty model before robustness claims.",
  "Physical Level F evidence before as-built or installed-performance claims.",
  "A later focused authorization before WUFR-28 production geometry selection."
]

