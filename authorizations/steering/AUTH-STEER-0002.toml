[required_before_operating_target_merge]
items = [
  "Every target state has an explicit objective or report-only role and the first contract declares unlisted states report-only.",
  "Objective states carry left/right target curves, sample weights, normalization, state weight, convention sign, source authority, and provenance.",
  "Report-only states still participate in complete MOD-STEER-0001 operating-envelope feasibility checks.",
  "A failed operating pose makes the candidate infeasible and produces no aggregate target score.",
  "The state aggregate retains every raw and normalized objective term and documents its scalar aggregation equation.",
  "The operating-state search reuses bounded_coordinate_pattern_search_v0.1.0 rather than introducing a second numerical optimizer.",
  "Synthetic multi-state source recovery and repeatability are frozen in BENCH-STEER-0016 and BENCH-STEER-0017.",
  "Synthetic target curves and state weights remain software verification and are not promoted to tire, WUFR, or production-design authority."
]
