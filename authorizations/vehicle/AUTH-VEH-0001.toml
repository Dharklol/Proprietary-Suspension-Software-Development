version = "0.2.0"
authorization_id = "AUTH-VEH-0001"
status = "active_reviewed_and_frozen"
title = "Explicit vehicle operating-state exchange/provider authorization"
effective_condition = "Effective after reviewed merge of PR #29 at e0ff9b58781b6f79c0be379666723b8c8664883e. This authorization covers a source-preserving data/provider contract only and does not authorize vehicle load-transfer or equilibrium physics."
effective_merge_commit = "e0ff9b58781b6f79c0be379666723b8c8664883e"
review_record = "docs/reviews/phase1_vehicle_operating_state_provider_review.md"
review_conclusion = "PR #29 was reviewed and merged after successful CI; MOD-VEH-0001 is approved as the shared explicit vehicle/wheel state boundary while current workbook states remain evidence-only and upstream load/equilibrium physics remains separately gated."

[scope]
model_ids = ["MOD-VEH-0001"]
benchmark_ids = ["BENCH-VEH-0001"]
implementation_package = "src/pssd_vehicle"

[permitted]
items = [
  "Represent already-determined vehicle acceleration/speed states and exactly four named wheel operating records with explicit availability and provenance.",
  "Carry supplied wheel normal load, inclination/camber, tire pressure, lateral-force demand, and longitudinal-force demand without calculating missing values.",
  "Convert an explicitly declared source lateral-acceleration convention to the canonical project body convention when the conversion is recorded in source provenance.",
  "Assign front inside/outside wheel identities from an explicit left/right turn declaration.",
  "Report whether front wheel states contain the fields required by the PR #28 TireOperatingPoint contract and by later lateral tire-force-demand inversion.",
  "Construct TireOperatingPoint only when positive normal load, inclination, and pressure are all explicit upstream inputs.",
  "Reject negative source normal loads and preserve invalid source states as audit evidence rather than clipping or repairing them.",
  "Allow future reviewed QSS, telemetry, spreadsheet, LLTD, external-solver, or manual providers to emit the same state contract.",
  "Supply explicit complete wheel states to a separately reviewed bounded force-demand tire-slip inversion layer without changing this provider contract."
]

[prohibited]
items = [
  "Native longitudinal or lateral load-transfer equations.",
  "Aero-force or aero-balance calculation.",
  "LLTD, roll equilibrium, chassis compliance, pitch, or suspension-motion calculation.",
  "Tire-force, combined-slip, transient tire, or vehicle-equilibrium calculation.",
  "Inferring missing camber, tire pressure, Fy, Fx, or suspension pose from nominal setup or another wheel.",
  "Clipping a negative wheel normal load to zero or silently swapping/relabeling wheel identities.",
  "Promoting evidence_only or report_only states to positive-weight design inputs without a later reviewed source-authority decision.",
  "Treating the PR #29 Suspension Calculations 2026 1.2g states as production WUFR operating-state truth.",
  "Treating successful ingestion as validation of the upstream physics model."
]

[source_boundary]
first_source = "Suspension Calculations 2026 / Load Transfer"
first_source_revision = "sha256:505f567a132296fe90876b1202d9bd626d8b0f302ff4c6316d013d0306ab24fc"
first_source_role = "development evidence only"
source_sign_rule = "The source workbook states right turns are positive; the first fixture records explicit conversion to canonical +y-left lateral acceleration."
negative_load_rule = "The current 1.7g left-turn draft with rear-left Fz=-285.3358453 N remains rejected source-audit evidence."

[promotion_gates]
items = [
  "A separately reviewed canonical/QSS load-state generator before MOD-VEH-0001 outputs generated by that model are described as authoritative vehicle predictions.",
  "Reviewed wheel camber/inclination and tire pressure sources before PR #29 wheel-load evidence can become a complete tire operating point.",
  "Reviewed Fy demand before force-demand-to-slip-angle steering targets are used for design ranking.",
  "Reviewed suspension-pose linkage before vehicle states are described as synchronized WUFR suspension operating states.",
  "Physical/telemetry correlation appropriate to the decision risk before production or as-built claims."
]
