status = "reviewed"
title = "Source-specific R25B named-branch classification"
effective_condition = "Effective after review and merge. Authorizes a no-repair segment classification of the exact AUTH-TIRE-0002 R25B canonical runtime curves for bounded named pre-peak and demonstrated post-peak inversion."
review_record = "docs/reviews/phase4_r25b_branch_classification_authorization_review.md"
implementation_authorized = true
reviewed_at = "2026-07-31"
reviewer = "Dharklol"
upstream_authorization_id = "AUTH-TIRE-0002"

[scope]
model_ids = ["MOD-TIRE-0001"]
named_branch_selection_authorized = true
exact_source_state_named_selection_authorized = true
interpolated_state_named_selection_authorized = false
generic_all_root_inverse_remains_authorized = true
source_sample_or_knot_change_authorized = false
track_surface_correction_authorized = false
vehicle_equilibrium_authorized = false
steering_design_ranking_authorized = false
installed_as_built_authority = false
production_authority = false

[source_identity]
source_tire_id = "HOOSIER_43105_18X7.5-10_R25B"
intended_tire_id = "HOOSIER_43104_18X7.5-10_R20"
source_binary_sha1 = "475338b18b6cba21b967c7e75bdd12d9a0e3437a"
