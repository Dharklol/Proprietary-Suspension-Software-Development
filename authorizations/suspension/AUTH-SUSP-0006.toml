version = "0.2.0"
authorization_id = "AUTH-SUSP-0006"
status = "review_ready"
title = "WUFR Z-bar deformation-map source, mechanism-fixture, and reconstruction boundary authorization"
effective_condition = "Effective only after review and merge of the PR carrying this revision. The recovered source set now authorizes the named nominal front/rear Z-bar point/topology fixture, rigid linkage nominal geometry, and transport of the rocker ARB pickups with the already-reviewed MOD-SUSP-0003 rocker state. It still does not authorize the single scalar WUFR delta_b(q_L,q_R), its Jacobian, or vehicle-coordinate ARB generalized force because the recovered files do not unambiguously define how the PR50 scalar blade-tip elastic coordinate is reduced from the installed two-ended blade deformation."
review_record = "docs/reviews/phase2_wufr_zbar_map_authorization_review.md"

[scope]
model_ids = ["MOD-SUSP-0005"]
equation_ids = ["EQ-SUSP-0016", "EQ-SUSP-0018"]
benchmark_ids = ["BENCH-SUSP-0013", "BENCH-SUSP-0014"]
assumption_ids = ["ASM-SUSP-0003"]
upstream_model_ids = ["MOD-SUSP-0001", "MOD-SUSP-0002", "MOD-SUSP-0003", "MOD-SUSP-0005"]
geometry_configuration = "WUFR27_SUSPENSION_BASELINE_V0"
source_snapshot = "data_catalog/wufr27_zbar_mapping_source_v0.toml"
mechanism_fixture = "benchmarks/suspension/WUFR26_ZBAR_MECHANISM_V0.toml"
mechanism_point_fixture_authorized = true
rocker_pickup_transport_authorized = true
rigid_link_nominal_geometry_authorized = true
scalar_delta_b_map_authorized = false
jacobian_authorized = false
vehicle_coordinate_generalized_force_authorized = false
implementation_authorized = false

[permitted]
items = [
  "Use the named WUFR26_ZBAR_MECHANISM_V0 nominal design-intent fixture for front/rear blade-housing pivot, +z pivot axis, opposite blade-link joints, rocker ARB pickups, rocker pivots/axes, and nominal rigid-link geometry.",
  "Assign those point roles from the frozen cross-source topology evidence; raw exporter sketch row order remains non-authoritative.",
  "Transport each rocker ARB pickup as a point rigidly fixed to the reviewed MOD-SUSP-0003 rocker using its one-axis rocker rotation. No scalar motion ratio is needed or permitted as a substitute.",
  "Use the front/rear nominal joint-center link lengths and static blade-arm/link angles as mechanism-fixture identity checks, while preserving the separately documented physical linkage tube lengths.",
  "Use the rear +1.5604 m x translation only as the frozen historical rear-source-to-rear-OptimumK-local registration. Keep the separately reviewed 1.5624 m WUFR-27 wheelbase authority unchanged.",
  "Recover and review the exact scalar blade elastic-coordinate reduction next, then define signed delta_b(q_L,q_R) and J_delta_b only under a later authorization revision.",
  "Retain the PR50 discrete SolidWorks blade law unchanged for externally supplied delta_b, and retain historical MATLAB/Simulink/Instron/roll-stiffness values as comparison evidence only."
]

[prohibited]
items = [
  "Assuming body roll angle equals blade rotation or blade-tip deflection.",
  "Using track width, half-track, a single lever arm, or the ARB Force Calculation.pdf roll-angle approximation as governing WUFR delta_b geometry.",
  "Using left-right wheel-travel difference directly as WUFR blade deflection.",
  "Using historical scalar spring/rocker motion ratios as the ARB deformation Jacobian or rocker-point transport.",
  "Inferring connectivity, blade working direction, or linkage roles from exporter sketch row ordering alone.",
  "Back-calculating a geometry map from MATLAB reduced axle roll-stiffness values or historical reported Nm/rad axle contributions.",
  "Doubling, halving, square-root rescaling, or otherwise modifying the PR50 SolidWorks k_b or U_b because the installed blade has two arms/end linkages without an explicit source/reviewer definition of delta_b.",
  "Claiming WUFR vehicle-coordinate Q_ARB before the scalar deformation map and signed Jacobian are reviewed.",
  "Interpolating, averaging, blending, or stacking the discrete PR50 SolidWorks blade stiffness with Simulink, Instron, MATLAB, or whole-suspension roll-rate quantities."
]

[numerics]
output_coordinate = "delta_b_m remains the PR50 signed scalar blade-tip elastic coordinate; its mapping from the recovered two-ended installed mechanism is not yet authorized"
jacobian_rule = "J_delta_b must preserve q_L/q_R order and sign. Analytic derivatives are preferred; numerical derivatives must be branch-preserving and checked at two step sizes after the scalar coordinate is frozen."
closure_rule = "A later rigid mechanism solver must report linkage closure residual, branch identity, singular/near-singular conditioning, and unavailable states rather than silently repairing geometry."
reference_rule = "Nominal zero preload is a physical/reference statement; it does not permit subtracting an unexplained reconstruction residual."
rocker_point_transport = "Use MOD-SUSP-0003 rocker rotation / rocker_point_at_angle for each fixed ARB pickup."
body_roll_substitution_allowed = false
track_width_approximation_allowed = false
wheel_travel_shortcut_allowed = false
historical_motion_ratio_allowed = false
sketch_row_connectivity_allowed = false
two_arm_stiffness_rescaling_allowed = false
scalar_delta_b_map_authorized = false
jacobian_authorized = false
implementation_authorized = false

[source_boundary]
source_record = "data_catalog/wufr27_zbar_mapping_source_v0.toml"
source_audit = "docs/models/suspension/wufr_zbar_map_source_audit.md"
function_specification = "docs/models/suspension/wufr_zbar_map_function_specification.md"
current_finding = "Cross-source CAD/Simscape/manual/FDR evidence now supports a named nominal front/rear Z-bar mechanism fixture and its relationship to the reviewed rocker states. The remaining authority gap is the physical reduction from that two-ended mechanism deformation to the single PR50 scalar delta_b used by the governing SolidWorks blade stiffness/energy law."

[benchmark_gates]
required_before_scalar_map_implementation = [
  "BENCH-SUSP-0013 continues to reject vehicle-level/body-roll/track/motion-ratio/sketch-row shortcuts.",
  "BENCH-SUSP-0014 freezes the recovered nominal point/topology fixture, link identities, rocker-point transport, frame registration, and the no-rescaling boundary.",
  "A later source/reviewer revision must define the single scalar PR50 delta_b for the two-ended installed blade without inventing a stiffness/energy factor.",
  "That later implementation must verify closure residuals, branch uniqueness/continuation, common/differential behavior, and J_delta_b with independent finite differences at two step sizes."
]

[promotion_gates]
items = [
  "Merge this fixture-authority revision before implementing a WUFR numerical map.",
  "Do not treat this merge as authorization to compute WUFR vehicle-coordinate ARB generalized force.",
  "Resolve the scalar two-ended-blade-to-delta_b coordinate semantics without changing the PR50 stiffness law by inference.",
  "Only then may a separate implementation PR solve delta_b/J_delta_b and map the already-authorized PR50 blade force/energy law into generalized coordinates.",
  "Quasi-static vehicle equilibrium/load-state work remains downstream of the reviewed WUFR map."
]
