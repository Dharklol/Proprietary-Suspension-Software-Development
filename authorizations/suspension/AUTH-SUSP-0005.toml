version = "0.2.0"
authorization_id = "AUTH-SUSP-0005"
status = "review_ready"
title = "Coupled anti-roll-bar kinematics, energy, and generalized-force authorization"
effective_condition = "The generic coupled conservative ARB provider remains authorized. The WUFR constitutive correction in PR50 promotes the discrete SolidWorks FEA blade-tip stiffness settings 280/300/400/700/2300 N/mm as governing authority. It does not authorize interpolation or a WUFR Z-bar map from suspension coordinates to blade deformation. Vehicle-coordinate generalized force remains unavailable until that map and Jacobian are separately reviewed."
review_record = "docs/reviews/phase2_anti_roll_bar_authorization_review.md"

[scope]
model_ids = ["MOD-SUSP-0005"]
equation_ids = ["EQ-SUSP-0016", "EQ-SUSP-0017", "EQ-SUSP-0018"]
benchmark_ids = ["BENCH-SUSP-0011", "BENCH-SUSP-0012"]
assumption_ids = ["ASM-SUSP-0003"]
upstream_model_ids = ["MOD-SUSP-0001", "MOD-SUSP-0002", "MOD-SUSP-0003"]
geometry_configuration = "WUFR27_SUSPENSION_BASELINE_V0"
source_snapshot = "data_catalog/wufr27_anti_roll_bar_package_v0.toml"
planned_implementation_package = "src/pssd_suspension/anti_roll_bar.py; src/pssd_suspension/wufr_anti_roll_bar.py"

[permitted]
items = [
  "Represent an anti-roll bar as a bilateral elastic element that consumes a reviewed coupled deformation coordinate; a per-corner scalar wheel-rate element is not the governing architecture.",
  "Evaluate conservative anti-roll-bar action from U_ARB(s) and map it through Q_ARB=-J_s^T*a_ARB when the deformation Jacobian is reviewed and supplied.",
  "Use an explicit zero-preload reference; hidden offset repair is prohibited.",
  "Use the corrected WUFR SolidWorks FEA blade-tip stiffness settings 1..5 = 280/300/400/700/2300 N/mm, converted to SI N/m by multiplying by 1000.",
  "For an externally supplied WUFR blade-tip deformation delta_b, evaluate F_b=k_b*delta_b and U_b=0.5*k_b*delta_b^2.",
  "Treat WUFR settings as discrete categorical selections; select exactly one setting 1..5.",
  "Retain MATLAB reduced axle 2560/2270 N*m/deg, Simulink 285/309/400/724/2628 N/mm, and Instron 900/980/1320/1970/2630 N/mm only as comparison/correlation evidence.",
  "Implement an explicit no-bar branch returning zero energy/action/generalized force with provenance."
]

[prohibited]
items = [
  "Treating the anti-roll bar as two independent corner springs or using a scalar k_ARB*MR^2 wheel-rate formula as governing physics.",
  "Interpolating between WUFR blade settings without separate authorization.",
  "Averaging, blending, fitting, or stacking SolidWorks FEA, Simulink, Instron, or MATLAB stiffness sources.",
  "Using MATLAB 2560/2270 N*m/deg as governing WUFR stiffness or presenting those values as blade force/deflection stiffness.",
  "Inferring the WUFR map (q_L,q_R)->delta_b or its Jacobian from body roll, wheel travel, track width, CAD/exporter sketch row ordering, or a historical scalar motion ratio.",
  "Claiming WUFR vehicle-coordinate generalized ARB force before the Z-bar deformation map and signed Jacobian are separately reviewed.",
  "Using the 2026 spec-sheet Suspension Roll rate values 556/458 N*m/deg as ARB blade constitutive stiffness.",
  "Hidden preload, clipping, sign removal, hidden symmetry repair, force redistribution, or constitutive extrapolation beyond a reviewed source domain.",
  "Damper force, spring-force duplication, tire force, heave/roll/pitch equilibrium, load transfer, contact-mode switching, linkage/member/bearing reactions, stress/fatigue release, compliance, installed limits, packaging, installed/as-built claims, or production release."
]

[numerics]
elastic_coordinate_rule = "s_ARB is a signed source-defined scalar/vector coordinate with explicit units and q ordering. The WUFR constitutive coordinate is blade-tip deformation delta_b in meters, but delta_b(q_L,q_R) is not authorized here."
energy_rule = "U_ARB(s)>=0 and U_ARB(0)=0. WUFR blade law: U_b=0.5*k_b*delta_b^2 with k_b in N/m."
action_rule = "a_ARB=gradient_s(U_ARB). WUFR blade action F_b=k_b*delta_b. Generalized force Q_ARB=-J_s^T*a_ARB only when J_s is reviewed."
wufr_source_conversion = "SolidWorks FEA settings 280/300/400/700/2300 N/mm -> 280000/300000/400000/700000/2300000 N/m."
finite_difference_rule = "Analytic Jacobians are preferred. Numerical energy-gradient checks must use declared branch-preserving steps and report failures rather than cross invalid mechanism states."
heave_limit_rule = "For the synthetic differential benchmark, equal left/right input gives zero differential deformation and zero ARB energy/action. This benchmark does not define WUFR blade motion."
roll_limit_rule = "For the synthetic differential benchmark, equal-and-opposite inputs give nonzero deformation and equal/opposite generalized reactions. This benchmark does not authorize a WUFR track-width/body-roll approximation."
hidden_clipping_allowed = false
absolute_ratio_allowed = false
stiffness_inference_allowed = false
reduced_stiffness_double_count_allowed = false
interpolation_allowed = false

[source_boundary]
primary_literature = [
  "Guiggiani (2022), The Science of Vehicle Dynamics: coupled conservative mechanics/virtual-work architecture only, not WUFR-specific parameters.",
  "Milliken & Milliken (1995/1997), Race Car Vehicle Dynamics: anti-roll bars as left/right-coupled suspension elastic elements, not WUFR-specific stiffness."
]
wufr27_package = "data_catalog/wufr27_anti_roll_bar_package_v0.toml"
reviewed_current_setup = "Reviewer/user correction on 2026-07-26: governing WUFR values are the SolidWorks FEA blade-tip stiffness settings from Google Sheet ARB FEA vs Simulink: 280/300/400/700/2300 N/mm. MATLAB, Simulink, and Instron are comparison-only."
historical_calculation_boundary = "Weight_transfer_sensitivity.m 2560/2270 N*m/deg is demoted to comparison-only reduced axle evidence and is not converted into or stacked with the blade-tip law."
remaining_wufr_gap = "The Z-bar geometry map (q_L,q_R)->delta_b and its Jacobian are not authorized or implemented; installed/as-built validation also remains unavailable."

[failure_behavior]
codes = [
  "missing_bilateral_geometry_authority",
  "mechanism_closure_failure",
  "branch_ambiguity",
  "missing_zero_preload_reference",
  "missing_stiffness_authority",
  "constitutive_domain_exceeded",
  "jacobian_unavailable",
  "source_configuration_mismatch"
]
rule = "Return structured unavailable/failure results. Do not repair missing WUFR geometry by body-roll/track-width approximation, symmetry, scalar wheel-rate substitution, interpolation, clipping, or source averaging."

[benchmark_gates]
required_before_implementation_merge = [
  "BENCH-SUSP-0011 verifies the generic synthetic bilateral conservative mechanics and generalized-force energy gradient.",
  "BENCH-SUSP-0012 verifies exact WUFR SolidWorks FEA settings 280/300/400/700/2300 N/mm and SI conversion.",
  "BENCH-SUSP-0012 freezes the 1 mm hand case: 280/300/400/700/2300 N and 0.140/0.150/0.200/0.350/1.150 J.",
  "BENCH-SUSP-0012 verifies no interpolation, comparison-only MATLAB/Simulink/Instron data, and no vehicle generalized force without the WUFR geometry map."
]

[promotion_gates]
items = [
  "A separate implementation PR passes BENCH-SUSP-0011 and BENCH-SUSP-0012 before MOD-SUSP-0005 is considered implemented.",
  "The WUFR Z-bar deformation map and Jacobian require separate review before vehicle-coordinate ARB reactions or equilibrium consume the blade law.",
  "Any replacement constitutive evidence must be reviewed and must replace rather than silently average/stack with the governing SolidWorks FEA law.",
  "Quasi-static body equilibrium remains separately authorized and must consume reviewed force providers rather than reproduce their equations."
]
