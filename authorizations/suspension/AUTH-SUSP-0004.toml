version = "0.1.1"
authorization_id = "AUTH-SUSP-0004"
status = "review_ready"
title = "Conservative coil-spring force, energy, and generalized-force authorization"
effective_condition = "Effective only after review and merge of the PR carrying this authorization. This authorization permits a bounded conservative coil-spring provider composed with the reviewed suspension/actuation state. It defines explicit spring compression/preload coordinates, conservative force and stored energy, tangent stiffness, and signed generalized-force mapping through virtual work. For WUFR-27 it also permits the explicitly labeled team assumptions in ASM-SUSP-0002 for the zero-preload/full-extension reference and the rear 30-to-36 N/mm linear-progressive tangent-rate law. It does not authorize damper force, ARB force, wheel-rate shortcuts as governing physics, vehicle equilibrium, installed travel/stops, or production claims."
review_record = "docs/reviews/phase2_spring_force_authorization_review.md"

[scope]
model_ids = ["MOD-SUSP-0004"]
equation_ids = ["EQ-SUSP-0013", "EQ-SUSP-0014", "EQ-SUSP-0015"]
benchmark_ids = ["BENCH-SUSP-0009", "BENCH-SUSP-0010"]
assumption_ids = ["ASM-SUSP-0002"]
upstream_model_ids = ["MOD-SUSP-0003"]
geometry_configuration = "WUFR27_SUSPENSION_BASELINE_V0"
source_snapshot = "data_catalog/wufr27_spring_package_v0.toml"
planned_implementation_package = "src/pssd_suspension/spring_force.py"

[permitted]
items = [
  "Define spring compression x_s as a positive-compression coordinate from an explicitly authorized free length and current spring-seat separation, or from an algebraically equivalent explicit reference/preload relation.",
  "Represent intentional spring preload as an explicit nonnegative setup compression/reference parameter. For WUFR-27 under ASM-SUSP-0002, zero intentional preload is modeled as x_s=0 at the KW piggyback full-extension eye-to-eye reference L_d=185.7 mm; current compression is x_s=0.1857-L_d in SI units.",
  "Use the reviewed WUFR suspension-geometry inboard damper placement line as design-intent evidence for current eye-to-eye length. The exported nominal line lengths are 164.599347 mm front and 164.610539 mm rear and independently agree with the reviewed MOD-SUSP-0003 nominal 164.600/164.611 mm actuation fixture.",
  "Evaluate a conservative spring law F_s=f_s(x_s) with compression-positive force magnitude and define stored energy U_s(x_s)=integral_0^x_s F_s(xi) dxi and local tangent stiffness k_t=dF_s/dx_s.",
  "Use an exact linear law when the source authorizes a constant spring rate. For an affine tangent-rate law k_t(x_s)=k_0+a*x_s, integrate the tangent rate so F_s=k_0*x_s+0.5*a*x_s^2 and U_s=0.5*k_0*x_s^2+(a/6)*x_s^3; do not substitute F_s=k_t*x_s.",
  "Map spring energy into signed generalized force with Q_s=-partial U_s/partial q. When x_s=x_pre+L_ref-L_d, this becomes Q_s=F_s partial L_d/partial q. For the single physical wheel coordinate, Q_delta_z=F_s rho_dw using the signed MOD-SUSP-0003 rho_dw.",
  "Expose force, compression, stored energy, tangent stiffness, generalized force/Jacobian diagnostics, source/configuration identity, assumption identity, and explicit availability/failure state without replacing them by an ambiguous scalar wheel rate.",
  "Use the reviewer-declared WUFR-27 36 N/mm front spring as a linear design-intent constitutive source.",
  "Until physical spring testing replaces it, use ASM-SUSP-0002 for the WUFR-27 rear spring: tangent rate rises linearly from 30 N/mm at x_s=0 to 36 N/mm at x_s=57 mm. The 57 mm span is an explicit team modeling assumption tied to the usable direct-coilover damper compression range, not a KW spring test result or installed wheel-travel claim."
]

[prohibited]
items = [
  "Treating the WUFR rear progressive spring as a constant 30, 33, or 36 N/mm spring, averaging endpoint rates into a constant spring, or calculating force as instantaneous tangent rate times compression.",
  "Presenting the assumed 30-to-36 N/mm over 57 mm rear tangent-rate progression as KW-published spring data, measured force-deflection data, installed/as-built validation, or a physical wheel-travel limit.",
  "Using a nominal coilover eye-to-eye length as a zero-load reference without the explicit ASM-SUSP-0002 full-extension/zero-preload mapping, or silently carrying that WUFR mapping into another damper/perch configuration.",
  "Silently clipping negative calculated compression to zero. A coil spring that would require tension leaves the authorized seated-spring contact mode and must return spring_unseated or equivalent explicit failure/unavailable state.",
  "Extrapolating a nonlinear/table/assumed progressive law beyond its reviewed compression domain, crossing an upstream actuation branch failure, or hiding derivative sign through absolute values.",
  "Damper velocity force, hysteresis, gas force, seal friction, bump-stop/top-out force, tender/helper-spring behavior, anti-roll-bar behavior, tire stiffness, or energy dissipation.",
  "Using k_s*rho^2 or any scalar motion-ratio wheel-rate expression as the governing force architecture. Such a quantity may later be reported only as a local derived diagnostic with its exact assumptions and nonlinear geometric-stiffness terms identified.",
  "Using the reported ride-height shock-pot value in force calculations until its unit, zero, span, sign, and mapping to eye-to-eye length are calibrated and reviewed.",
  "Vehicle heave/roll/pitch equilibrium, wheel-load generation, load transfer, contact-mode switching, linkage/member/bearing reactions, stress/FEA, compliance, installed/as-built limits, or production release."
]

[numerics]
spring_compression_coordinate = "x_s_m >= 0 for the authorized seated-spring mode; positive means spring compression from its zero-load/free-length reference."
reference_mapping = "Preferred physical definition x_s=L_free-L_seat. For WUFR-27/ASM-SUSP-0002 use x_s=0.1857-L_d [m], with x_s=0 at the 185.7 mm KW piggyback full-extension reference and fixed spring-seat offsets."
force_sign = "F_s_N is a nonnegative compression-force magnitude for this coil-spring class; force direction in vehicle coordinates is created by the signed coordinate Jacobian, not by discarding Jacobian sign."
stored_energy_rule = "U_s(x_s)=integral from 0 to x_s of F_s(xi) dxi, with U_s(0)=0 for the zero-load seated reference."
tangent_rule = "k_t=dF_s/dx_s at the current state. WUFR rear assumption: k_t=30000+(6000/0.057)*x_s N/m for 0<=x_s<=0.057 m."
rear_assumed_force_rule = "F_s=30000*x_s+0.5*(6000/0.057)*x_s^2 N for 0<=x_s<=0.057 m."
rear_assumed_energy_rule = "U_s=0.5*30000*x_s^2+(1/6)*(6000/0.057)*x_s^3 J for 0<=x_s<=0.057 m."
generalized_force_rule = "Q_s=-partial U_s/partial q=-F_s*partial x_s/partial q. For x_s=x_pre+L_ref-L_d, Q_s=F_s*partial L_d/partial q; for q=delta_z_wc_body, Q_s=F_s*rho_dw."
finite_difference_rule = "Analytic derivatives are preferred. Numerical generalized-force/energy checks must use declared branch-preserving steps, compare at least two step sizes, and never cross an unavailable spring or actuation state."
hidden_clipping_allowed = false
constitutive_extrapolation_allowed = false
progressive_endpoint_averaging_allowed = false
scalar_motion_ratio_substitution_allowed = false

[source_boundary]
primary_literature = [
  "Guiggiani (2022), The Science of Vehicle Dynamics: suspension elastic forces are constitutive elements and real springs may be nonlinear/hardening; used for the separation of kinematics, constitutive laws, and equilibrium rather than any WUFR-specific spring parameter.",
  "Dixon, The Shock Absorber Handbook, 2nd ed.: mechanical spring restoring force and energy concepts; used only for generic conservative spring behavior, not WUFR-specific rates or installation."
]
wufr27_package = "data_catalog/wufr27_spring_package_v0.toml"
reviewed_current_setup = "Reviewer/user confirmation on 2026-07-26: KW V5 Racing Formula Student piggyback dampers; front 36 N/mm linear spring; rear 30-to-36 N/mm linear-progressive spring; 100 mm spring free length; zero intentional preload; no tender/helper spring; carried into WUFR-27. Reviewer further directed the untested rear transition to be modeled linearly between endpoints and identified the inboard suspension-geometry line as the CAD piggyback-damper placement line."
kw_attachment = "kw-v5racing-formula-student-int-technologytesting.pdf, reviewer attachment SHA-256 647b7b451612174852293b0bd65d193452991c6a3c697a242c07b04860cea36c; establishes piggyback full-extension eye-to-eye dimension 185.7 mm and damper travel 57 mm, but no measured spring-rate progression."
geometry_evidence = "SU-00001-AA 2026 SUSPENSION GEOMETRY.SLDPRT Box file 1943897977651 version 2546941960247 SHA-1 2cfb771f296961be0857161f7b57a6c178180d7a plus reviewer exporter ZIP SHA-256 30bf10a4a9c6097fc32f897d0d16a16e1bee802c3bccf5481f0fd253f2fd8085; reviewed damper placement-line coordinates are frozen in WUFR27_SPRING_PACKAGE_V0."
historical_team_sources = "WUFR-26 shock BOM, OptimumK setup, and inboard calculator remain corroborating/historical evidence and do not override the reviewer-declared current spring package or ASM-SUSP-0002."
remaining_wufr_gap = "Physical rear spring test data and calibrated shock-pot reference data remain unavailable. ASM-SUSP-0002 deliberately fills the first gap only for prototype modeling and must remain labeled as an assumption."

[failure_behavior]
codes = [
  "missing_spring_parameter_authority",
  "missing_reference_length",
  "spring_unseated",
  "constitutive_domain_exceeded",
  "invalid_energy_law",
  "upstream_actuation_failure",
  "jacobian_unavailable"
]
rule = "Return a structured unavailable/failure result with the original source/configuration/assumption context. Do not repair missing spring data by clipping, hidden extrapolation, endpoint averaging, scalar MR substitution, or unlabeled assumptions."

[benchmark_gates]
required_before_implementation_merge = [
  "BENCH-SUSP-0009 analytically verifies linear spring compression, force, stored energy, tangent stiffness, signed generalized force, energy finite-difference consistency, explicit preload behavior, spring-unseated failure, and a synthetic bounded nonlinear/table case without extrapolation.",
  "BENCH-SUSP-0010 verifies the WUFR package and ASM-SUSP-0002: front 36 N/mm linear law; 185.7 mm full-extension zero-preload reference; nominal front/rear CAD eye-to-eye lengths and resulting spring compressions; rear affine tangent-rate progression 30-to-36 N/mm over 57 mm with analytically integrated force/energy; and explicit assumption provenance.",
  "Implementation composes the signed MOD-SUSP-0003 actuation derivative rather than historical OptimumK Motion Ratio Heave or a scalar MR/IR shortcut.",
  "No damper, ARB, tire, equilibrium, linkage-force, installed-limit, or production output is reachable through the spring provider."
]

[promotion_gates]
items = [
  "This authorization is reviewed and merged before spring-force implementation begins.",
  "A separate implementation PR passes BENCH-SUSP-0009 and BENCH-SUSP-0010 plus structured source/domain/failure tests before MOD-SUSP-0004 is considered implemented.",
  "Replace the ASM-SUSP-0002 rear progressive law with measured spring force-deflection or tangent-rate data when available; re-run and re-correlate dependent results.",
  "Replace or validate the zero-preload/full-extension mapping with perch/seat metrology or calibrated shock-pot data when available; do not use the raw reported shock-pot reading before its semantics are frozen.",
  "ARB energy/generalized force remains a separate coupled-left/right authorization.",
  "Quasi-static body equilibrium remains separately authorized and must consume this provider rather than reproduce its spring equations."
]
