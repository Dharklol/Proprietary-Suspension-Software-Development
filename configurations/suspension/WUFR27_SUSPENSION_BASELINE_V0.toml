version = "0.1.11"
configuration_id = "WUFR27_SUSPENSION_BASELINE_V0"
status = "active_design_intent_baseline_not_as_built"
vehicle_revision = "WUFR-27"
purpose = "WUFR-27 suspension R&D baseline inheriting the WUFR-26 final OptimumK nominal suspension geometry without a geometry change. This configuration is for source-grounded kinematics development, regression, visualization, force-coordinate composition, conservative spring-force modeling, reduced anti-roll-bar force modeling, and later correlation; it is not installed/as-built authority."

[authority]
model_id = "MOD-SUSP-0001"
wheel_reference_model_id = "MOD-SUSP-0002"
actuation_model_id = "MOD-SUSP-0003"
spring_force_model_id = "MOD-SUSP-0004"
anti_roll_bar_model_id = "MOD-SUSP-0005"
force_coordinate_model_id = "MOD-VEH-0003"
actuation_authorization_state = "prototype_authorized_after_AUTH-SUSP-0003_PR43_merge; implementation_merged_in_PR44"
spring_force_authorization_state = "prototype_authorized_after_AUTH-SUSP-0004_PR47_merge; implementation_merged_in_PR48"
anti_roll_bar_authorization_state = "prototype_authorized_after_AUTH-SUSP-0005_PR49_merge; reduced scalar elastic provider implemented_in_PR50_pending_review"
force_coordinate_authorization_state = "prototype_authorized_after_AUTH-VEH-0003_PR45_merge; implementation_merged_in_PR46"
source_snapshot = "data_catalog/wufr26_optimumk_suspension_hardpoints_v0.toml"
source_snapshot_id = "WUFR26_OPTIMUMK_SUSPENSION_HARDPOINTS_V0"
source_catalog_id = "CAT-SUSP-GEO-0001"
spring_package_snapshot = "data_catalog/wufr27_spring_package_v0.toml"
spring_assumption_id = "ASM-SUSP-0002"
anti_roll_bar_package_snapshot = "data_catalog/wufr27_anti_roll_bar_package_v0.toml"
anti_roll_bar_assumption_id = "ASM-SUSP-0003"
geometry_change_intent = "none_for_WUFR27_current_R&D_baseline"
canonical_orientation = "+x forward, +y vehicle left, +z upward; right-handed"

[inheritance]
rule = "Load the source snapshot through the explicit OptimumK-to-canonical adapter. Do not duplicate, mirror, translate, or revise hardpoints in this configuration. Any future geometry change requires a new configuration ID and provenance."
reviewed_statement = "Reviewer/user confirmation on 2026-07-25: WUFR-27 will not have different suspension geometry from WUFR-26. Reviewer/user confirmations on 2026-07-26 additionally carry the 2025/current Z-bar anti-roll-bar design basis into WUFR-27, specify zero ARB preload, and select the MATLAB 2560/2270 N*m/deg reduced effective axle ARB stiffness values under ASM-SUSP-0003."

[vehicle_context]
wheelbase_m = 1.5624
wheelbase_source = "Team/reviewer confirmation during PR39: OptimumK Reference Distance 1562.4 mm is the WUFR wheelbase."
wheelbase_frame_rule = "Wheelbase identity alone did not authorize the common vehicle transform; the separately reviewed PR46 WUFR whole-vehicle frame adapter now freezes explicit CAD axle/track/contact placement."
whole_vehicle_body_origin_status = "reviewed_design_intent_driver_no_fuel_reference_in_WUFR26_WHOLE_VEHICLE_FRAME_V0_not_installed_metrology"
cg_relative_axle_placement_status = "reviewed_design_intent_in_WUFR26_WHOLE_VEHICLE_FRAME_V0"
contact_reference_placement_status = "reviewed_flat_rigid_model_references_in_WUFR26_WHOLE_VEHICLE_FRAME_V0_not_physical_tire_patch_metrology"

[front_steering_boundary]
rule = "Front suspension geometry retains the OptimumK CHAS_TiePnt/UPRI_TiePnt values as source evidence, but MOD-STEER-0001 continues to use the later steering-FDR tie-rod coordinates. MOD-SUSP-0001/MOD-SUSP-0002 output the unresolved-steering upright/wheel reference and leave tie-rod-induced steering rotation to the steering evaluator."
steering_pose_contract = "upright_reference_pose_excludes_tie_rod_steering_rotation"

[coordinate_boundary]
rule = "Front and rear suspension provider coordinates retain their reviewed source-local semantics. Whole-vehicle placement is supplied only through the explicit WUFR26_WHOLE_VEHICLE_FRAME_V0 adapter merged in PR46; no consumer may reconstruct that transform from wheelbase or symmetry alone."
force_coordinate_rule = "MOD-VEH-0003 provides explicit design-intent body/road placement and mechanics primitives. It remains separate from constitutive spring/ARB/tire forces and equilibrium."

[wheel_boundary]
rule = "Static camber, static toe, half-track, offsets, rim/tire diameter, and tire width remain source setup values. Under AUTH-SUSP-0002, MOD-SUSP-0002 may construct the nominal wheel center and wheel-plane reference only for the frozen zero-longitudinal/lateral/vertical-offset OptimumK setup and transport them rigidly with the reviewed upright state. Nonzero offset semantics, physical tire footprint/contact-patch construction, tire deflection, and installed wheel/bearing metrology remain unavailable."
source_profile = "benchmarks/suspension/WUFR26_OPTIMUMK_WHEEL_REFERENCE_V0.toml"
physical_state_coordinate = "delta_z_wc_body_m = current body-frame wheel-center z minus nominal body-frame wheel-center z; positive upward"

[actuation_boundary]
rule = "AUTH-SUSP-0003 / PR43 authorizes and PR44 implements only ideal rigid front-upper-arm/rear-lower-arm push/pull attachment transport, one-axis rocker closure, ideal coilover eye-to-eye displacement, and the explicitly signed local derivative rho_dw=d(delta_L_d)/d(delta_z_wc_body). Historical OptimumK Motion Ratio Heave remains a separately named source quantity."
source_profile = "benchmarks/suspension/WUFR26_OPTIMUMK_ACTUATION_V0.toml"
coilover_displacement_coordinate = "delta_L_d_m = current ideal coilover eye-to-eye length minus nominal length; positive extension"
local_ratio_coordinate = "rho_dw = d(delta_L_d_m)/d(delta_z_wc_body_m); sign retained"
installed_boundary = "The OptimumK +/-25.4 mm heave sweep is verification evidence only, not installed bump/droop, damper stroke, articulation, or packaging authority."

[spring_boundary]
rule = "AUTH-SUSP-0004 / PR47 authorizes and PR48 implements the conservative coil-spring compression/constitutive/energy/generalized-force provider. Spring generalized force comes from Q_s=-partial U_s/partial q and the signed actuation Jacobian; scalar MR wheel-rate formulas are not governing force physics."
source_profile = "data_catalog/wufr27_spring_package_v0.toml"
assumption_id = "ASM-SUSP-0002"
current_damper = "KW V5 Racing Formula Student 4-way adjustable piggyback"
spring_free_length_m = 0.100
intentional_preload = "zero"
tender_or_helper_spring = "none"
front_spring = "36 N/mm linear"
rear_spring = "30 to 36 N/mm linear-progressive; under ASM-SUSP-0002 tangent rate is assumed linear with spring compression from 30 N/mm at x_s=0 to 36 N/mm at x_s=57 mm until physical spring testing replaces it"
reference_mapping_status = "Under ASM-SUSP-0002 the zero-preload direct-coilover reference is x_s=0 at KW piggyback full extension L_d=185.7 mm, so x_s=0.1857-L_d. Reviewer-identified CAD damper placement lines give nominal L_d=164.599347 mm front and 164.610539 mm rear. This is design-intent assumption authority, not installed metrology."
nominal_model_values = "front x_s=21.100653 mm and F_s=759.624 N; rear x_s=21.089461 mm, k_t=32.2199 N/mm and F_s=656.093 N under the assumed affine tangent-rate law; not solved corner loads"
benchmark_result = "benchmarks/suspension/suspension_spring_force_result_v0.1.0.toml"
shockpot_boundary = "Reviewer reported ride-height shock-pot value '44m'; retain only as uncalibrated correlation evidence until unit/zero/span/sign and eye-to-eye mapping are frozen."
prohibited_shortcuts = "No constant rear 30/33/36 N/mm substitution, no endpoint averaging, no F_s=k_t*x_s for the progressive law, no negative-compression clipping, no historical Motion Ratio Heave substitution, and no presenting ASM-SUSP-0002 as KW test data or installed travel authority."

[anti_roll_bar_boundary]
rule = "AUTH-SUSP-0005 / PR49 authorizes and PR50 implements a coupled/source-defined conservative anti-roll-bar provider. The governing path is signed elastic coordinate s_ARB and J_s, then U_ARB/action/tangent, then Q_ARB=-J_s^T*a_ARB. Scalar ARB wheel-rate or two independent corner springs are not governing physics."
source_profile = "data_catalog/wufr27_anti_roll_bar_package_v0.toml"
assumption_id = "ASM-SUSP-0003"
architecture = "Z-bar / blade concept carried from 2025/current populated WUFR-26 design intent into WUFR-27; first force implementation is a reduced axle-level law rather than a detailed blade/link reconstruction"
intentional_preload = "zero"
geometry_status = "populated carryover design-intent evidence exists in WUFR-26 suspension and front/rear ARB CAD/drawings; direct WUFR-27 A0303/A0305 assembly files are identical-file placeholders at audit time"
constitutive_stiffness_status = "reviewer-selected reduced effective axle ARB roll stiffness: front 2560 N*m/deg, rear 2270 N*m/deg; explicit SI conversion to 146677.19555349075 and 130061.41949469688 N*m/rad"
constitutive_semantics = "effective axle ARB roll stiffness for a source-supplied signed phi_ARB coordinate, not blade torsional stiffness; no additional Z-bar/link/motion-ratio stiffness reduction is allowed"
state_mapping_status = "PR50 does not infer phi_ARB from body roll, wheel travel, track, or CAD sketch row ordering. The reduced provider accepts an externally reviewed elastic coordinate and signed Jacobian; source-specific vehicle/suspension-to-phi_ARB mapping remains downstream."
assembly_state_note = "WUFR-26 FSA export has front ARB active and rear top-level ARB suppressed; configuration evidence only, not universal WUFR-27 installed-presence authority. Provider enablement must be explicit."
comparison_boundaries = "Spec-sheet suspension roll rates 556/458 N*m/deg remain whole-suspension comparison values. 2025 SolidWorks files remain detailed component-law recovery evidence. Reviewer reports Instron comes somewhat close but exact data is not frozen; do not average or fit it into the governing law."
benchmark_result = "benchmarks/suspension/suspension_anti_roll_bar_result_v0.1.0.toml"
implementation_boundary = "PR50 implements generic scalar conservative ARB mechanics, explicit no-bar state, source/config/unit checks, energy-gradient verification, and the WUFR reduced 2560/2270 effective axle roll-stiffness adapter. Detailed blade/system stiffness and exact WUFR mechanism reconstruction are replacement higher-fidelity gates, not additive terms."

[force_coordinate_boundary]
rule = "AUTH-VEH-0003 / PR45 authorizes and PR46 implements explicit body/road point transport, point-force/free-couple wrench assembly, virtual-work generalized-force mapping, flat-road rigid four-contact classification, and the reviewed WUFR design-intent frame adapter. It does not authorize constitutive force laws or equilibrium."
generalized_coordinate_order = ["z_s_m", "phi_rad", "theta_rad"]
first_contact_model = "flat rigid road; vertically rigid tires; all four contacts active; negative normal reaction is wheel_lift/contact_mode_invalid and is never clipped"
first_linkage_fidelity = "downstream-only ideal pin-jointed two-force members and rigid bodies/nodes; not linkage-force, stress, FEA, or installed authority in this configuration"
whole_vehicle_use_status = "available_for_reviewed_design_intent_frame/contact composition_only_not_installed_as_built"

[uses]
permitted = [
  "MOD-SUSP-0001 rigid kinematics development and verification",
  "MOD-SUSP-0002 source-bounded wheel-reference and physical-state development and verification",
  "MOD-SUSP-0003 source-bounded ideal actuation development, verification, and downstream R&D state provision within AUTH-SUSP-0003",
  "MOD-SUSP-0004 conservative spring force/energy/tangent/generalized-force prototype under AUTH-SUSP-0004 with explicit ASM-SUSP-0002 provenance",
  "MOD-SUSP-0005 conservative coupled/reduced ARB energy/action/tangent/generalized-force prototype under AUTH-SUSP-0005 with explicit ASM-SUSP-0003 provenance",
  "MOD-VEH-0003 reviewed design-intent whole-vehicle force-coordinate composition and mechanics benchmarks",
  "source-to-canonical transform regression",
  "suspension kinematics validation against OptimumK",
  "provider-neutral steering suspension-pose generation from reviewed unresolved-steering states",
  "future 3D scene generation after solved states exist",
  "PDR/FDR R&D documentation"
]
prohibited = [
  "installed or as-built hardpoint, wheel-center, bearing-axis, alignment, rocker, damper, spring, anti-roll-bar, actuation, contact, or force-coordinate claims",
  "physical tolerance or compliance claims",
  "automatic replacement of steering-FDR front tie-rod geometry",
  "generalization of the zero-offset wheel-center construction to nonzero OptimumK wheel offsets",
  "generic physical contact-patch/tire-envelope or tire-deflection inference",
  "unlabeled modification of ASM-SUSP-0002/ASM-SUSP-0003 or promotion of spring/ARB models to installed/production authority",
  "damper force, wheel damping, gas force, stops, or ARB physics outside the explicitly authorized reduced K_phi law",
  "using spec-sheet suspension roll rates, another historical literal, blade material/dimensions, or unfrozen Instron values as WUFR ARB stiffness",
  "presenting the 2560/2270 reduced K_phi values as blade/component stiffness or applying an additional motion-ratio reduction to them",
  "inferring WUFR phi_ARB directly from body roll, wheel travel, track, or exporter sketch order without a reviewed state/mechanism adapter",
  "vehicle equilibrium, wheel-load generation, or load-transfer calculation under the current force-coordinate/spring/ARB authorizations",
  "negative normal-reaction clipping, negative spring-compression clipping, hidden ARB preload offsets, or hidden contact-mode switching",
  "linkage/member/bearing loads, blade stress/FEA/fatigue, or structural release under the current force-coordinate/spring/ARB authorizations",
  "treating the source verification heave range or vendor damper travel as installed suspension/wheel travel; the 57 mm value may only bound the explicit ASM-SUSP-0002 rear spring constitutive assumption",
  "reconstructing whole-vehicle origin placement from wheelbase alone instead of the reviewed frame adapter",
  "production optimization or geometry release"
]
