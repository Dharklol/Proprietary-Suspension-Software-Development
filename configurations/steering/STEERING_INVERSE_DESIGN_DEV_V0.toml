version = "0.4.0"
requirement_set_id = "STEERING_INVERSE_DESIGN_DEV_V0"
status = "active_for_AUTH_STEER_0002_operating_state_optimizer"
baseline_configuration_id = "WUFR27_STEERING_BASELINE_V0"
evaluator_model_id = "MOD-STEER-0001"
optimizer_model_id = "MOD-STEER-0002"
solver_mode = "constrained_inverse_design_development"
optimizer_authorized_after_merge = true
purpose = "Development requirement set for testing the reusable steering inverse-design workflow. It uses WUFR-26/27 geometry and response as grounding data but does not authorize redesign of WUFR-27 or production selection for WUFR-28."

[role_vocabulary]
allowed = ["evidence_only", "fixed_parameter", "bounded_design_variable", "discrete_option", "hard_equality", "hard_lower_bound", "hard_upper_bound", "acceptable_band", "target_value", "target_curve", "derived_output", "report_only"]
rule = "Roles are resolved from this requirement set. Code must not permanently encode a geometry field as fixed or variable."

[symmetry]
mode = "exact_reflection"
independent_sides_enabled = false
future_rule = "A later requirement set may enable independent sides only with explicit rationale and reviewed side-specific bounds."

[development_bounds]
authority = "mathematical_sanity_and_workflow_development_only"
packaging_authority = false
manufacturing_authority = false
rule = "These broad bounds support workflow testing and may generate physically unusable concepts. Hardware-feasible ranking remains prohibited until reviewed packaging and manufacturing constraints are supplied."

[outer_pickup_local_frame]
authority = "Development-only nominal upright-local coordinate frame for workflow testing; not a measured steering-arm surface or packaging envelope."
origin_rule = "Use the baseline left outer tie-rod joint as the local-frame origin; generate the right point by exact body-y reflection."
u_direction = [1.0, 0.0, 0.0]
v_direction = [0.0, 0.0, 1.0]
depth_direction = [0.0, -1.0, 0.0]
orthonormal_tolerance = 1.0e-12
basis_definition = "At the nominal pose, +u is body +x, +v is body +z, and +depth is inward on the left side. u cross v equals depth. A later reviewed upright/CAD adapter may supply a different frame without changing generator roles."

[[variables]]
id = "rack_longitudinal_offset"
role = "bounded_design_variable"
unit = "m"
reference = 0.0
minimum = -0.15
maximum = 0.15
coordinate_definition = "Body-frame +x offset applied to the baseline rack axis origin and both rack inner joints."

[[variables]]
id = "rack_vertical_offset"
role = "bounded_design_variable"
unit = "m"
reference = 0.0
minimum = -0.15
maximum = 0.15
coordinate_definition = "Body-frame +z offset applied to the baseline rack axis origin and both rack inner joints."

[[variables]]
id = "rack_inner_joint_half_spacing"
role = "bounded_design_variable"
unit = "m"
reference = 0.22098
minimum = 0.05
maximum = 0.45
coordinate_definition = "Positive half-spacing from the vehicle center plane along the reviewed rack axis; right side is generated by reflection."

[[variables]]
id = "outer_pickup_local_u_offset"
role = "bounded_design_variable"
unit = "m"
reference = 0.0
minimum = -0.08
maximum = 0.08
coordinate_definition = "Offset in the explicit nominal upright-local steering-arm coordinate u."

[[variables]]
id = "outer_pickup_local_v_offset"
role = "bounded_design_variable"
unit = "m"
reference = 0.0
minimum = -0.08
maximum = 0.08
coordinate_definition = "Offset in the explicit nominal upright-local steering-arm coordinate v."

[[variables]]
id = "outer_pickup_local_depth_offset"
role = "bounded_design_variable"
unit = "m"
reference = 0.0
minimum = -0.005
maximum = 0.005
coordinate_definition = "Tightly bounded offset along the explicit local depth direction. A study may change this role to fixed_parameter without changing the generator."

[[items]]
id = "wheel_centers"
role = "fixed_parameter"
source = "WUFR27_STEERING_BASELINE_V0 inheritance"

[[items]]
id = "steering_axis_lines"
role = "fixed_parameter"
source = "WUFR27_STEERING_BASELINE_V0 inheritance"

[[items]]
id = "upright_reference_poses"
role = "fixed_parameter"
source = "WUFR27_STEERING_BASELINE_V0 inheritance before an explicit suspension-pose provider is applied"

[[items]]
id = "suspension_hardpoints"
role = "fixed_parameter"
source = "WUFR27_STEERING_BASELINE_V0 inheritance; no native suspension solver is implemented in this requirement set"

[[items]]
id = "rack_axis_direction"
role = "fixed_parameter"
source = "WUFR27_STEERING_BASELINE_V0 inheritance"

[[items]]
id = "static_alignment"
role = "fixed_parameter"
source = "WUFR27_STEERING_BASELINE_V0 inheritance"
restriction = "Static toe and camber remain separate from incremental steering response and supply the nominal wheel-plane reference used by the target/pose interfaces."

[[items]]
id = "left_tie_rod_length"
role = "derived_output"
source = "Reference-state left inner and outer joint-center distance"

[[items]]
id = "right_tie_rod_length"
role = "derived_output"
source = "Reflected reference-state right inner and outer joint-center distance"

[[constraints]]
id = "tie_rod_closure"
role = "hard_equality"
source = "EQ-STEER-0002 via MOD-STEER-0001"

[[constraints]]
id = "mechanism_branch_continuity"
role = "hard_equality"
source = "MOD-STEER-0001 branch and continuation diagnostics"

[[constraints]]
id = "no_singularity_crossing"
role = "hard_equality"
source = "MOD-STEER-0001 closure-Jacobian diagnostics"

[[constraints]]
id = "rack_input_domain"
role = "hard_lower_bound"
source = "WUFR27_STEERING_BASELINE_V0 inherited nominal design-study domain"
paired_upper_bound = "rack_input_domain_upper"

[[constraints]]
id = "rack_input_domain_upper"
role = "hard_upper_bound"
source = "WUFR27_STEERING_BASELINE_V0 inherited nominal design-study domain"

[[constraints]]
id = "monotonic_wheel_response"
role = "hard_equality"
source = "Derived wheel-heading map or explicit operating-state target contract"
restriction = "Required only where the loaded target contract explicitly enables it; tolerance is target-provider data."

[target_provider]
default_target_id = "WUFR26_27_HISTORICAL_RESPONSE_REGRESSION_V0"
default_target_role = "target_curve"
default_fixture = "benchmarks/steering/WUFR26_27_HISTORICAL_RESPONSE_REGRESSION_V0.toml"
synthetic_recovery_fixture = "benchmarks/steering/STEERING_SYNTHETIC_RECOVERY_V0.toml"
synthetic_operating_state_fixture = "benchmarks/steering/STEERING_SYNTHETIC_OPERATING_TARGETS_V0.toml"
source = "WUFR26-DESMOS-WHEEL-FITS-V0 and WUFR26-STEER-LEVEL-E-TEST3-V0 with the reviewed canonical convention adapter; state-indexed target studies use separate explicit OperatingStateTargetSet authority."
authority = "development regression and audit grounding only"
no_extrapolation = true
unlisted_operating_state_role = "report_only"
operating_state_rule = "Non-nominal states receive objective terms only through an explicit state target definition. No nominal or historical target is silently inherited by a suspension pose."
alternative_modes = [
  "exact_geometric_ackermann_reference",
  "user_supplied_left_right_heading_curves",
  "inside_outside_relation_curve",
  "local_or_secant_ratio_band",
  "turning_capability_requirement",
  "explicit_operating_state_heading_targets",
  "future_external_tire_informed_target"
]

[objectives]
initial_active = ["wheel_heading_target_error"]
implemented = ["wheel_heading_target_error", "operating_state_wheel_heading_target_error"]
operating_state_aggregation = "sum_weighted_normalized_state_rms_v0.1.0"
future_available = ["steering_gain_variation", "rack_travel_usage", "turning_capability_margin", "packaging_margin", "joint_articulation_margin", "robustness", "effort", "vehicle_or_tire_informed_state_target_generation"]
rule = "Every active objective reports raw units, normalization scale, weight, sweep/state domain, and contribution. State weights remain visible inputs. Future objectives remain unavailable until their inputs and authorization exist."

[search_method]
method_id = "bounded_coordinate_pattern_search_v0.1.0"
implementation = "src/pssd_steering/optimization/search.py"
operating_state_adapter = "src/pssd_steering/optimization/operating_search.py"
method_document = "docs/models/steering/steering_nominal_optimizer_implementation_v0.1.0.md"
operating_state_document = "docs/models/steering/steering_operating_state_target_implementation_v0.1.0.md"
benchmark_ids = ["BENCH-STEER-0010", "BENCH-STEER-0011", "BENCH-STEER-0016", "BENCH-STEER-0017"]
result_record = "benchmarks/steering/steering_nominal_optimizer_result_v0.1.0.toml"
operating_state_result_record = "benchmarks/steering/steering_operating_state_target_result_v0.1.0.toml"
claim_boundary = "Deterministic development baseline only; no global-optimality or production-selection claim. Operating-state search reuses the same method and changes only the candidate-evaluation objective adapter."

[candidate_set]
return_multiple_candidates = true
nondominated_candidates_required_when_tradeoffs_exist = true
convenience_ranking_allowed = true
current_ranking = "nominal single-objective or explicit weighted state-objective aggregate among feasible candidates, depending on loaded study contract"
ranking_rule = "Ranking must expose every objective contribution, state weight, and hard-constraint margin. The full feasible candidate set or a declared retained subset remains available for comparison; current scalar aggregation is not a Pareto-completeness claim."

[future_providers]
pose_provider = "provider_neutral_contract_implemented_synthetic_only; reviewed WUFR/OptimumK/CAD/native-solver source still required for WUFR state claims"
operating_state_target_provider = "explicit_state_target_aggregation_implemented_for_review; synthetic and explicit-table construction routes available"
tire_vehicle_target_generator = "unavailable; reviewed vehicle/tire operating model required before tire-informed claims"
rack_load_provider = "unavailable"
uncertainty_provider = "unavailable"
physical_parameter_provider = "explicitly_deferred_until_Level_F_physical_data"

[prohibited_claims]
items = [
  "WUFR-27 geometry redesign recommendation",
  "WUFR-28 production geometry selection",
  "physical packaging feasibility",
  "manufacturing feasibility",
  "tire-optimal steering geometry from synthetic or manually weighted operating targets",
  "steering-effort optimization",
  "robustness or as-built validation",
  "global optimality or Pareto optimality from the current scalar development search"
]
