availability = "active"
unit = "ratio"
state = "complete_target_sweep"
blocking = true
lower_limit = 0.01
authority = "Development-only numerical/mechanism margin above the analyzer failure threshold; not a released design criterion."

[[constraints]]
id = "outer_pickup_depth_development_band"
