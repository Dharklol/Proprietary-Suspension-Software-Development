version = "0.1.0"
constraint_set_id = "STEERING_CONSTRAINT_PROVIDER_DEV_V0"
status = "development_only_non_design_authority"
authority = "Workflow-development constraint set. Active limits are broad mathematical or study bounds; unavailable entries identify evidence required before hardware-feasible ranking."

[[constraints]]
id = "tie_rod_joint_center_length"
evaluator = "tie_rod_joint_center_length"
availability = "active"
unit = "m"
state = "nominal_reference"
blocking = true
lower_limit = 0.20
upper_limit = 0.45
authority = "Broad development-only joint-center length band; not selected tie-rod hardware, adjustment, buckling, or procurement authority."

[[constraints]]
id = "minimum_singularity_ratio_design_margin"
