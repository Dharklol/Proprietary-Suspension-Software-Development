version = "0.1.0"
configuration_id = "WUFR26_DESIGN_NOMINAL_V0"
status = "candidate_for_bounded_prototype"
vehicle_revision = "WUFR-26"
purpose = "Nominal design-source rigid steering geometry for incremental mechanism closure and upright-rotation evaluation. Not an installed/as-built configuration."

[authorization]
authorization_id = "AUTH-STEER-0001"
model_id = "MOD-STEER-0001"
permitted_use = "Rigid rack-displacement-to-upright-rotation evaluation with closure, branch, feasibility, and singularity diagnostics."
prohibited_use = "Production design authority, absolute wheel heading, steering-wheel ratio, Ackermann/turning-radius claims without missing prerequisites, optimizer use, and as-built validation."

[conventions]
length_unit = "m"
angle_unit = "rad"
body_axes = "+x forward, +y vehicle left, +z upward"
handedness = "right-handed"
road_plane = "z = 0 in the recovered nominal OptimumK design frame"
positive_rack_displacement = "translation along +y"
reference_state = "centered nominal design geometry with nonzero static toe embedded in the imported upright/wheel orientation"
zero_upright_rotation = "imported nominal centered state; not zero toe"

[source_authority]
steering_axis_source = "WUFR-26 FINAL 8.21.2025.xlsx from OptimumK"
tie_rod_pickup_source = "WUFR-26 steering FDR final geometry table, front-left SolidWorks coordinates"
coordinate_adapter = "docs/conventions/wufr26_coordinate_frame_reconciliation.md"
response_comparison_source = "GEOMETRY FINAL.SLDPRT and 2026Ackermann.csv"
installed_state_authority = "future active assembly export or physical measurement"
source_role_rule = "Direct, transformed, mirrored, derived, and provisional values must remain distinguishable in result provenance."

[vehicle]
wheelbase = 1.5624
wheelbase_role = "nominal OptimumK design observation; not reconciled as an active as-built value"
steering_axis_ground_intersection_track = 1.2218435696063916
steering_axis_track_role = "derived from mirrored nominal steering axes intersected with z=0"

[rack]
axis_origin = [-0.079298, 0.0, 0.162865]
axis_direction = [0.0, 1.0, 0.0]
left_inner_joint_at_center = [-0.079298, 0.220980, 0.162865]
right_inner_joint_at_center = [-0.079298, -0.220980, 0.162865]
inner_joint_spacing = 0.441960
operational_displacement_min = -0.0127
operational_displacement_max = 0.0127
operational_domain_role = "provisional interpretation of 1.00 in total installed travel as +/-0.50 in from center"
center_definition = "midpoint between equal left and right stop limits; stop-state CAD/measurement confirmation pending"

[left]
side_role = "direct nominal front-left source geometry"
steering_axis_lower_point = [0.0, 0.587096, 0.157117]
steering_axis_upper_point = [-0.006487, 0.564662, 0.305056]
steering_axis_direction = [-0.043312828701657126, -0.14978880824618065, 0.9877688554485051]
steering_axis_ground_intersection = [0.006889447535808679, 0.6109217848031958, 0.0]
outer_tie_rod_joint_at_center = [-0.061933, 0.549102, 0.192223]
nominal_tie_rod_length = 0.32989010635816285
reference_branch_upright_rotation = 0.0
static_toe_presence = "confirmed nonzero in OptimumK/CAD nominal state"
static_toe_numeric_definition = "unresolved: OptimumK shows -1 deg per front-side field while the spec describes -1 deg axle sum"
wheel_forward_direction_at_center = "unavailable_pending_numerical_wheel_plane_export"

[right]
side_role = "derived nominal mirror assumption; not independently checked"
mirror_rule = "change the sign of canonical y for all front-left geometry"
steering_axis_lower_point = [0.0, -0.587096, 0.157117]
steering_axis_upper_point = [-0.006487, -0.564662, 0.305056]
steering_axis_direction = [-0.043312828701657126, 0.14978880824618065, 0.9877688554485051]
steering_axis_ground_intersection = [0.006889447535808679, -0.6109217848031958, 0.0]
outer_tie_rod_joint_at_center = [-0.061933, -0.549102, 0.192223]
nominal_tie_rod_length = 0.32989010635816285
reference_branch_upright_rotation = 0.0
static_toe_presence = "assumed mirrored from nominal front-left source state"
static_toe_numeric_definition = "unresolved"
wheel_forward_direction_at_center = "unavailable_pending_numerical_wheel_plane_export"

[capabilities]
closure_and_upright_rotation = true
mirror_comparison = true
branch_and_singularity_diagnostics = true
projected_road_wheel_heading = false
absolute_toe_inclusive_heading = false
steering_wheel_to_road_wheel_ratio = false
ackermann_error = false
turning_radius = false

[open_gates]
items = [
  "Independently export or measure front-right hardpoints.",
  "Export left/right wheel-plane forward directions and exact per-wheel static toe.",
  "Confirm installed rack stop positions and total versus operational travel.",
  "Recover pinion angle to signed rack displacement relation.",
  "Recover ride height, camber shim stack, tie-rod adjustment, and installed uncertainty.",
  "Reproduce the raw SolidWorks response and complete physical correlation before as-built claims."
]
